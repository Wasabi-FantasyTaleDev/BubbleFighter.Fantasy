    # ItemSpec4/ItemSpecDefault and ItemSpecZombiePve contain these kinds in the baseline
    # and the three later gameplay builds. The early CN2012 list excludes kind 229.
    random_supply_item_kinds: [101, 102, 104, 108, 109, 112, 115, 120, 121, 122, 123, 124, 125, 126, 127, 128, 129, 130, 131, 132, 134, 135, 136, 137, 138, 139, 141, 142, 143, 144, 145, 146, 147, 201, 203, 204, 207, 208, 209, 210, 211, 212, 213, 214, 215, 217, 218, 219, 220, 221, 222, 223, 224, 225, 226, 227, 228, 229]
    immediate_supply_item_kinds: [10, 11, 15, 16]
    # Rewards follow the end by about six seconds.
    result_reward_delay_ms: 6000
    result_close_grace_ms: 10000
    # Deployment reward thresholds, shared with the configured modern round flow.
    level_exp_table_path: "${BFF_LEVEL_EXP_TABLE:-data/level-experience.csv}"
    # Provisional sample-based rewards; coefficients can be calibrated without rebuilding.
    score_based_rewards: true
    reward_exp_multiplier: ${BFF_REWARD_EXP_MULTIPLIER:-100}
    reward_lucci_multiplier: ${BFF_REWARD_LUCCI_MULTIPLIER:-100}
    # Shared scheduling and draw weights; modes, rewards and native item identities stay per build.
    auto_start_delay_ms: 65000
    lottery_open_delay_ms: 0
    lottery_select_time_ms: 7000
    lottery_reveal_time_ms: 5000
    lottery_max_duplicates: 3
    lottery_repeat_weight_percent: 25
    lottery_crew_count_weights: [70, 25, 5]
    lottery_coin_count_weights: [45, 30, 18, 7]
    lottery_group_weights: [{ group: common, weight: 800 }, { group: small_parts, weight: 100 }, { group: mid_parts, weight: 40 }, { group: crew_set, weight: 40 }, { group: small_set, weight: 15 }, { group: mid_set, weight: 5 }]
- id: shop
  plugin: shop
  parent_id: inventoryview
  config:
    protocol: "${BFF_PROFILE_ID}/game"
    client_profile: "${BFF_PROFILE_ID}"
    version_major: ${BFF_BUILD_MAJOR}
    catalog_schema: "legacy"
    catalog_display_column: "${LEGACY_SHOP_NAME_COLUMN:-name}"
    # The build's own shop workbook, from its client data (kr-812 sub_9A04D0 loads Config/ShopItem2.xml).
    shop_item_client_path: "Config/ShopItem2.xml"
    max_shop_item_bytes: 134217728
    max_enter_shop_frame_bytes: 65000
    prefer_longest_duration: true
    prefer_longest_guns: true
    prefer_longest_clothes: true
    prefer_longest_grenades: true
    prefer_longest_hammers: true
    prefer_longest_packages: true
    longest_term_item_ids: []
    send_shop_catalog: true
    grant_purchased_items: true
    # ShopItem "endurance" stock sells as a life-counted item (kr-812 sub_993080); see the lobby row's life_items.
    life_items: true
    # A shop item can be bought for another player: charged to the sender when the gift is stored, delivered through
    # the same purchase transaction when the receiver takes it (packets/present.yaml).
    present_box: true
    max_presents_per_player: 100
    # Native reward previews resolve through the build's full workbook, including off-sale stocks and Lucci sets.
    # Missing or placeholder-only guides grant nothing. Explicit entries override native milestones. Login recovers
    # every attained, unclaimed milestone, including levels attained before enablement. Example:
    #   level_rewards:
    #     - { level: 5, stock_keys: [1001123] }
    #     - { level: 10, stock_keys: [1001124, 1001125] }
    #   level_reward_sender: "System"
    #   level_reward_message: "Level {level} reward"
    level_reward_client_path: "Config/LevelUpGuide.csv"
    level_rewards: []
    max_purchase_attempts: 3
