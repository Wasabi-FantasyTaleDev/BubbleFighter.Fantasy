# Rows for the Chinese 735 client profile (CN2016 0.2.70.4). Login plus main-menu
# GotoRoom/GotoMenu from dialect.messages. Shop, tutorial, and plaza are not
# installed; dialect.rooms is intentionally absent.
# 258-byte greeting (cn-735 sub_DCE930 reads 0x102 bytes), five-byte frame (cn-735 sub_CDFAD0(this, 5)),
# SimpleCipher seeds (0, 1) / (5, 3) in the TcpConnection ctor cn-735 sub_DCF2A0, shared tables.
- id: dialect
  plugin: dialect
  config:
    profile_id: "${BFF_PROFILE_ID}"
    frame: legacy_5
- id: protocol
  plugin: protocol
  config:
    opcode_table_path: profiles/cn-735/opcodes.yaml
    # The mandatory first packet, the patch-request slot: every legacy build names it
    # gcpFirstConnect; kr-1256 names the same slot gcpReqGamePatch.
    patch_request_name: gcpFirstConnect
    bootstrap_status: 2
    pre_handshake_opcodes: [19]
    bootstrap_command_line: "http://bf.dn.nexoncdn.co.kr/PatchData"
    center_gates:
      - key: 6
        sub_key: 1
        unknown1: 0
        address: "${BFF_PUBLIC_HOST:-127.0.0.1}"
        port: ${CN_735_PUBLIC_PORT:-7160}
- id: game-listener
  plugin: net.tcp
  config:
    listen: "${BFF_BIND_HOST:-0.0.0.0}:${CN_735_GAME_PORT:-7160}"
    protocol: "cn-735/game"
    max_connections: 512
    idle_timeout_seconds: 0
- id: dialect.messages
  plugin: dialect.messages
  config:
    # No play-room row is mounted here, so this row answers the plaza request itself.
    typed_plaza_enter: false
    protocol: "cn-735/game"
- id: lobby
  plugin: lobby
  config:
    protocol: "cn-735/game"
    # Known limitation: the password of gcpReqLogin is not checked, so any password logs in
    # as the named account, and auto_create_players creates an unknown account on first login.
    # authentication: ticket (the default) admits only redeemed launcher tickets; open admits any account name.
    auto_create_players: true
    fallback_username: "guest"
    # Redeem launcher launch tickets at game login; needs the launcher.http row (BFF_LAUNCHER_TICKETS).
    launcher_tickets: ${BFF_LAUNCHER_TICKETS:-false}
    # ticket: every login must redeem a launcher ticket (needs the launcher.http row). open: any account name
    # logs in, for a trusted LAN only. BFF_LOGIN_AUTHENTICATION sets it for every build at once.
    authentication: ${BFF_LOGIN_AUTHENTICATION:-ticket}
