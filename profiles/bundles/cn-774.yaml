# Rows for the Chinese 774 client profile (the 2019 build). The game listener answers
# gcpFirstConnect with the patch reply and the center list, and the lobby logs players in.
# 258-byte plaintext greeting (cn-774 sub_1046FC0), five-byte frame (receive loop cn-774 sub_1047420 frames
# on u16 length + 5), the shared cipher tables with seeds (0, 1) and (5, 3).
- id: dialect
  plugin: dialect
  # Stays loaded while the build sleeps: the shared dialect table is built from these rows, and a row that came or
  # went would restart that table and every build that frames packets through it.
  activation: always
  config:
    profile_id: "${BFF_PROFILE_ID}"
    frame: legacy_5
- id: protocol
  plugin: protocol
  config:
    opcode_table_path: profiles/cn-774/opcodes.yaml
    # The mandatory first packet, the patch-request slot: every legacy build names it
    # gcpFirstConnect; kr-1256 names the same slot gcpReqGamePatch.
    patch_request_name: gcpFirstConnect
    # The greeting handler treats status 2 as a normal connect, as in the other legacy builds.
    bootstrap_status: 2
    # A crash report (19) after a crashed session, and a 30-byte opcode 1500 on every
    # launch (local run), arrive ahead of gcpFirstConnect.
    pre_handshake_opcodes: [gcpReportLastCrash, gcpReqDynamicConfig]
    bootstrap_command_line: "http://bf.dn.nexoncdn.co.kr/PatchData"
    # The address and port the client reaches this listener on (its login.ini or launch
    # arguments). The gate values follow cn-324, the same client family.
    center_gates:
      - key: 6
        sub_key: 1
        unknown1: 0
        address: "${BFF_PUBLIC_HOST:-127.0.0.1}"
        port: ${CN_774_PUBLIC_PORT:-7190}
- id: game-listener
  plugin: net.tcp
  # Bound while the build sleeps: a client that connects is what wakes it.
  activation: always
  config:
    listen: "${BFF_BIND_HOST:-0.0.0.0}:${CN_774_GAME_PORT:-7190}"
    protocol: "cn-774/game"
    max_connections: 512
    idle_timeout_seconds: 0
# The message adapters every build shares: the login burst, the main-menu install and the bag publication.
# The build's sequence is its login values in packets/builds.yaml (it omits the gate list and the option sync,
# which this profile's protocol row and client do not read).
- id: dialect.messages
  plugin: dialect.messages
  config:
    protocol: cn-774/game
    # Every client sits on channel 60, "Free" (one shared lobby instead of split channels). The login reply's
    # channel word is what the round start reads its FighterConfigChannel column from (kr-812 sub_818680,
    # sub_587690); BFF_PLAYER_CHANNEL also feeds dialect.rooms player_channel and the cluster move. 0 = off.
    login_channel: ${BFF_PLAYER_CHANNEL:-60}
    login: true
    main_menu_init: true
    party: true
    # gspServerChatNoticeMsg in the chat log (layout ServerNotice@cn-774, packets/server-notice.yaml).
    server_notices: true
    inventory: true
    equipment_view: true
    equipment: true
    # The player menu's "view info": cn-774 sender sub_B277C0 (C2S 117), reader sub_BBA7A0, S2C 133
    # (packets/fighter-info.yaml). Needs the lobby row's fighter_info.
    fighter_info: true
    # The customized-key update and login restoration (packets/customized-keys.yaml; builder cn-774
    # sub_761B90, consumer cn-774 sub_BC5A20) for the player.settings row of the player-settings bundle.
    customized_keys: true
    # The gift box (packets/present.yaml): the client's own senders are cn-774 sub_7CAFA0 (both list pages),
    # cn-774 sub_7C48B0 (purchase), cn-774 sub_6AEEE0 (the take and discard stamps of the receive dialog), cn-774 sub_7C6940 and
    # cn-774 sub_7CB300 (the deletes) and cn-774 sub_B2C7E0 (close); the list replies are read by cn-774 sub_BB5CF0 (three
    # words plus the 88-byte record walk) and cn-774 sub_BB5EE0 (two words plus the vector). Needs the build's
    # present_box capability and the shop row of the modern-commerce bundle.
    # Opt in on both the dialect.messages and shop rows for native-client acceptance.
    present_box: false
    # The expired-item notice (packets/inventory.yaml ExpiredItems): cn-774 sub_BCF090 case 807 ->
    # cn-774 sub_BAE370 -> cn-774 sub_456D30 reads the counted u32 id list, and its consumer is armed from the startup
    # singletons, so the burst's last step lands after the menu like kr-1256's.
    expired_item_notices: true
- id: commands.players
  plugin: commands.players
  parent_id: lobby
  disabled: true
  config:
    protocol: "cn-774/game"
- id: lobby
  plugin: lobby
  parent_id: inventoryview
  config:
    protocol: "cn-774/game"
    # cn-774 inherits the kr-1256 login codec (dialect.messages login values) through its lineage.
    # Known limitation: the password of gcpReqLogin is not checked, so any password logs in
    # as the named account, and auto_create_players creates an unknown account on first login.
    # authentication: ticket (the default) admits only redeemed launcher tickets; open admits any account name.
    auto_create_players: true
    fallback_username: "guest"
    # Redeem launcher launch tickets at game login; needs the launcher.http row (BFF_LAUNCHER_TICKETS).
    launcher_tickets: ${BFF_LAUNCHER_TICKETS:-false}
    # ticket: every login must redeem a launcher ticket (needs the launcher.http row). open: any account name
    # logs in, for a trusted LAN only. BFF_LOGIN_AUTHENTICATION sets it for every build at once.
    authentication: ${BFF_LOGIN_AUTHENTICATION:-ticket}
    # The build's logged-in players by account, for the player menu's "view info" (one realm per build in `all`).
    online_players: true
    fighter_info: true
- id: party
  plugin: party
  parent_id: inventoryview
  config:
    protocol: cn-774/game
    max_members: 12
    invite_timeout_ms: 30000
    max_pending_invites: 1024
