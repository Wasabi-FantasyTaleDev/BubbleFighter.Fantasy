    config:
      science_lab: ${BFF_ITEM_ENHANCEMENT_ENABLED:-true}
      science_lab_configuration: ${BFF_ITEM_ENHANCEMENT_ENABLED:-true}
      favorite_weapon_grade_notices: ${BFF_FAVORITE_WEAPON_ENABLED:-true}
