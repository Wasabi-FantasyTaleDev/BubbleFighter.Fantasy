        # Permanent conversion (ChangeUnlimited): card and day threshold as the native configuration names them
        # (S2C 162 tab-5 card and its scalar threshold, kr-1256 sub_DCB180). Sets need a per-set quantity the client
        # does not state; one card per set is server policy.
        conversion:
          enabled: ${BFF_ITEM_ENHANCEMENT_ENABLED:-true}
          card_item_id: 190151
          minimum_days: 30
          set_card_quantity: 1
        # Grade-up (MakeItemAdvanced): the catalog has one grade-up card, 190247, which the native configuration names
        # for the tab. Cards are distinct per rule, so it serves the first grade step; one card per run is server policy.
        advancement:
          enabled: ${BFF_ITEM_ENHANCEMENT_ENABLED:-true}
          tab_card_item_id: 190247
          rules:
            - { card_item_id: 190247, source_tier: 3, card_quantity: 1 }
