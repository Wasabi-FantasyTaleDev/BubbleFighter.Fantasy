# KR1256: ShopItem2 ItemAttr 98/99 and RandomTable 87/88 are presence effects.
# Other builds require their own inventory, configuration and result-consumer audit before including this patch.
- insert:
    - id: item-enhancement.articles
      plugin: item-enhancement.articles
      parent_id: pets.entitlements
      isolated_services:
        - BubbleFighter.Fantasy.Contracts.Enhancement.IEquipmentArticleResolver
      config:
        # Persisted identities and earned modifiers remain usable after the economy is disabled.
        enabled: true
        initialize_articles: ${BFF_ITEM_ENHANCEMENT_ENABLED:-true}
        protocol: "${BFF_PROFILE_ID}/game"
        build_key: "${BFF_PROFILE_ID}"
        weapon_attribute_id: 98
        weapon_buff_id: 87
        clothing_attribute_id: 99
        clothing_buff_id: 88
        # Presents each weapon's Favorite points as the native attribute 164; awards live on the enhancement row.
        favorite:
          enabled: ${BFF_FAVORITE_WEAPON_ENABLED:-true}
    - id: item-enhancement
      plugin: item-enhancement
      parent_id: ingame
      config:
        enabled: ${BFF_ITEM_ENHANCEMENT_ENABLED:-true}
        protocol: "${BFF_PROFILE_ID}/game"
        build_key: "${BFF_PROFILE_ID}"
        weapon_attribute_id: 98
        weapon_buff_id: 87
        clothing_attribute_id: 99
        clothing_buff_id: 88
        # kr-1256 sub_DD5E70 sends the selected Article and additive flag; the config reply names these materials.
        card_item_id: 190111
        kit_item_ids: [190106, 190107, 190108, 190109]
        additive_item_id: 101745
        # The client states no success chance or debit; these defaults are server policy and each has its own variable.
        success_basis_points: ${BFF_ENHANCEMENT_SUCCESS_BASIS_POINTS:-5000}
        additive_success_basis_points: ${BFF_ENHANCEMENT_ADDITIVE_SUCCESS_BASIS_POINTS:-10000}
        card_quantity: ${BFF_ENHANCEMENT_CARD_QUANTITY:-1}
        kit_quantity: ${BFF_ENHANCEMENT_KIT_QUANTITY:-2}
        additive_quantity: ${BFF_ENHANCEMENT_ADDITIVE_QUANTITY:-1}
        # Successful weapon enhancement adds the workbook's IncreasePointEnchant points to the weapon; needs enabled enhancement.
        favorite:
          enabled: ${BFF_FAVORITE_WEAPON_ENABLED:-true}
        modification:
          enabled: ${BFF_ITEM_MODIFICATION_ENABLED:-true}
          # The parts, their seven selectors and signed values, and both weight tables are the native laboratory
          # configuration (S2C 162 ModificationConfig and ModificationRandomTable, kr-1256 sub_114BF10, sub_114B040).
          # The client states no debit or price, so these four are server policy; override them in a local patch.
          part_quantity: 1
          apply_lucci_cost: 0
          delete_lucci_cost: 0
          parts:
            - { item_id: 102461, numeric_tag: 0, effect_category: 1, attribute_ids: [101, 102, 103, 104, 105, 106, 107], value0: 160,
                negative_values: [{ attribute_id: 101, value: -40 }, { attribute_id: 102, value: -360 }, { attribute_id: 103, value: -160 }, { attribute_id: 104, value: -160 }, { attribute_id: 105, value: -50 }, { attribute_id: 106, value: -240 }, { attribute_id: 107, value: -60 }] }
            - { item_id: 102462, numeric_tag: 0, effect_category: 2, attribute_ids: [108, 109, 110, 111, 112, 113, 114], value0: 120,
