    name_source: label@cn-738
    evidence: verified
    source: "UTF-16 gspGotoRoom; cn-738 sub_CF9460 stamps 112; cn-738 sub_A76920 reads SessionSetting cn-738 sub_429050, the two slot words, UserSlot vector cn-738 sub_A77370, equipment vector cn-738 sub_A76820, bool32 and u32"
    notes: "kind 1 SessionSetting opens the character session before gspGotoMenu"
