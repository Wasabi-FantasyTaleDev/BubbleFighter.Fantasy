# Profile patch for cn-717: applied after the bundle rows. The admin API moves off 8080
# so this profile can run beside other profiles on one machine.
- replace:
    id: admin.http
    config:
      listen: "${CN_717_ADMIN_HOST:-127.0.0.1}:${CN_717_ADMIN_PORT:-8084}"
- replace:
    id: diagnostics.packet-log
    config:
      file: logs/{date}/packets-cn-717_{timestamp}.log
      preview_bytes: 96
- set:
    id: protocol
    config:
      pre_handshake_opcodes: [19]
      bootstrap_command_line: "http://bf.dn.nexoncdn.co.kr/PatchData"
- set:
    id: shop
    config:
      max_purchase_attempts: ~

