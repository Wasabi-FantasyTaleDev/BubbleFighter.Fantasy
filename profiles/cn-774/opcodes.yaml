profile: cn-774
# Opcode assignments for the Chinese 774 client. C2S and S2C are separate numeric spaces.
# This build ships without packet class names, but its S2C dispatcher sub_BCF090 stores each
# case's packet name string (jumptable 00BCF218, the case number is the opcode); S2C names
# below come from there. See profiles/opcode-policy.md.
opcodes:
  - value: 808
    direction: c2s
    name: gcpReqInventoryThrowItem
    name_source: label@kr-812
    evidence: verified
    source: "cn-774 sub_9B4BC0 stamps 808 and writes the selected inventory item ID as one u32 after confirmation, rejecting category 6; matches kr-812 sub_984930 / Packet_gcpReqInventoryThrowItem and kr-1256 sub_8136F0; S2C 815 sub_BB4930 reads item ID and result"
    connection: game
  - value: 2017
    direction: c2s
    name: gcpUserUpdateCustomizedKeyList
    name_source: label@kr-812
    evidence: inferred
    source: "cn-774 sub_761B90 stamps 2017 and serializes a default flag plus control-name/key rows through cn-774 sub_1060600; matched to kr-812 Packet_gcpUserUpdateCustomizedKeyList in kr-812 sub_4EB250 and row serializer kr-812 sub_9858F0"
  - value: 520
    direction: c2s
    connection: game
    name: gcpRoomSendAmpMsg
    name_source: mirrored
    evidence: inferred
    source: "cn-774 sub_BD61A0 stamps 520 and writes the same four-field body as kr-812 Packet_gcpRoomSendAmpMsg via kr-812 sub_845040; the trailing words remain context-dependent"
  - value: 513
    direction: c2s
    connection: game
    name: gcpRoomChangeGameSetting
    name_source: label@kr-812
    evidence: inferred
    source: "cn-774 sub_B6A610 submits the map dialog through cn-774 sub_769C70 and builder cn-774 sub_7368B0/sub_1059BB0; matches kr-812 Packet_gcpRoomChangeGameSetting via kr-812 sub_5C8810, with its own four-string/twelve-word body"
  - value: 514
    direction: c2s
    connection: game
    name: gcpRoomChangeRoundSetting
    name_source: label@kr-812
    evidence: inferred
    source: "cn-774 sub_B6A610 sends round index 0/1/2 and two map-dialog strings after selection; matches kr-812 Packet_gcpRoomChangeRoundSetting in kr-812 sub_5BD770 via kr-812 sub_5C86C0, reader kr-812 sub_5C8FE0"
  - value: 508
    direction: c2s
    connection: game
    name: gcpRoomReqChangeMaster
    name_source: label@kr-812
    evidence: inferred
    source: "cn-774 sub_8E0220 stamps508 and writes the target nickname; same delegation request as kr-812 Packet_gcpRoomReqChangeMaster via kr-812 sub_801C60/sub_809CB0"
  - value: 507
    direction: s2c
    connection: game
    name: gspRoomRepChangeMaster
    name_source: label@kr-812
    evidence: verified
    source: "cn-774 sub_8D7D20 case0x1FB -> cn-774 sub_8E0350 reads nickname and result; matches kr-812 Packet_gspRoomRepChangeMaster in kr-812 sub_801D00"
  - value: 506
    direction: s2c
    connection: game
    name: gspRoomChangeInventory
    name_source: mirrored
    evidence: verified
    source: "cn-774 sub_8D7D20 case0x1FA -> cn-774 sub_8DCEE0 reads three words and a counted word vector; the first word indexes the room seat"
  - value: 584
    direction: s2c
    name: gspGameMapLoadingComplete
    name_source: label@kr-812
    evidence: verified
    source: "cn-774 sub_8D7D20 case 0x248 reads one seat word and marks room+32764+seat; matched to kr-812 Packet_gspGameMapLoadingComplete, sub_80A910 -> sub_802AB0 at S2C 701"
  - value: 585
    direction: s2c
    name: gspGameEverybodyLoadingComplete
    name_source: label@kr-812
    evidence: verified
    source: "cn-774 sub_8D7D20 case 0x249 reads three bool32 words: room+32808/+32809 and sub_B58530; matches kr-812 Packet_gspGameEverybodyLoadingComplete, sub_5C8C00 -> sub_802E60 at S2C 702"
