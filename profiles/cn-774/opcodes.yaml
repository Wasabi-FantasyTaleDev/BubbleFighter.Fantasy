profile: cn-774
# Opcode assignments for the Chinese 774 client. C2S and S2C are separate numeric spaces.
# This build ships without packet class names, but its S2C dispatcher sub_BCF090 stores each
# case's packet name string (jumptable 00BCF218, the case number is the opcode); S2C names
# below come from there. See profiles/opcode-policy.md.
opcodes:
  - value: 510
    direction: c2s
    connection: game
    name: gcpReqKickFromSession
    name_source: label@kr-812
    evidence: verified
    source: "cn-774 sub_B6C020 confirms a room-player removal, stamps 510 and writes one counted UTF-16 target nickname; matched to kr-812 Packet_gcpReqKickFromSession builder kr-812 sub_5C8730 and reader kr-812 sub_5C8FD0"
  - value: 513
    direction: s2c
    connection: game
    name: gspRepKickFromSession
    name_source: label@kr-812
    evidence: verified
    source: "cn-774 sub_8D7D20 case 0x201 dispatches to cn-774 sub_8DF970; cn-774 sub_8DF970 reads two counted UTF-16 nicknames and a u32 result, matched to kr-812 Packet_gspRepKickFromSession handler kr-812 sub_8014B0 and reader kr-812 sub_80AE00"
    notes: "Requester nickname, removed nickname, result; zero announces removal in RoomStage8vs8, while nonzero results display a failure to the requester."
  - value: 827
    direction: c2s
    connection: game
    name: gcpReqCheckCash_
    name_source: coined
    evidence: verified
    source: "cn-774 sub_609D70 stamps 827 without a body; cn-774 sub_63ED80 sends it from DlgBubbleCashIntro and cn-774 sub_641B80 rearms its cash refresh timer immediately after sending"
    notes: "The sender does not gate native stage progression on the cash reply. Gateway validates this auxiliary request without supplying account balances."
