# WeaponMaster (round mode 26) on cn-774, the same rules as kr-1256: six levels, 200 experience apart, a kill worth
# 100, the first seat to reach level 6 wins. Every weapon of the pool is in cn-774's own weapon list
# (Config/ItemSpecGraphWeapon_Generated.csv holds 200000 plus each id), and its Config/GameOption.xml states the
# same WeaponMasterNoPangDeadCount (2). The client has no pool or experience table of its own, so all of this is
# server policy; replace it in a local patch.
- set:
    id: dialect.rooms
    config:
      weapon_master: true
- set:
    id: ingame
    config:
      native_life_every_mode: true
      weapon_master_experience:
        - { event: kill, points: 100 }
      weapon_master_levels: [{ experience: 0 }, { experience: 200 }, { experience: 400 }, { experience: 600 }, { experience: 800 }, { experience: 1000 }]
      weapon_master_weapons:
        - { item: 2011, weight: 1 }
        - { item: 2012, weight: 1 }
        - { item: 2014, weight: 1 }
        - { item: 2021, weight: 1 }
        - { item: 2022, weight: 1 }
