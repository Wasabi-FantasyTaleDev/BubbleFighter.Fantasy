# Profile patch for cn-774: applied after the bundle rows.
- replace:
    id: diagnostics.packet-log
    config:
      packets_enabled: ${BFF_PACKET_LOG:-false}
      capture_enabled: ${BFF_PACKET_CAPTURE:-false}
      file: logs/{date}/packets-cn-774_{timestamp}.log
      preview_bytes: 96

# Login and purchases share the same repository-backed bag and wallet.
- set:
    id: lobby
    config:
      inventory_source: mysql
      money_source: mysql
      seed_starter_inventory: true
      build_values: true
      starting_lucci: 10000000
      starting_cash: 10000000

# The modern gift box: both rows together (the shop row's service and the dialect row's bindings).
# The capability is inherited true and the layouts are restated in packets/present.yaml per build;
# the claim rides the inventory push path each profile already publishes.
- set:
    id: dialect.messages
    config:
      present_box: true
      cash_inbox: true
- set:
    id: shop
    config:
      present_box: true
      cash_inbox: true

# cn-774 sub_89E020 / cn-774 sub_8D7D20 establish the score-unit request and point delta.
- set:
    id: dialect.rooms
    config:
      pve_points: true
      # cn-774 sub_959650 waits for the wave reply; cn-774 sub_958DE0 waits for the spawn-table reply.
      npc_rounds: true
- set:
    id: ingame
    config:
      # Own AiFighterConfig maps ZombiePve units to 0..15. Awards are configurable server policy.
      pve_point_mode_id: 16
      pve_point_unit_values: [4, 3, 10, 11, 15, 15, 20, 20, 15, 15, 20, 20, 15, 15, 20, 20]

# Own ItemSpec4 sheets define these kinds; the enabled ItemSpecItem rows define mode 3.
- set:
    id: dialect.rooms
    config:
      supply_items: true
      counted_pve_items: true
- set:
    id: ingame
    config:
      native_item_slot_count: 2
      random_supply_item_kinds: [101, 102, 104, 108, 109, 112, 115, 122, 124, 126, 127, 129, 130, 135, 136, 138, 141, 146, 147, 220, 229, 230, 231, 235, 236, 300, 302, 303]
      immediate_supply_item_kinds: [10, 11, 15, 16]
      item_mode_ids: [3]
      item_mode_kinds: [104, 101, 109, 112, 122, 115, 126, 127, 129, 130, 108, 136, 138, 141, 300, 302, 303]

      # Own mode-16 hotkeys select 1..3; this three-item selection is configurable server policy.
      counted_item_mode_id: 16
      counted_item_slot_count: 3
      counted_item_kinds: [229, 146, 136]
      # Other enabled cooperative pickups apply their native effect without occupying a numbered slot.
      counted_immediate_item_kinds: [17, 101, 102, 124, 135, 147, 220, 303]
- set:
    id: dialect.rooms
    config:
      plaza_recruitment: true
- set:
    id: ingame
    config:
      plaza_recruitment: true

# The clan window: the clan bundle mounts the row on the game listener's protocol and this option binds the
# game-connection clan routes (packets/clan.yaml); the pair lands together, as on kr-1256.
- set:
    id: dialect.messages
    config:
      clan: true
# Like kr-1256, this build asks for a clan passport on every clan-server hello, so none is sent unasked.
- set:
    id: clan
    config:
      passport_on_login: false

# The Mysterystore (packets/mystery-store.yaml, packets/builds.yaml mystery_store). The coin is item 100386, this build's
# Magic Coin (魔法币), and the offers are the 115 StockSets that cn-774's ShopItem2 workbook files under the Mystery main
# category and that are off sale in the ordinary shop (15 more Mystery-category sets are on sale there and stay out of the
# pool). Prices, refresh cost and rotation are this server's economy; the client reads them from the reply.
- set:
    id: shop
    config:
      mystery_store:
        coin_item_id: 100386
        offers: ["2100682", "2110020-2110024", "2110090-2110096", "2110099-2110119", "2110168-2110181", "2110267-2110273", "2110507-2110513", "2111114-2111121", "2111330", "2111334-2111340", "2111486", "2111489-2111495", "2111658-2111659", "2111685-2111698", "2111790", "2112052", "2112264", "2112277", "2112389-2112390", "2112399", "2112521-2112522", "2112599", "2112603", "2112607", "2112615"]
        offer_coin_price: 100
        refresh_coin_cost: 10
        rotation_seconds: 21600
        group_stock_variants: false
