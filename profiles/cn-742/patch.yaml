# Profile patch for cn-742: applied after the bundle rows. The admin API moves off 8080
# so this profile can run beside other profiles on one machine.
- replace:
    id: admin.http
    config:
      listen: "${CN_742_ADMIN_HOST:-127.0.0.1}:${CN_742_ADMIN_PORT:-8090}"
- replace:
    id: diagnostics.packet-log
    config:
      file: logs/{date}/packets-cn-742_{timestamp}.log
      preview_bytes: 96
