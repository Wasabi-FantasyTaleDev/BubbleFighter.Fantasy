profile: cn-742
# Opcode assignments for the Chinese 742 client (CN2017 0.2.74.01). C2S and S2C are
# separate numeric spaces. Login plus main-menu GotoRoom/GotoMenu are wired; shop,
# tutorial, and plaza are not claimed here. See profiles/opcode-policy.md.
opcodes:
  - value: 1
    direction: c2s
    name: gcpFirstConnect
    name_source: mirrored
    evidence: verified
    source: "ClientVersion_Major 742 written on the connect path (for example v4 = 742); handshake number shared with cn-735"
  - value: 19
    direction: c2s
    name: gcpReportLastCrash
    name_source: mirrored
    evidence: inferred
    source: "mirrors cn-735 opcode 19; same pre-handshake role on the mid-CN family"
  - value: 3
    direction: c2s
    name: gcpReqLogin
    name_source: mirrored
    evidence: verified
    source: "serializer sub_796D70 / object ctor sub_796E80: three wstr, adapter vector at +88, u32 at +104 and +108"
  - value: 2
    direction: s2c
    name: gspRepGamePatch
    name_source: label@cn-742
    evidence: verified
    source: "UTF-16 gspRepGamePatch in BubbleFighterU.exe; number shared with cn-735"
  - value: 3
    direction: s2c
    name: gspRepLogin
    name_source: label@cn-742
    evidence: verified
    source: "UTF-16 gspRepLogin; LoginResponse deserialize sub_9C6420, LoginNational sub_9C6670"
    notes: "LoginResponse + LoginNational; success body ends with national flag 1"
  - value: 17
    direction: s2c
    name: gspCenterList
    name_source: mirrored
    evidence: inferred
    source: "mirrors cn-735 opcode 17; mid-CN family shares the gate-list number"
  - value: 110
    direction: s2c
    name: gspGotoMenu
    name_source: mirrored
    evidence: inferred
    source: "mirrors cn-735 sub_A5B160 / opcode 110; mid-CN family shares the menu number"
    notes: "sent after gspGotoRoom so MainMenuStage opens"
  - value: 111
    direction: s2c
    name: gspGotoLobby
    name_source: mirrored
    evidence: inferred
    source: "mirrors cn-735 sub_A5B080 / opcode 111"
    notes: "number reserved; plaza path not wired for this profile"
  - value: 112
    direction: s2c
    name: gspGotoRoom
    name_source: label@cn-742
    evidence: verified
    source: "UTF-16 gspGotoRoom; cn-742 sub_9BD720 reads SessionSetting cn-742 sub_42CC90, the two slot words, UserSlot vector cn-742 sub_9BE1B0, equipment vector cn-742 sub_9BD610, bool32 and u32; cn-742 sub_42D560 seats include the two-word ArenaLevel cn-742 sub_4014C0"
    notes: "kind 1 SessionSetting opens the character session before gspGotoMenu"
  - value: 106
    direction: c2s
    name: gcpReqGotoLobby
    name_source: mirrored
    evidence: inferred
    source: "cn-742 senders sub_6D6620 stamp 106 through its frame header with an empty body, as cn-717 gcpReqGotoLobby does; the build has no class labels"

