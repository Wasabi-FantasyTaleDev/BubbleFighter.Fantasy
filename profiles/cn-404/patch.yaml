# Profile patch for cn-404: applied after the bundle rows (see profiles/kr-1256/patch.yaml
# for the supported operations). The admin API moves off 8080 so this profile can run
# beside the other builds on one machine.
- set:
    id: dialect.scene-seeds
    config:
      # cn-404 sub_503990 consumes seed decisions without adding the equipped weapon's chance.
      weapon_critical_bonuses: true
      weapon_workbook_max_bytes: 33554432
- replace:
    id: admin.http
    config:
      listen: "${CN_404_ADMIN_HOST:-127.0.0.1}:${CN_404_ADMIN_PORT:-8095}"
- replace:
    id: diagnostics.packet-log
    config:
      file: logs/{date}/packets-cn-404_{timestamp}.log
      preview_bytes: 96
# The opt-in reward pool uses this build's own Config/ShopItem2.xml: the award dialog, selection, reveal and
# close rows are audited (dispatcher cn-404 sub_7AFA70 cases 734/743/744, sender cn-404 sub_9B7BD0 stamps
# C2S gcpReqSelectAward), and the pool below validates against this workbook's Stock and StockSet rows.
- set:
    id: dialect.rooms
    config:
      horde_lottery: false
- set:
    id: ingame
    config:
      # Pirate (horde) rooms start on the native five-second countdown once every seat is taken or
      # closed: the RoomStage gate cn-404 sub_5887F0 has id-400 sub_626970's body.
      auto_start_mode_ids: [101, 102, 16]
      # Native mode 103 is the prologue horde-tutor stage; the wave rounds are 101 and 102.
      lottery_modes: []
      # Native Stock and StockSet identities are validated when reward cards are enabled.
      lottery_grouped_draw: true
