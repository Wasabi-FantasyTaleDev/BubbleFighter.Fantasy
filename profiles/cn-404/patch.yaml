# Life-counted items: this build's executable has no "endurance" ShopItem duration type (no item kind 3) and no Life
# notice text, so the daily life rule and life stock are off (packets/builds.yaml life_items: false).
- set:
    id: lobby
    config:
      life_items: false
- set:
    id: shop
    config:
      life_items: false

# The baseline states the customized-key binding (kr-812 sub_4EB250 / kr-812 sub_8357D0); this build's own
# builder and login consumer are not audited, so the option stays off until they are.
- set:
    id: dialect.messages
    config:
      customized_keys: false
- set:
    id: dialect.rooms
    config:
      plaza_recruitment: true
- set:
    id: ingame
    config:
      plaza_recruitment: true
