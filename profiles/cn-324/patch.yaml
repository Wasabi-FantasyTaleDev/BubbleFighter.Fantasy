# Profile patch for cn-324: applied after the bundle rows. The admin API moves off 8080
# so this profile can run beside other profiles on one machine.
- replace:
    id: admin.http
    config:
      listen: "${CN_324_ADMIN_HOST:-127.0.0.1}:${CN_324_ADMIN_PORT:-8083}"
- replace:
    id: diagnostics.packet-log
    config:
      file: logs/{date}/packets-cn-324_{timestamp}.log
      preview_bytes: 96
      console_packets: false
      preview_handled_opcodes: [502, 503, 517, 702, 704, 705, 707, 713, 728, 803, 804, 805, 901, 903, 904, 908, 923, 924, 32862, 32892, 32920]
- set:
    id: ingame
    config:
      # CN324 needs the end gate first; its first scoreboard follows immediately.
      # Only builds whose time-over end carries the scoreboard use this delay; kr-812 sends team totals.
      result_scoreboard_delay_ms: 0
      # Boss rooms have no start button: once every seat is taken or closed, cn-324 sub_5AD610 runs the native
      # final five seconds for mode 16 (room+48) and the master's client enters with its map. A CN2012/CN2011
      # difference: kr-812's countdown readers sub_5C6850 / sub_5C67E0 test room-type flags, not a mode.
      auto_start_mode_ids: [16]
      # cn-324 sub_63B230 -> sub_455ED0 compares team totals for horde mode 101.
      cooperative_score_outcome_modes: []
      zombie_conversion_mode_id: 16
      zombie_round_time_limit_ms: 600000
      # Rescue timings are configurable reconstruction values; native spawner counts are map resource data.
      rescue_mode_id: 16
      rescue_start_times_ms: [20000, 45000, 70000, 95000, 120000, 145000]
      rescue_duration_ms: 25000
      rescue_cooldown_ms: 25000
      # Native ZombiePve map CHR_SPAWNER: NameID 31 starts at clock 185000, including countdown.
      rescue_stop_time_ms: 185000
      # MissionInfo_Clt.xml rows paired with CHR_PROPERTY names in the map ZombiePve resources.
      rescue_mission_ids: [1, 4, 7, 10, 13, 16, 19, 22]
      rescue_citizen_names: [ms_citizen, ms_citizen1, ms_citizen2, ms_citizen3, ms_citizen4, ms_citizen5, ms_citizen6, ms_citizen7]
      rescue_map_enemy_counts:
        - map_key: rel_zombie02_Twobridge
          enemy_counts: [2, 3, 3, 3, 4, 4]
        - map_key: rel_zombie03_Circle
          enemy_counts: [2, 3, 3, 4, 4, 4]
        - map_key: rel_zombie04_1_Oneway
          # This advanced map declares MAXINGAMEMISSIONCNT=0; its leftover groups are inactive.
          enemy_counts: []
        - map_key: rel_zombie04_Oneway
          enemy_counts: [2, 2, 3, 3, 4, 4]
        - map_key: rel_zombie05_Tear
          enemy_counts: [2, 2, 3, 3, 4, 4]
        - map_key: rel_zombie06_Frontal
          enemy_counts: [2, 2, 3, 3, 4, 4]
        - map_key: rel_zombie_01
          enemy_counts: [2, 3, 3, 3, 4, 4]
      counted_item_mode_id: 16
      # CN324 ItemSpecZombiePve: medipack, shield, booster, bazookaPVE, airBomb.
      counted_item_kinds: [120, 102, 101, 146, 136]
      counted_item_slot_count: 5
      counted_immediate_item_kinds: []
      native_item_slot_count: 2
      lottery_modes: [101, 102, 103]
