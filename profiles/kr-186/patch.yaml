# Profile patch for kr-186: it starts as cn-279's, the nearest build; the cn-279 addresses below are cn-279's evidence.
# kr-186 has no GPK (no Packet_gcpStartGPK class), so no auxiliary prefix is sent.
# This development profile uses bounded process-local storage; restarting clears it.
- replace:
    id: persistence.mysql
    disabled: true
- replace:
    id: persistence.memory
    disabled: false
- replace:
    id: diagnostics.packet-log
    config:
      packets_enabled: ${BFF_PACKET_LOG:-false}
      capture_enabled: ${BFF_PACKET_CAPTURE:-false}
      file: logs/{date}/packets-kr-186_{timestamp}.log
      preview_bytes: 96
- set:
    id: protocol
    config:
      # kr-186 has no Packet_gspCenterList class and its game dispatcher sub_67E140 has no center-list case:
      # the client logs in straight after gspRepGamePatch, so no gate list is sent.
      center_gates: []
      bootstrap_command_line: ""
      max_payload_bytes: 65535
- set:
    id: lobby
    config:
      # This build's complete ShopItem workbook has no audited rename consumable.
      rename_item_id: 0
      recording_always_create_character: false
- set:
    id: dialect.messages
    config:
      # kr-186's present family has no sub-list packets (its sub_67E140 cases 815..826 carry no
      # gspRepPresent*SubList), so the gift box stays off until its own lists are mapped.
      present_box: false
      # The player menu's "view info" is served from FighterInfoReply@cn-279 (packets/fighter-info.yaml).
      server_notices: true
      # cn-279 sub_664890 stamps 805 and sub_450430 reads item/quantity/parameters; paint is independent of rename.
      inventory_item_use: true
      packets_directory: packets
      # This build's customized-key builder and login consumer are not audited; only kr-812's are.
      customized_keys: false
- replace:
    id: dialect.rooms
    parent_id: clientdata
- set:
    id: dialect.rooms
    config:
      room_inventory_selection: true
      # This early client has no audited consumable revival request.
      instant_revival: false
      # Item boxes: this build has the map report, creation, pickup, grant and use packets (cn-279 sub_8205F0,
      # sub_81FF70, sub_8190C0, sub_820120, sub_81BB50) in its own, shorter envelopes, but no switch packet, no team
      # box and no direct-effect echo (packets/map-supplies.yaml).
      supply_items: true
      # kr-186 has no horde mode (no horde classes or strings).
      horde_lottery: false
      counted_pve_items: false
      # Mode 8 builds ZombieModeMgr here too (cn-279 sub_811B90 -> sub_747480): its team-change event 20,
      # cn-279 sub_7454E0, makes the first seat moved to team 14 the king, and its event 99, cn-279
      # sub_73DA40, sends gcpRoomChangeTeam (513) on death. The cooperative zombie mode stays off through
      # zombie_conversion_mode_id: 0.
      zombie_conversion: true
      pve_points: false
      rescue_missions: false
      # cn-279 sub_7A7300 sends the selected mode; cn-279 sub_7A6420 consumes the search result.
      quick_matching: true
      # The native notice sends a play request; route it to the old isTutorial map.
      tutorial_move_in: true
      tutorial_use_old_map: true
- set:
    id: ingame
    config:
      # kr-186 has no award dialog (cn-279 S2C 727 has no counterpart in kr-186 sub_686740), so no reward cards.
      lottery_modes: []
      instant_revival_item_id: 0
      # Stock and currency-only StockSet identities are validated against this build at activation.
      lottery_grouped_draw: true
      lottery_items:
        - {"group": "crew", "item_id": 100207, "display_id": 1000655, "days": 7, "weight": 12, "note": "crew item 100207, native amount 7"}
        - {"group": "crew", "item_id": 100206, "display_id": 1000654, "days": 7, "weight": 12, "note": "crew item 100206, native amount 7"}
        - {"group": "crew", "item_id": 100204, "display_id": 1000652, "days": 7, "weight": 12, "note": "crew item 100204, native amount 7"}
        - {"group": "crew", "item_id": 100203, "display_id": 1000651, "days": 7, "weight": 12, "note": "crew item 100203, native amount 7"}
        - {"group": "crew", "item_id": 100207, "display_id": 1000924, "days": 3, "weight": 60, "note": "crew item 100207, native amount 3"}
        - {"group": "crew", "item_id": 100206, "display_id": 1000923, "days": 3, "weight": 60, "note": "crew item 100206, native amount 3"}
        - {"group": "crew", "item_id": 100204, "display_id": 1000921, "days": 3, "weight": 60, "note": "crew item 100204, native amount 3"}
        - {"group": "crew", "item_id": 100203, "display_id": 1000920, "days": 3, "weight": 60, "note": "crew item 100203, native amount 3"}
        - {"group": "common", "item_id": 100141, "display_id": 1000429, "days": 7, "weight": 12, "note": "common item 100141, native amount 7"}
        - {"group": "common", "item_id": 100144, "display_id": 1001025, "days": 7, "weight": 12, "note": "common item 100144, native amount 7"}
        - {"group": "common", "item_id": 100144, "display_id": 1001023, "days": 1, "weight": 25, "note": "common item 100144, native amount 1"}
        - {"group": "common", "item_id": 100044, "display_id": 1000100, "days": 1, "weight": 25, "note": "common item 100044, native amount 1"}
        - {"group": "common", "item_id": 100086, "display_id": 1000260, "days": 1, "weight": 25, "note": "common item 100086, native amount 1"}
        - {"group": "common", "item_id": 100046, "display_id": 1000927, "days": 1, "weight": 25, "note": "common item 100046, native amount 1"}
        - {"group": "common", "item_id": 100086, "display_id": 1000261, "days": 3, "weight": 60, "note": "common item 100086, native amount 3"}
        - {"group": "common", "item_id": 100044, "display_id": 1000934, "days": 3, "weight": 60, "note": "common item 100044, native amount 3"}
        - {"group": "common", "item_id": 205002, "display_id": 1000936, "quantity": 10, "stackable": true, "weight": 1, "note": "common item 205002, native amount 10"}
        - {"group": "common", "item_id": 100046, "display_id": 1000928, "days": 3, "weight": 60, "note": "common item 100046, native amount 3"}
        - {"group": "common", "item_id": 100141, "display_id": 1000428, "days": 3, "weight": 60, "note": "common item 100141, native amount 3"}
        - {"group": "common", "item_id": 100141, "display_id": 1000427, "days": 1, "weight": 25, "note": "common item 100141, native amount 1"}
        - {"group": "common", "item_id": 100044, "display_id": 1000101, "days": 7, "weight": 12, "note": "common item 100044, native amount 7"}
        - {"group": "common", "item_id": 100046, "display_id": 1000113, "days": 7, "weight": 12, "note": "common item 100046, native amount 7"}
        - {"group": "common", "item_id": 100086, "display_id": 1000262, "days": 7, "weight": 12, "note": "common item 100086, native amount 7"}
        - {"group": "coin", "display_id": 2000061, "lucci": 100, "weight": 1, "note": "native currency bundle 100"}
        - {"group": "coin", "display_id": 2000062, "lucci": 300, "weight": 1, "note": "native currency bundle 300"}
        - {"group": "coin", "display_id": 2000063, "lucci": 500, "weight": 1, "note": "native currency bundle 500"}
        - {"group": "coin", "display_id": 2000064, "lucci": 1000, "weight": 1, "note": "native currency bundle 1000"}
        - {"group": "coin", "display_id": 2000065, "lucci": 3000, "weight": 1, "note": "native currency bundle 3000"}
      counted_item_mode_id: 0
      counted_item_kinds: []
      counted_immediate_item_kinds: []
      zombie_conversion_mode_id: 0
      # cn-279 sub_7DD5E0 raises event 54; cn-279 sub_732F00 sends kind 104 with object -1 when its gauge is ready.
      # cn-279 sub_81BB50 confirms it; cn-279 sub_884050 emits the native attribute through cn-279 sub_818940.
      zombie_king_ultra_item_kind: 104
      # CN2011 has no Captain exchange.
      captain_ultra_item_kind: 0
      pve_point_mode_id: 0
      rescue_mode_id: 0
      native_item_slot_count: 1
      # cn-279 sub_89DD80 latches a collided box before pickup; cn-279 sub_81BDA0 accepts seat -1 for removal alone.
      renew_full_slot_supplies: true
      # Config/ItemSpec.xml marks ordinary and zombie ammunition as magazineUp (121) and magazineUpZombie (10).
      # cn-279 sub_85CA50 applies these through gspItemUsed and then clears the held item via sub_7E8370;
      # the dialect restores the previously selected item after the effect.
      immediate_supply_item_kinds: [10, 121]
      # The 2011 client picks its item sheet by room grade (cn-279 sub_885A70: ItemSpec + Junior, Rookie,
      # Intermediate, ...), not by mode, and its Config/ItemSpec.xml rows carry no enabled flag. The kinds with a
      # weight in any grade sheet are these seventeen; none of the kinds 136 to 141 exists in this build, so there is
      # no bazooka, air bomb, turret, machine gun or shield field, and the giant drink (112) is among them.
      random_supply_item_kinds: [101, 102, 108, 109, 112, 115, 122, 123, 124, 125, 126, 127, 128, 129, 130, 131, 132]
      # Mode 3 loads no sheet of its own here, so the item mode offers all of them. This build has no team box:
      # its map report has no team vector and its item box has no team (cn-279 sub_89E0A0, sub_89DD80).
      item_mode_ids: [3]
      item_mode_kinds: [101, 102, 108, 109, 112, 115, 122, 123, 124, 125, 126, 127, 128, 129, 130, 131, 132]
      # Server policy: mode 3 reports no native random-box points; reuse map helpers for neutral periodic boxes.
      item_mode_fallback_point_count: 4
      # cn-279 sub_704EC0 can return zero; cn-279 sub_820120 installs the server's resolved positive kind.
      item_mode_resolve_invalid_random_pickups: true
- set:
    id: shop
    config:
      # cn-279 sub_662910 shows the -1 day duration as unlimited; its workbook marks those offers
      # with stock type 1. Its renewal predicates also predate the function-10001 ownership gate.
      permanent_day_stock_types: [9, 1]
      reject_repeat_function_10001: false
      max_purchase_attempts: ~
- set:
    id: inventoryview
    config:
      # cn-279 ShopItem.mainCategory uses localized values instead of English tokens.
      clothing_category: "\uC758 \uC0C1"
      accessory_category: "\uC7A5 \uC2DD"

# Life-counted items: this build's executable has no "endurance" ShopItem duration type (no item kind 3) and no Life
# notice text, so the daily life rule and life stock are off (packets/builds.yaml life_items: false).
- set:
    id: lobby
    config:
      life_items: false
- set:
    id: shop
    config:
      life_items: false
# CN2011 reports relay success on the game connection straight after relay 1, without a validation report
# (cn-279 sub_701270), and has no seed tables (packets/builds.yaml native_scene_seed_tables: false; its critical
# hit is a local roll, cn-279 sub_7EC4D0).
- set:
    id: match-connection
    config:
      require_capability_scene_report: false
- remove: dialect.scene-seeds
- set:
    id: dialect.rooms
    config:
      plaza_recruitment: true
- set:
    id: ingame
    config:
      plaza_recruitment: true

- insert:
    - id: tutorial-practice
      plugin: tutorial.practice
      parent_id: ingame
      disabled: true
      config:
        protocol: cn-279/game
        client_profile: cn-279
        map_key: rel_Tutorial_01
- set:
    id: shop
    config:
      # The gift box is off on dialect.messages (see above).
      present_box: false
