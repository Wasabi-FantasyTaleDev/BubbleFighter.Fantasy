      # Cooperative zombie boss rooms (16) have no start button in clients before kr-812, as in cn-324; the
      # server starts them full. Pirate rooms keep their start button here (only the Indonesian builds lack it).
      auto_start_mode_ids: [16]
      # ItemSpec4.xml / ItemSpecZombiePve enables these kinds in this build; the three slots
      # are a configured selection (shieldMedipack, bazookaPVE, airBomb), not the entire native item pool.
      counted_item_mode_id: 16
      counted_item_kinds: [229, 146, 136]
      counted_item_slot_count: 3
      counted_immediate_item_kinds: [101, 17]
      zombie_conversion_mode_id: 16
      # The zombie king's ultra policy is outside this cooperative-mode audit.
      zombie_king_ultra_item_kind: 0
      # Own AiFighterConfig maps ZombiePve score units to 0..15; awards use the shared server policy.
      pve_point_mode_id: 16
      # MissionInfo_Clt.xml and each map's CHR_MS_RAND_SPAWNER_G_* establish the paired citizens/counts.
      # The schedule is configurable reconstruction; the native boss begins at 185000 ms.
      rescue_mode_id: 16
      rescue_start_times_ms: [20000, 47500, 75000, 102500, 130000, 157500]
      rescue_duration_ms: 20000
      rescue_cooldown_ms: 7500
      rescue_stop_time_ms: 185000
      rescue_mission_ids: [1, 4, 7, 10, 13, 16, 19, 22]
      rescue_citizen_names: [ms_citizen, ms_citizen1, ms_citizen2, ms_citizen3, ms_citizen6, ms_citizen5, ms_citizen7, ms_citizen4]
      rescue_map_enemy_counts:
        - map_key: rel_zombie_01
          enemy_counts: [2, 3, 3, 3, 4, 4]
        - map_key: rel_zombie02_Twobridge
          enemy_counts: [2, 3, 3, 3, 4, 4]
        - map_key: rel_zombie03_Circle
          enemy_counts: [2, 3, 3, 4, 4, 4]
        - map_key: rel_zombie04_1_Oneway
          enemy_counts: []
        - map_key: rel_zombie04_Oneway
          enemy_counts: [2, 2, 3, 3, 4, 4]
        - map_key: rel_zombie05_Tear
          enemy_counts: [2, 2, 3, 3, 4, 4]
        - map_key: rel_zombie06_Frontal
          enemy_counts: [2, 2, 3, 3, 4, 4]
      immediate_supply_item_kinds: []
      random_supply_item_kinds: [101, 102, 108, 109, 115, 120, 123, 127, 128, 130, 136, 137, 138, 139, 141, 229, 146]
      # ItemSpec4.xml / ItemSpecItem enables the shared ordinary pool; mode 16 keeps counted slots.
# The shop opens with id-400's request (cn-706 sub_656D60 sends only the cache token) and reads id-1809's
# catalog: reader cn-706 sub_7A17F0, card sub_481A40, stock sub_481810, categories sub_79DEE0 / sub_64C780 /
# sub_79FCF0 and tab filter sub_8FA020 match id-1809 sub_7BEFF0, sub_497860, sub_497630, sub_7BBC60 /
# sub_66BF90 / sub_66BE50 and sub_90DD50.
- set:
    id: shop
    config:
      max_purchase_attempts: ~

# Life-counted items: this build's executable has no "endurance" ShopItem duration type (no item kind 3) and no Life
# notice text, so the daily life rule and life stock are off (packets/builds.yaml life_items: false).
- set:
    id: lobby
    config:
      life_items: false
- set:
    id: shop
    config:
      life_items: false
# Native relay admission is audited (cn-706 sub_79C8B0, cn-706 sub_7AE3F0), but remains opt-in.
# Keep the native transport and defence authority dormant until an optional patch enables them.
- replace:
    id: relay-listener
    disabled: true
- replace:
    id: dialect.match
    disabled: true
- replace:
    id: dialect.match-offers
    disabled: true
- replace:
