# Included by the build profile: the audited survival round exchanges (modes 23, 25, 30 and 45). Native-client acceptance remains required.
# Import the matching client resources; optional starting packs and AutoItem terrain maps are rejected before countdown.
- set:
    id: dialect.rooms
    config:
      final_zone: true
      result_scoreboard_modes: [1, 5, 6, 8, 19, 20, 23, 24, 25, 28, 30, 32, 45]
# Manual rooms keep solo entrants apart and current two-person parties together; team clicks may form another pair.
- set:
    id: ingame
    config:
      survival_team_assignments: true
      survival_maximum_groups: 12
      survival_pair_parties: true
