# Listed after every mode patch of this build: each mode patch restates the result scoreboard list, so the union of
# their modes is stated once here.
- set:
    id: dialect.rooms
    config:
      control_point: true
      zombie_origin: true
      zombie_pve_stage_results: true
      result_scoreboard_modes: [1, 5, 6, 8, 11, 16, 19, 20, 23, 24, 25, 26, 27, 28, 29, 30, 32, 37, 38, 39, 41, 43, 45, 101, 106]
- set:
    id: ingame
    config:
      # Emulator policy: the fighter is chosen from the playing roster before any prototype request arrives.
      zombie_origin_prototype_count: 1
