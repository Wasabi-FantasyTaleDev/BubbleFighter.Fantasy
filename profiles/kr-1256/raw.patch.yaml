# Opt-out: the older kr-1256 room and round path, kept until the typed path (the default) is confirmed in real
# rounds. Apply it with `--patch profiles/kr-1256/raw.patch.yaml`; it is removed together with the raw path.
- set:
    id: dialect.modern.messages
    config:
      room_binding: raw
      typed_rounds: null
      round_loading_flags: null
- set:
    id: ingame
    config:
      typed_only: null
      native_match_relay: null
      match_transport_fallback: null
      server_map_draw: null
      assign_spawn_teams_on_start: null
      native_life_mode_ids: null
      plaza_enter_requires_finished_login: null
      plaza_replay_positions_on_enter: null
      plaza_echo_positions: null
      plaza_vacate_peers_on_menu_return: null
      reinstall_room_on_first_probe: null
- set:
    id: match-connection
    config:
      capability_authentication: null
      require_capability_scene_report: null
- replace:
    id: match-relay
    disabled: false
