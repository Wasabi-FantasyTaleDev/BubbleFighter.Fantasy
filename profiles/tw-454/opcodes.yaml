profile: tw-454
# Opcode assignments for the Taiwanese 454 client. C2S and S2C are separate numeric spaces.
# The build has no packet class names; its S2C dispatcher sub_AACF80 stores each case's
# packet name through an address into the image (dispatcher sub_AACF80
# --exe). See profiles/opcode-policy.md.
opcodes:
  - value: 117
    direction: c2s
    connection: game
    name: gcpReqFighterInfo
    name_source: label@kr-1256
    evidence: verified
    source: "tw-454 sub_8D91C0 stamps 117 and writes the target account and session word; menu callers tw-454 sub_5F4920 and tw-454 sub_7D37C0 pass the clicked player's account. Matches kr-1256 sub_9319E0."
  - value: 510
    direction: c2s
    connection: game
    name: gcpReqKickFromSession
    name_source: label@kr-812
    evidence: verified
    source: "tw-454 sub_7D37C0 confirms a room-player removal, stamps 510 and writes one counted UTF-16 target nickname; matched to kr-812 Packet_gcpReqKickFromSession builder kr-812 sub_5C8730 and reader kr-812 sub_5C8FD0"
  - value: 513
    direction: s2c
    connection: game
    name: gspRepKickFromSession
    name_source: label@kr-812
    evidence: verified
    source: "tw-454 sub_A578B0 case 0x201 dispatches to tw-454 sub_A5F3C0; tw-454 sub_A5F3C0 reads two counted UTF-16 nicknames and a u32 result, matched to kr-812 Packet_gspRepKickFromSession handler kr-812 sub_8014B0 and reader kr-812 sub_80AE00"
    notes: "Requester nickname, removed nickname, result; zero announces removal in RoomStage8vs8, while nonzero results display a failure to the requester."
