profile: tw-454
# Opcode assignments for the Taiwanese 454 client. C2S and S2C are separate numeric spaces.
# The build has no packet class names; its S2C dispatcher sub_AACF80 stores each case's
# packet name through an address into the image (dispatcher sub_AACF80
# --exe). See profiles/opcode-policy.md.
opcodes:
  - value: 510
    direction: s2c
    connection: game
    name: gspRoomEnterGame
    name_source: label@kr-812
    evidence: verified
    source: "tw-454 sub_A578B0 case 0x1FE -> tw-454 sub_A5D750 -> tw-454 sub_EBE3C0 reads three strings, state and the native stage lists; matched to kr-812 gspRoomEnterGame"
  - value: 502
    direction: c2s
    connection: game
    name: gcpRoomSendChatModuleMsg
    name_source: label@kr-812
