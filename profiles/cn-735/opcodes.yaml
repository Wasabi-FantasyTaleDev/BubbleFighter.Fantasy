    name_source: label@cn-735
    evidence: verified
    source: "packet factory sub_A5B160 registers opcode 110 with UTF-16 gspGotoMenu (off_1193A08, length 0xB); handler sub_A23050 reads bool32 notice then SetStage(2) when the post-login flag is set"
    notes: "sent after gspGotoRoom so MainMenuStage opens; body false = 4 zero bytes"
