profile: cn-735
# Opcode assignments for the Chinese 735 client (CN2016 0.2.70.4). C2S and S2C are
# separate numeric spaces. Login plus main-menu GotoRoom/GotoMenu are wired; shop,
# tutorial, and plaza are not claimed here. See profiles/opcode-policy.md.
opcodes:
  - value: 1
    direction: c2s
    name: gcpFirstConnect
    name_source: label@cn-735
    evidence: verified
    source: "UTF-16 name in BubbleFighterU.exe; ClientVersion_Major 735 from CrashReporter init sub_CE6140(735, 0, 0, ...)"
    notes: "u32 ClientVersion_Major 735 first; remaining handshake fields shared with the legacy family"
  - value: 19
    direction: c2s
    name: gcpReportLastCrash
    name_source: label@cn-735
    evidence: verified
    source: "packet factory sub_A5D790 registers UTF-16 name length 0x12 through sub_419A20(..., 19)"
    notes: "sent ahead of gcpFirstConnect after a crashed session; logged, not answered"
  - value: 3
    direction: c2s
    name: gcpReqLogin
    name_source: label@cn-735
    evidence: verified
    source: "serializer sub_835270: three wstr, adapter vector, u32 unknown3, u32 unknown4; UTF-16 gcpReqLogin"
  - value: 2
    direction: s2c
    name: gspRepGamePatch
    name_source: label@cn-735
    evidence: verified
    source: "packet factory sub_A5D3B0 registers UTF-16 name length 0xF through sub_419A20(..., 2)"
  - value: 3
    direction: s2c
    name: gspRepLogin
    name_source: label@cn-735
    evidence: verified
    source: "packet factory sub_A5C630 registers opcode 3; LoginResponse deserialize sub_A5C370, LoginNational sub_A5C570"
    notes: "LoginResponse + LoginNational; success body ends with national flag 1 (no national wstr)"
  - value: 18
    direction: s2c
    connection: game
    name: gspCenterList
    name_source: label@cn-735
    evidence: verified
    source: "cn-735 sub_A44A20 dispatches game18 to cn-735 sub_A18570; cn-735 sub_A5D230 reads the vector through cn-735 sub_A5D070. The packet factory registration17 does not match the consuming dispatcher."

  - value: 110
