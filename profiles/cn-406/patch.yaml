      # Cooperative zombie boss rooms (16) have no start button in clients before kr-812, as in cn-324; the
      # server starts them full. Pirate rooms keep their start button here (only the Indonesian builds lack it).
      auto_start_mode_ids: [16]
      # Cooperative zombie (mode 16): cn-406 sub_523370/sub_523650 drive three counted
      # slots; its ItemSpecZombiePve enables 229 shieldMedipack, 146 bazookaPVE and 136 airBomb.
      # cn-406 sub_433C30 counts grants by kind; booster 101 and grenade supply 17 apply on pickup.
      counted_item_mode_id: 16
      counted_item_kinds: [229, 146, 136]
      counted_item_slot_count: 3
      counted_immediate_item_kinds: [101, 17]
      # Death with no lives left sends the empty C2S 515 (cn-406 sub_699330); the server answers
      # S2C 504 with team 15 and cn-406 sub_69A9D0 performs the conversion.
      zombie_conversion_mode_id: 16
      zombie_round_time_limit_ms: 600000
      # cn-406 sub_519F70 loads serverPangScoreUnitnum into NPC+47140; cn-406 sub_518670 reports it.
      # Own AiFighterConfig maps ZombiePve units to 0..15; awards use the shared server policy.
      pve_point_mode_id: 16
      # Rescue scheduling: mission ids pair MissionInfo_Clt.xml grade-1 rows with the map INIs' citizen
      # names; the first start follows the client's own 20000 ms balloon cadence and six 27500 ms cycles
      # fit before the boss at 185000 (rescue_stop_time_ms). Duration and cooldown are reconstruction.
      rescue_mode_id: 16
      rescue_start_times_ms: [20000, 47500, 75000, 102500, 130000, 157500]
      rescue_duration_ms: 20000
      rescue_cooldown_ms: 7500
      rescue_stop_time_ms: 185000
      rescue_mission_ids: [1, 4, 7, 10, 13, 16, 19, 22]
      # 13 is Mos (ms_citizen5), 16 Ethi (ms_citizen6), 19 Marid (ms_citizen7) and 22 Uni (ms_citizen4)
      # per the map INI's CHR_PROPERTY comments.
      rescue_citizen_names: [ms_citizen, ms_citizen1, ms_citizen2, ms_citizen3, ms_citizen5, ms_citizen6, ms_citizen7, ms_citizen4]
      # Native mission-zombie group sizes per map (CHR_MS_RAND_SPAWNER_G_0..5); rel_zombie04_1_Oneway
      # declares MAXINGAMEMISSIONCNT=0.
      rescue_map_enemy_counts:
        - map_key: rel_zombie_01
          enemy_counts: [2, 3, 3, 3, 4, 4]
        - map_key: rel_zombie02_Twobridge
          enemy_counts: [2, 3, 3, 3, 4, 4]
        - map_key: rel_zombie03_Circle
          enemy_counts: [2, 3, 3, 4, 4, 4]
        - map_key: rel_zombie04_1_Oneway
          enemy_counts: []
        - map_key: rel_zombie04_Oneway
          enemy_counts: [2, 2, 3, 3, 4, 4]
        - map_key: rel_zombie05_Tear
          enemy_counts: [2, 2, 3, 3, 4, 4]
        - map_key: rel_zombie06_Frontal
          enemy_counts: [2, 2, 3, 3, 4, 4]
      # The tutorial first-clear gift: cn-406's MapMeta carries IsItemAward on all 24 numbered
      # sin_mission_* stages (prologue's StockSet 2110130 sits at stageNum 0 and never reaches this
      # flow), and every gift id resolves in this build's own ShopItem2 workbook with valid terms.
      tutorial_gifts: true

# The full item shop. The catalog reply (S2C 800) is written from this build's inherited shop.catalog
# values (packets/builds.yaml, id-400's token / u16 stocks / landing_defaults / main / none variant);
# purchases charge the stored wallet and grant the bag through the legacy bundle's grant_purchased_items;
# the empty C2S 825 cash check (builds.yaml cash_check_request) answers with the S2C 105 stat the waiting
# dialog resumes on. The gift box runs on the audited present rows: all sixteen are verified and the
# four one-pair readings (no badge words) are stated in packets/present.yaml's except lists.
- set:
    id: shop
    config:
      present_box: true

# Life-counted items: this build's executable has no "endurance" ShopItem duration type (no item kind 3) and no Life
# notice text, so the daily life rule and life stock are off (packets/builds.yaml life_items: false).
- set:
    id: lobby
    config:
      life_items: false
- set:
    id: shop
    config:
      life_items: false
- set:
    id: dialect.rooms
    config:
      plaza_recruitment: true
- set:
    id: ingame
    config:
      plaza_recruitment: true
