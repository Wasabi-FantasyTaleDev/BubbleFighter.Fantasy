- set:
    id: dialect.scene-seeds
    config:
      # cn-406 sub_473880 consumes seed decisions without adding the equipped weapon's chance.
      weapon_critical_bonuses: true
      weapon_workbook_max_bytes: 33554432
- set:
    id: protocol
    config:
      # Gameplay assignments are audited in opcodes.yaml; catalog guesses remain diagnostic only.
      use_catalog_candidates: false
      # cn-406 sub_717FF0 sends the empty gcpStartGPK marker before a retained move on an auxiliary connection.
      auxiliary_prefix: [gcpStartGPK]
- set:
    id: diagnostics.packet-log
    config:
      packets_enabled: ${BFF_PACKET_LOG:-false}
      capture_enabled: ${BFF_PACKET_CAPTURE:-false}
      file: logs/{date}/packets-cn-406_{timestamp}.log
- set:
    id: dialect.messages
    config:
      # This build's customized-key builder and login consumer are not audited; only kr-812's are.
      customized_keys: false
- set:
    id: dialect.rooms
    config:
      menu_only: false
      browser_only: false
      supply_items: true
      horde_lottery: true
      # The mode-16 surfaces are wired by rows 921/923/924-930 (audited from this build's own client: dispatcher
      # cn-406 sub_700EE0 cases 924-929); the cooperative mode itself stays off through the per-build values below.
      counted_pve_items: true
      # The zombie battle's team change (S2C 504) reaches cn-406 sub_682280, the counterpart of kr-812
      # sub_776870; the death path sends the empty C2S 515 from cn-406 sub_699330.
      zombie_conversion: true
      pve_points: true
      rescue_missions: true
      # Quick matching: the selectors are audited (ordinary cn-406 sub_56EEC0; dedicated 101/16/13
      # cn-406 sub_582D10 / cn-406 sub_582F10 / cn-406 sub_583250; requeue cn-406 sub_581EA0) has no cancel
      # packet - the server expires its queues and tolerates re-requests.
      quick_matching: true
      # The audited revival pair (C2S 714 consumable, C2S 925 empty) mounts the shared binding.
      instant_revival: true
      # cn-406 sub_57AF10 gates the first-login pirate request (sub_719C10, choice 10) on move readiness.
      tutorial_move_in: true
- set:
