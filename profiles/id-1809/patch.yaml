# Profile patch for id-1809: applied after the bundle rows (see profiles/kr-1256/patch.yaml
# for the supported operations). The admin API moves off 8080 so this profile can run
# beside the other builds on one machine.
- replace:
    id: admin.http
    config:
      listen: "${ID_1809_ADMIN_HOST:-127.0.0.1}:${ID_1809_ADMIN_PORT:-8091}"
- replace:
    id: diagnostics.packet-log
    config:
      file: logs/{date}/packets-id-1809_{timestamp}.log
      preview_bytes: 96
# The shop opens with id-400's request (id-1809 sub_676990 sends only the cache token) and reads id-400's
# catalog plus one trailing counted vector (reader id-1809 sub_7BEFF0); its tab filter id-1809 sub_90DD50
# matches id-400 sub_8E4C00.
- set:
    id: shop
    config:
      max_purchase_attempts: ~

