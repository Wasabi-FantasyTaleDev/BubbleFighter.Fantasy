# Profile patch for tw-410: applied after the bundle rows. It starts as cn-324's, whose numbering and tables this
# build shares; the cn-324 addresses below are cn-324's evidence and still need their tw-410 counterparts.
# Weapon-aware critical seeds stay off until tw-410's seed consumer is audited (builds.yaml weapon_critical_seed_builds).
- replace:
    id: diagnostics.packet-log
    config:
      packets_enabled: ${BFF_PACKET_LOG:-false}
      capture_enabled: ${BFF_PACKET_CAPTURE:-false}
      file: logs/{date}/packets-tw-410_{timestamp}.log
      preview_bytes: 96
      console_packets: false
      preview_handled_opcodes: [502, 503, 517, 702, 704, 705, 707, 713, 728, 803, 804, 805, 901, 903, 904, 908, 923, 924, 32862, 32892, 32920]
- set:
    id: ingame
    config:
      # CN324 needs the end gate first; its first scoreboard follows immediately.
      # Only builds whose time-over end carries the scoreboard use this delay; kr-812 sends team totals.
      result_scoreboard_delay_ms: 0
      # Boss rooms have no start button: once every seat is taken or closed, cn-324 sub_5AD610 runs the native
      # final five seconds for mode 16 (room+48) and the master's client enters with its map. A CN2012/CN2011
      # difference: kr-812's countdown readers sub_5C6850 / sub_5C67E0 test room-type flags, not a mode.
      auto_start_mode_ids: [16]
      # cn-324 sub_63B230 -> sub_455ED0 compares team totals for horde mode 101.
      cooperative_score_outcome_modes: []
      zombie_conversion_mode_id: 16
      zombie_round_time_limit_ms: 600000
      # Rescue timings are configurable reconstruction values; native spawner counts are map resource data.
      rescue_mode_id: 16
      rescue_start_times_ms: [20000, 45000, 70000, 95000, 120000, 145000]
      rescue_duration_ms: 25000
      rescue_cooldown_ms: 25000
      # Native ZombiePve map CHR_SPAWNER: NameID 31 starts at clock 185000, including countdown.
      rescue_stop_time_ms: 185000
      # MissionInfo_Clt.xml rows paired with CHR_PROPERTY names in the map ZombiePve resources.
      rescue_mission_ids: [1, 4, 7, 10, 13, 16, 19, 22]
      rescue_citizen_names: [ms_citizen, ms_citizen1, ms_citizen2, ms_citizen3, ms_citizen4, ms_citizen5, ms_citizen6, ms_citizen7]
      rescue_map_enemy_counts:
        - map_key: rel_zombie02_Twobridge
          enemy_counts: [2, 3, 3, 3, 4, 4]
        - map_key: rel_zombie03_Circle
          enemy_counts: [2, 3, 3, 4, 4, 4]
        - map_key: rel_zombie04_1_Oneway
          # This advanced map declares MAXINGAMEMISSIONCNT=0; its leftover groups are inactive.
          enemy_counts: []
        - map_key: rel_zombie04_Oneway
          enemy_counts: [2, 2, 3, 3, 4, 4]
        - map_key: rel_zombie05_Tear
          enemy_counts: [2, 2, 3, 3, 4, 4]
        - map_key: rel_zombie06_Frontal
          enemy_counts: [2, 2, 3, 3, 4, 4]
        - map_key: rel_zombie_01
          enemy_counts: [2, 3, 3, 3, 4, 4]
      counted_item_mode_id: 16
      # CN324 ItemSpecZombiePve: medipack, shield, booster, bazookaPVE, airBomb.
      counted_item_kinds: [120, 102, 101, 146, 136]
      counted_item_slot_count: 5
      counted_immediate_item_kinds: []
      native_item_slot_count: 2
      # cn-324's lottery rewards name cn-324 StockSet rows; this build's reward table is not mapped yet.
      lottery_modes: []
      # ItemSpec4.xml: ammunition and grenade replenishment run through the direct-use effect.
      immediate_supply_item_kinds: [10, 11, 15, 16]
      # C925 does not establish consumable use; preserve C713 respawn timing in pirate rounds.
      pve_revival_modes: []
      # Client-defined item kinds from CN324 Config/ItemSpec4.xml; random boxes choose the kind on collision.
      random_supply_item_kinds: [101, 102, 104, 108, 109, 112, 115, 120, 121, 122, 123, 124, 125, 126, 127, 128, 129, 130, 131, 132, 134, 135, 136, 137, 138, 139, 141, 142, 143, 144, 145, 146, 147, 201, 203, 204, 207, 208, 209, 210, 211, 212, 213, 214, 215, 217, 218, 219, 220, 221, 222, 223, 224, 225, 226, 227, 228]
# No gcpStartGPK marker: this build ships HackShield instead of GPK and has no Packet_gcpStartGPK class.
- set:
    id: lobby
    config:
      rename_item_id: 100104
      rename_success_notice: "更名成功，新的角色名：{nickname}。"
      auto_create_players: false
      money_source: mysql
      starting_cash: 10000000
      starting_lucci: 10000000
- set:
    id: dialect.messages
    config:
      inventory_item_use: true
      # This build's customized-key builder and login consumer are not audited; only kr-812's are.
      customized_keys: false
- replace:
    id: dialect.rooms
    parent_id: clientdata
- set:
    id: dialect.rooms
    config:
      room_inventory_selection: true
      tutorial_move_in: true
      # The automatic tutorial offer plays the old TutorialStage map here. KR2015 ships the same map, but its
      # tutorial senders (kr-812 sub_6B37E0 / sub_6B5810 -> sub_814A70) only request the prologue.
      tutorial_use_old_map: true
      supply_items: true
      quick_matching: true
      # The lottery reward list is not mapped for this build (see ingame above).
      horde_lottery: false
      zombie_conversion: true
      counted_pve_items: true
      pve_points: true
      rescue_missions: true
      echo_direct_item_effects: true
- set:
    id: shop
    config:
      # The cn-324 renewal predicates predate the function-10001 ownership gate.
      reject_repeat_function_10001: false
      max_purchase_attempts: ~
      max_enter_shop_cards: 0

# Life-counted items: this build's executable has no "endurance" ShopItem duration type (no item kind 3) and no Life
# notice text, so the daily life rule and life stock are off (packets/builds.yaml life_items: false).
- set:
    id: lobby
    config:
      life_items: false
- set:
    id: shop
    config:
      life_items: false
- set:
    id: dialect.rooms
    config:
      plaza_recruitment: true
- set:
    id: ingame
    config:
      plaza_recruitment: true
