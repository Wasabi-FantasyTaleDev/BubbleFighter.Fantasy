id: all
description: Every brought-up client build in one process, each on its own listener port.
bundles:
  - core
  # One clan-server port for every build that has a clan connection.
  - clan-gateway
# always: every build starts with the server. on_demand: a build's listeners are bound, and its rows load when the
# first client connects to it and unload after core.activation-groups' idle_minutes without a connection.
build_activation: ${BFF_BUILD_ACTIVATION:-always}
# Builds of the list below that this deployment leaves out entirely (no listeners, no rows), comma-separated,
# for example BFF_EXCLUDE_BUILDS=kr-186. Every name must be in the list.
exclude_builds: ${BFF_EXCLUDE_BUILDS:-}
# Builds of the list below that most deployments do not have: unreleased clients whose data is not public. An
# optional build starts only when BFF_INCLUDE_BUILDS names it (comma-separated), so a server without its client data
# starts without it. The WebUI does not list these builds either (setup_visible: false in their profiles).
optional_builds:
  - kr-186
include_builds: ${BFF_INCLUDE_BUILDS:-}
builds:
  - kr-1256
  - kr-812
  - id-400
  - id-1809
  - cn-324
  - tw-410
  - cn-717
  - cn-774
  - tw-454
  - cn-279
  - kr-186
  - cn-406
  - cn-706
  - cn-404
  - cn-408
patches:
  - patch.yaml
  # Optional developer override; git-ignored and skipped when absent.
  - local.patch.yaml
