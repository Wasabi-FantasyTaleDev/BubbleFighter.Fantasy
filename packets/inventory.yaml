version: 1
structs:
  # S2C gspInventoryUpdateAllInventorySlot (801) and gspInventoryUpdateInventorySlots (802): the whole bag
  # or the changed slots, as one counted list. Readers: kr-812 sub_843420, cn-717 sub_8CD130,
  # id-400 sub_7993D0, cn-324 sub_6FE0C0, cn-279 sub_450230.
  # The builds whose bag record is the modern one read the same counted list. kr-1256 sub_9AE4A0
  # unwraps the compressed envelope (kr-1256 sub_FA5520) and reads this counted list through
  # kr-1256 sub_10D7C50 -> kr-1256 sub_10D8550; cn-774 sub_BAD820 -> cn-774 sub_1063790 reads the count straight
  # off the stream, as does tw-454 sub_A8AEE0 before tw-454 sub_C02AF0 installs the ordinary list.
  InventoryUpdate:
    - slots: "list<InventorySlot>"

  # One modern bag slot, read by kr-1256 sub_10D8550: item id, count, eight bytes stored at record
  # +8, the text emptied at +36, an empty attribute vector at +24, and the packed flag byte whose bits
  # fill +16..+23 (worn is bit 0). cn-774 sub_496960 and tw-454 sub_4A00D0 read the same wire record.
  InventorySlot@kr-1256:
    - item_id: u32
      offset: 0
    - quantity: u32
      offset: 4
    - unknown_8: u64 # Day-double bits: kr-1256 sub_804160, cn-774 sub_9A44B0 and tw-454 sub_C09140 subtract elapsed inventory time.
      offset: 8
    - unknown_36: wstr
      offset: 36
    - attributes: "list<ItemAttr>" # kr-1256 sub_10D8550 reads the vector; kr-1256 sub_A0DED0 consumes all four value positions.
      offset: 24
    - flags: u8 # worn is bit 0; the client expands the byte into the record's +16..+23 booleans
      offset: 16

  # One bag slot as kr-812 sub_843510 reads it; cn-717 sub_8CD8C0 and id-400 sub_795860 read the same.
  # kr-812 sub_977AA0 keys the bag by item id; kr-812 sub_977E70 and sub_977F60 test the equipped flag.
  InventorySlot:
    - item_id: u32
      offset: 4
    - unknown_8: u32
      offset: 8
    - remaining_days: f64 # days left, counted from the connection's inventory time origin (kr-812 sub_978920)
      offset: 16
    - equipped: bool # four bytes on the wire, one in the object (kr-812 sub_A56BD0)
      offset: 24
    - unknown_25: bool
      offset: 25
    - unknown_26: bool
      offset: 26
    - unknown_27: bool
      offset: 27
    - unknown_28: bool
      offset: 28
    - unknown_48: wstr
      offset: 48
      except: [cn-324] # cn-324 sub_6FA8E0 and cn-279 sub_44CD50 stop after +28
    - unknown_32: "list<ItemAttr>" # kr-812 sub_532610 / kr-812 sub_5325A0; cn-717 sub_A480E0 consumes all four value positions.
      offset: 32
      except: [cn-324]

  # kr-812 C2S gcpReqInventoryDeleteItem (806) and gcpReqInventoryThrowItem (807)
  # each carry the selected item identity as one u32. Writers: kr-812 sub_9BCB10
  # and kr-812 sub_9857B0; the throw UI selects that identity in kr-812 sub_984930.
  # kr-812 sub_9BCB10 stamps 806 through kr-812 sub_B25E90 and kr-812 sub_9857B0
  # stamps 807. Both request classes read the word at +4 through kr-812 sub_80A910,
  # so the delete and throw requests share this structure.
  # The expired-item confirmation sends the same word on C2S 808 in
  # kr-1256 sub_8136F0, cn-774 sub_9B4BC0 and tw-454 sub_C12C40.
  # The inspected kr-1256 removal UI uses throw request C2S 808: kr-1256 sub_8136F0
  # writes the word after the identity check. C2S 806 belongs to the use-item builder
  # kr-1256 sub_80DA80; these paths do not establish whether another delete sender exists.
  # Legacy throw writers: cn-279 sub_404F00, cn-324 sub_45D490,
  # id-400 sub_8F2850 and id-1809 sub_4D7E40 each write one four-byte value.
  # Stamping helpers: cn-279 sub_487630, cn-324 sub_804440,
  # id-400 sub_8F8790 and id-1809 sub_921060 explicitly select C2S 807.
  # Further named requests use the same word: cn-717 sub_88E6C0, cn-406 sub_420D90,
  # cn-404 sub_929C90, cn-408 sub_9932E0 and cn-706 sub_4BBD50. Their send helpers
  # cn-717 sub_A30890, cn-406 sub_86BFB0, cn-404 sub_92FBC0, cn-408 sub_935A90
  # and cn-706 sub_90D350 all explicitly stamp 807.
  InventoryActionRequest:
    - item_id: u32
      offset: 4
      only: [kr-812]

  # kr-812 S2C gspRepInventoryDeleteItem (811), vtable kr-812 0xD6F51C, reader
  # kr-812 sub_6DB1B0: item identity at +4 then result at +8, one u32 each
  # (kr-812 sub_A56C10 reads one word at each offset). Consumer kr-812 sub_826F70:
  # result zero removes the identity through kr-812 sub_97BFD0 and refreshes the
  # dialog at +736/+740 through kr-812 sub_953050 and kr-812 sub_94FD20; result 1
  # and result 2 show fixed failure texts and any other nonzero shows an unknown
  # failure text.
  # The kr-1256 client reads S2C 814 inline in dispatcher kr-1256 sub_9D2FF0 at
  # kr-1256 0x9D4AC2: one u32 identity then one u32 result; result zero removes
  # that identity through kr-1256 sub_933190, and any nonzero shows an
  # unknown-failure text. This reply reader does not establish a corresponding request sender.
  InventoryDeleteReply:
    - item_id: u32
      offset: 4
      only: [kr-812]
    - result: u32
      offset: 8
      only: [kr-812]

  # kr-812 S2C gspRepInventoryThrowItem (812), vtable kr-812 0xD6F528, reader
  # kr-812 sub_6DB1B0. kr-812 sub_827180 consumes the same identity/result
  # pair and calls kr-812 sub_97BFD0 for result zero before refreshing the UI.
  # Modern S2C 815 readers kr-1256 sub_9B6250, cn-774 sub_BB4930 and
  # tw-454 sub_A92020 also read identity:u32 then result:u32; zero removes
  # that identity via kr-1256 sub_933190, cn-774 sub_B29100 or tw-454 sub_8DAC80.
  # The kr-1256 handler reads four bytes for the identity and four for the
  # result; result zero also shows a fixed text, result 1 shows a fixed failure
  # text, and any other nonzero includes the result word in the failure text.
  # S2C 812 readers cn-279 sub_47E650, cn-324 sub_408DF0, id-400 sub_782DD0
  # and id-1809 sub_4D7F70 also read two u32 values. Their zero-result consumers
  # erase the first value through cn-279 sub_6642B0 (call site 006FEA38),
  # cn-324 sub_7FDEF0 (call site 0070C497), id-400 sub_8EF1E0 and id-1809 sub_917760.
  # Two-word readers also confirmed in cn-717 sub_538B70, cn-406 sub_420FC0,
  # cn-404 sub_4AF1B0, cn-408 sub_4AF4C0 and cn-706 sub_733050. Their S2C 812
  # success consumers remove the first word through cn-717 sub_A21A30,
  # cn-406 sub_862D60, cn-404 sub_926470, cn-408 sub_92C0A0 and cn-706 sub_903A20.
  InventoryThrowReply:
    - item_id: u32
      offset: 4
      only: [kr-812]
    - result: u32
      offset: 8
      only: [kr-812]

  # S2C gspCheckExpiredTimeResult (806 legacy, 807 modern): the ids of items whose time ran out, as one counted
  # u32 list. kr-812 sub_840820 (dispatcher kr-812 sub_837170 case 0x326 -> sub_821620) reads a count and then
  # that many u32; cn-324 sub_6EB680 -> sub_4020A0, cn-717 sub_88EDC0 and the cn-279 constructor sub_450320
  # (vector at +4) have the same shape. The modern build reads the same way: dispatcher case 807 in
  # kr-1256 sub_9D2FF0 goes through kr-1256 sub_998FB0 into kr-1256 sub_999C00, which reads a u32 count and
  # then that many 4-byte ids. The handler (kr-812 sub_6D5890) only shows notices: it looks each id up in the
  # item table (kr-812 sub_992C60), skips items tagged "Hide", and picks the "used up" or "period expired" text
  # by the item's kind (item object +248: 1 or 2). It removes nothing, so the server restates the bag itself.
  ExpiredItems:
    - item_ids: "list<u32>"
      offset: 4

  # S2C gspInventoryUpdateInventorySlots of the legacy builds: the bag again, as one counted slot
  # list (kr-812 sub_843420's family). The modern builds restate it below, because their packet
  # carries three containers.
  InventorySlots:
    - slots: "list<InventorySlot>"

  # kr-1256 sub_9AEB10 reads bag deltas, article deltas and removed ordinary item ids.
  # Article state 1 inserts or replaces; other states remove the key. cn-774 sub_BADC50
  # reads only the ordinary slot list, so that build's delta body is restated below.
  InventorySlots@kr-1256:
    - slots: "list<InventorySlot>"
    - articles: "list<ArticleSlot>" # kr-1256 sub_10D7CE0 -> kr-1256 sub_10D8370
    - removed_item_ids: "list<u32>" # kr-1256 sub_10D7E90 -> kr-1256 sub_933190

  InventorySlots@cn-774:
    - slots: "list<InventorySlot>"

  # Full article replacement: kr-1256 sub_9D2FF0 case 808 -> kr-1256 sub_804FC0 clears then installs.
  # kr-1256 sub_FA5520 and cn-774 sub_BAE150 -> cn-774 sub_F3CD00 unwrap a counted zlib body;
  # tw-454 sub_A8B870 -> tw-454 sub_EBFE20 reads the counted list directly.
  ArticleSlots:
    - articles: empty_list
      kr-1256:
        - articles: "list<ArticleSlot>"

  # kr-1256 sub_10D8370, cn-774 sub_496AD0 and tw-454 sub_4A0240 independently read this row.
  # The state word is 1 for a live article; kr-1256 sub_9AEB10 removes other states.
  # The equipped flag occupies four wire bytes despite occupying one byte in the native object.
  ArticleSlot:
    - article_key: u64
      offset: 0
      only: [kr-1256]
    - item_id: u32
      offset: 8
      only: [kr-1256]
    - state: u32
      offset: 12
      only: [kr-1256]
    - equipped: bool
      offset: 16
      only: [kr-1256]
    - attributes: "list<ItemAttr>"
      offset: 20
      only: [kr-1256]
