version: 1
structs:
  # id-400 sub_798AB0 and id-1809 sub_8C2550 write two counted UTF-16 strings.
  # id-400 sub_5E9050 and id-1809 sub_632750 continue stage setup immediately after sending.
  gcpReqIDPCRoomAuth:
    - unknown_4: wstr
      offset: 4
    - unknown_32: wstr
      offset: 32
  # cn-774 sub_609D70 stamps 827 without writing a body; cn-774 sub_641B80 rearms its timer immediately.
  # cn-774 sub_63ED80 also sends it from the cash dialog without installing a response-wait state.
  gcpReqCheckCash_: []
  # cn-324 sub_78B580 constructs Packet_gcpReqKeepAlivePing; cn-324 sub_793E20 stamps its opcode.
  # Both serializer slots at cn-324 0xB21114 point to cn-324 nullsub_3 at 0x5C7C90: no body fields.
  # This empty shape is enabled only by a build's verified named opcode; it does not establish other builds' support.
  gcpReqKeepAlivePing: []
  # kr-812 sub_845700. Empty strings give a 96-byte body, but strings need not be empty.
  gcpFirstConnect:
    - client_version: u32
      offset: 4
    - unknown_8: wstr
      offset: 8
    - unknown_36: wstr
      offset: 36
    - unknown_64: wstr
      offset: 64
    - unknown_92: wstr
      offset: 92
    - unknown_120: wstr
      offset: 120
    - unknown_148: wstr
      offset: 148
    - unknown_176: wstr
      offset: 176
    - unknown_204: u32
      offset: 204
    - unknown_208: wstr
      offset: 208
    - unknown_236: wstr
      offset: 236
    - unknown_264: wstr
      offset: 264
    - unknown_292: wstr
      offset: 292
    - unknown_320: wstr
      offset: 320
    - unknown_348: wstr
      offset: 348
    - unknown_376: wstr
