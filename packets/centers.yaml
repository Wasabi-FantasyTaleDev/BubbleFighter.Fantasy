  # kr-1256 sub_99DD00 -> sub_10C6440; cn-774 sub_105BE90; tw-454 sub_ECB490.
  # The native object has no packet vtable: two words surround seven counted UTF-16 strings,
  # followed by fifteen more strings. All-empty strings produce 96 bytes, not a fixed-size body.
  gcpFirstConnect@kr-1256:
    - client_version: u32
      offset: 0
    - unknown_4: wstr
      offset: 4
    - unknown_28: wstr
      offset: 28
    - unknown_52: wstr
      offset: 52
    - unknown_76: wstr
