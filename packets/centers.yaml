    - unknown_488: wstr
      offset: 488
    - unknown_516: wstr
      offset: 516
    - unknown_544: wstr
      offset: 544
    - unknown_572: wstr
      offset: 572
    - unknown_600: wstr
      offset: 600
  # cn-324 sub_6FC2E0 initializes single-word string handles; cn-279 sub_44E390
  # writes the same order. Object offsets differ from the kr-812 inline strings.
  gcpFirstConnect@cn-324:
