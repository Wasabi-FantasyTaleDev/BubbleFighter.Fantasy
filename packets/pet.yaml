version: 1
structs:
  # kr-812 sub_9D95D0 / kr-812 sub_832EC0 and cn-717 sub_7F4370 / cn-717 sub_8BB460:
  # outcome >0 grows, 0 regresses, negative values report failure; the consumer reads installed state.
  # Other three-word readers: cn-404 sub_7C7100, cn-408 sub_4B0680, cn-406 sub_715B70,
  # cn-706 sub_7A23F0, id-400 sub_72E4D0 and id-1809 sub_4D8130.
  # kr-1256 sub_9C3BE0 and cn-774 sub_BC1330 use a u64 target, optional word and reward item list.
  # tw-454 sub_A9E4A0 / tw-454 sub_DD0A00 keeps a fixed trailing word after its u64 target.
  # Modern inline-reader offsets are relative to the first local field, including alignment padding.
  PetEvolveResult:
    - outcome: u32
      offset: 4
      kr-1256:
        - outcome: u32
          offset: 0
    - target: u32
      offset: 8
      kr-1256:
        - target: u64
          offset: 8
    - unknown_12: u32
      offset: 12
      except: [kr-1256]
      tw-454:
        - unknown_16: u32
          offset: 16
    - unknown_16: 'optional<0x3A,PetEvolveTail>'
      offset: 16
      default: 186
      only: [kr-1256]
      except: [tw-454]
    - rewards: 'list<u32>'
      offset: 24
      only: [kr-1256]
      except: [tw-454]

  # kr-1256 sub_9C3BE0 and cn-774 sub_1068B70: tag 0x3A announces one word; 0xBA means absent.
  PetEvolveTail:
    - unknown_0: u32
      offset: 0
      only: [kr-1256]
      except: [tw-454]

  # kr-1256 sub_EDFB50, cn-774 sub_E58A60 and tw-454 sub_DCFEC0 write the selected u64 reference.
  PetLevelUpRequest:
    - target: u64
      offset: 0
      only: [kr-1256]

  # kr-1256 sub_9D2FF0 case 166, cn-774 sub_BC3820 and tw-454 sub_AA0C40:
  # the result word reaches the level-up presentation; state is installed by other packets.
  PetFollowerLevelUp:
    - target: u64
      offset: 0
      only: [kr-1256]
    - result: u32
      offset: 8
      only: [kr-1256]

  # kr-1256 sub_EC9610 / kr-1256 sub_EC83F0 and cn-774 sub_7B68F0:
  # selected article key, old and new ItemAttr selectors, then the function-38 consumable item id.
  PetAbilityChangeRequest:
    - target: u64
      offset: 0
      only: [kr-1256]
      except: [tw-454]
    - old_selector: u32
      offset: 8
      only: [kr-1256]
      except: [tw-454]
    - new_selector: u32
      offset: 12
      only: [kr-1256]
      except: [tw-454]
    - consumable_item_id: u32
      offset: 16
      only: [kr-1256]
      except: [tw-454]

  # kr-1256 sub_9D2FF0 case 167 / kr-1256 sub_EE08A0 and cn-774 sub_BC3870 / cn-774 sub_E596A0:
  # zero result displays the selector at wire offset 16. Other words are not consumed here.
  PetFollowerAbilityChange:
    - target: u64
      offset: 0
      only: [kr-1256]
      except: [tw-454]
    - result: u32
      offset: 8
      only: [kr-1256]
      except: [tw-454]
    - unknown_12: u32
      offset: 12
      only: [kr-1256]
      except: [tw-454]
    - selector: u32
      offset: 16
      only: [kr-1256]
      except: [tw-454]
    - unknown_20: u32
      offset: 20
      only: [kr-1256]
      except: [tw-454]
