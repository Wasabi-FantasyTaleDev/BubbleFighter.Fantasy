version: 1
structs:
  # Own scalar readers: kr-812 sub_80A910, cn-717 sub_8C4210, cn-324 sub_410910,
  # cn-279 sub_44C1A0, id-400 sub_93D120, id-1809 sub_4D60C0 and cn-706 sub_4BBB70.
  # cn-406 sub_700770 and cn-705 sub_4BAA30 also read one wave word; kr-1256 sub_7BAD80
  # reads four bytes before releasing the start latch, matching kr-1256 sub_7B9820's request.
  NpcWave:
    - wave: u32
      offset: 4
  # Each named build's own gppCreateMobsFromSpawnGroup class uses its scalar reader above.
  # cn-774 sub_AEE980 writes the word; cn-774 sub_AEBC40 case 32857 reads it before cn-774 sub_AEB660.
  # tw-454 sub_8FBCE0 writes the word; tw-454 sub_8F9160 case 32857 reads it before tw-454 sub_8F8B80.
  NpcSpawnGroup:
    - spawn_group: u32
      offset: 4
  # kr-1256 sub_8FCE10 writes two words, a wide string and four words;
  # kr-1256 sub_8FD0A0 consumes kr-1256 sub_8F5720's matching record.
  # cn-774 sub_AEF340 / cn-774 sub_AEF560 independently write/read the same body.
  # tw-454 sub_8FC680 / tw-454 sub_8FC8A0 independently write/read the same body.
  NpcSpawnMember:
    - unknown_0: u32
      offset: 0
      only: [kr-1256]
    - unknown_4: u32
      offset: 4
      only: [kr-1256]
    - unknown_8: wstr
      offset: 8
      only: [kr-1256]
    - unknown_32: 'u32[4]'
      offset: 32
      only: [kr-1256]
  # kr-1256 sub_9027F0 writes two words, eight bytes and five words;
  # kr-1256 sub_6EE170 reads those same 36 bytes before creating the preset actor.
  NpcSpawnActor:
    - unknown_0: 'u32[9]'
      offset: 0
      only: [kr-1256]
      # cn-774 sub_AF65B0 / cn-774 sub_8ADDC0 write/read 32 bytes, with four final words.
      # tw-454 sub_85EA70 / tw-454 sub_722270 independently confirm that inherited 32-byte body.
      cn-774:
        - unknown_0: 'u32[8]'
          offset: 0
  # kr-1256 sub_7F3ED0 writes two words, one wide string and a word;
  # kr-1256 sub_7DCF20 consumes them to apply the NPC's recorded movement.
  # cn-774 sub_97BD60 / cn-774 sub_97C110 write the same body read by cn-774 sub_97BA60.
  # tw-454 sub_CA9FE0 / tw-454 sub_CAA370 write the same body read by tw-454 sub_CA9CE0.
  NpcActorReplay:
    - unknown_0: u32
      offset: 0
      only: [kr-1256]
    - unknown_4: u32
      offset: 4
      only: [kr-1256]
    - unknown_8: wstr
      offset: 8
      only: [kr-1256]
    - unknown_32: u32
      offset: 32
      only: [kr-1256]
  # kr-1256 sub_7E06D0 writes two bytes and a word; kr-1256 sub_7ED5C0 reads that order.
  # cn-774 sub_97F770 / cn-774 sub_9591C0 independently write/read the same six bytes.
  # tw-454 sub_CADBA0 / tw-454 sub_C87B50 independently write/read the same six bytes.
  NpcWaveMobGroup:
    - unknown_0: u8
      only: [kr-1256]
    - unknown_1: u8
      only: [kr-1256]
    - unknown_2: u32
      only: [kr-1256]
