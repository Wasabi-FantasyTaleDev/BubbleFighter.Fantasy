version: 1
structs:
  # Host settings (Sponsor / UserHost prize rooms):
  # - kr-812 C2S 2026 gcpUserHostSetting: kr-812 sub_809110 stamps 2026 and calls class codec kr-812 sub_6DB1B0
  #   (+4, +8). Actions proven across kr-812 sub_5BCD60 & kr-1256 sub_974530 / kr-1256 sub_9731A0 / kr-1256 sub_968A50:
  #   0 = open prize edit dialog (0, 0), 1 = commit prize (1, prize), 2 = non-host query (2, 0),
  #   3 = host query (3, 0).
  UserHostSettingRequest:
    - action: u32
      offset: 4
    - prize: u32
      offset: 8

  # kr-812 S2C 992 gspUserHostSetting: reader kr-812 sub_80A400 reads four words at +4/+8/+12/+16.
  UserHostSettingUpdate:
    - action: u32
      offset: 4
    - prize: u32
      offset: 8
    - min_prize: u32
      offset: 12
    - max_prize: u32
      offset: 16

  # kr-812 S2C 993 gspUserHostDefaultSetting shares class codec kr-812 sub_6DB1B0 (+4, +8)
  # to deliver the server-configured minimum and maximum prize bounds.
  UserHostDefaultSetting:
    - min_prize: u32
      offset: 4
    - max_prize: u32
      offset: 8

  # S2C gspUserHostStart status reply for prize-room start validation and countdown trigger:
  # 0 = start match countdown, -1..-5 = client error alerts (-4 prompts ticket purchase).
  # Readers: kr-812 sub_80A910 (+4), cn-717 sub_8C4210 (+4), id-1809 sub_4D60C0 (+4).
  UserHostStartReply:
    - status: u32
      offset: 4

  # Modern builds read the same bodies into stack locals at wire positions:
  # - Requests: kr-1256 sub_9DFC50 (2032), cn-774 sub_8E8E60 (2030), tw-454 sub_A69500 (2029);
  #   callers kr-1256 sub_974530 pass (0, 0), kr-1256 sub_9731A0/kr-1256 sub_973220 pass (1, prize), kr-1256 sub_968A50 passes (2/3, 0).
  # - Setting update: kr-1256 sub_9CBF50 (S2C 991), cn-774 sub_BC77E0 (S2C 991), tw-454 sub_AA6440 (S2C 990).
  # - Default bounds: kr-1256 0x9D542B (S2C 992), cn-774 sub_BC7D10 (S2C 992), tw-454 sub_AA6970 (S2C 991).
  UserHostSettingRequest@kr-1256:
    - action: u32
    - prize: u32

  UserHostSettingUpdate@kr-1256:
    - action: u32
    - prize: u32
    - min_prize: u32
    - max_prize: u32

  UserHostDefaultSetting@kr-1256:
    - min_prize: u32
    - max_prize: u32

  # Modern gspUserHostStart readers: kr-1256 sub_9CB9C0 (S2C 990), cn-774 sub_BC70C0 (S2C 990),
  # tw-454 sub_AA5D20 (S2C 989).
  UserHostStartReply@kr-1256:
    - status: u32
