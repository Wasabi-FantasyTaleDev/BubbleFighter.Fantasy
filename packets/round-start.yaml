    - unknown_64: "when<seat_mask&0x4000,u8>"
      offset: 64
      only: [kr-1256]
    - unknown_68: "when<seat_mask&0x8000,u8>"
      offset: 68
      only: [kr-1256]
    - unknown_72: "when<seat_mask&0x10000,u8>"
      offset: 72
