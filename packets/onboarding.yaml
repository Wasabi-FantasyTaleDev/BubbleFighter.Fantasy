version: 1
structs:
  # Readers cn-279 sub_6F7DC0 and cn-324 sub_705B20: bool32 and two i32.
  # cn-324 sub_452520 rejects channel 0; channels 50 and 60 are accepted without a level gate.
  # kr-812 sub_81C6F0 reads the same fields; kr-812 sub_A4A440 accepts 50 and 60 through byte table
  # 0xA4A4D8 indexes 40 and 50 (value 4, unconditional success). The writer supplies the row's
  # player_channel; the default is 60 ("Free") because admission is not enough: the round start reads the
  # channel's FighterConfigChannel column (kr-812 sub_587690, sub_584320), which 50 lacks in every client
  # checked (CN2011, KR2015, kr-1256).
  TutorialMoveInto:
    - accepted: bool
      offset: 4
      default: 1
    - channel: u32
      offset: 8
      default: 60
      cn-279:
        - channel: u32
          offset: 8
          default: 0
    - unknown_12: u32
      offset: 12
