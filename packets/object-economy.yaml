  StarCreateNotice@kr-812: []
  StarCreateNotice@kr-1256:
    - pos_x: u32
    - pos_y: u32
    - pos_z: u32
    - dir_x: u32
    - dir_y: u32
    - dir_z: u32
    - kind: u32
    - unknown_28: u32
    - unknown_32: u32
  # kr-1256 642 / cn-774 and tw-454 615: the big-star eaten notice. Two u32 words; the client logs
