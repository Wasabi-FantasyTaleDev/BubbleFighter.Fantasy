version: 1
# The in-round object economy: the create/eat/pickup requests for the items the round spawns and
# the players consume. One cross-build audit of the three exports verified every sender; the C2S
# numbering 628-642 is stable across kr-1256, cn-774 and tw-454, the bodies byte-identical except
# where a row says so. cn-774 stamps the opcode at buffer+2 and tw-454 at buffer+2; kr-1256 at +4.
# The eat requests are cooldown-gated overlap handlers (item class vtable slot 34); the create
# requests come from the kill-drop and mode-script paths. The client never decrements its own bag.
structs:
  # cn-324 sub_45D090 and cn-324 sub_45D120: position, launch vector, weapon selector, two words and bool32.
  # cn-324 sub_4CB280 supplies cn-324 sub_46D0F0; cn-324 sub_8A3680 reads four bytes for the boolean.
  WeaponDropRequest@kr-812: []
  WeaponDropRequest@cn-324:
    - x: f32
      offset: 4
    - y: f32
      offset: 8
    - z: f32
      offset: 12
    - velocity_x: f32
      offset: 16
    - velocity_y: f32
      offset: 20
    - velocity_z: f32
      offset: 24
    - weapon_spec: u32
      offset: 28
    - unknown_32: u32
      offset: 32
    - unknown_36: u32
      offset: 36
    - unknown_40: bool
      offset: 40
  # C2S 628. kr-1256 sub_708C10 (wrappers sub_6E7380 life 20000, sub_6E7480 life 10000,
  # sub_4988C0 kind 14), cn-774 sub_8C8140, tw-454 sub_71AE40 and three more tw senders: the
  # position and direction triplets, the item kind, one byte, and the item lifetime
  # (20000/10000 ms per the wrappers).
  ItemCreateRequest@kr-812: []
  ItemCreateRequest@kr-1256:
    - pos_x: u32
    - pos_y: u32
    - pos_z: u32
    - dir_x: u32
    - dir_y: u32
    - dir_z: u32
    - kind: u32
    - unknown_flag: u8
    - lifetime: u32
  # C2S 629. kr-1256 sub_708D50 via sub_6E7580, cn-774 sub_8C8280, tw-454 sub_71B220: ten fields
  # and the byte at object +40 widened to u32; the drop-weapon path of the pickup flow.
  WeaponCreateRequest@kr-812: []
  WeaponCreateRequest@kr-1256:
    - unknown_4: u32
    - unknown_8: u32
    - unknown_12: u32
    - unknown_16: u32
    - unknown_20: u32
    - unknown_24: u32
    - unknown_28: u32
    - unknown_32: u32
    - unknown_36: u32
    - unknown_40: u32
    - unknown_widened: u32
  # C2S 630. kr-1256 sub_498F50, cn-774 sub_529530, tw-454 sub_78D7F0: the walked-over weapon
  # object and the player's character id, in that order in all three builds.
  WeaponPickupRequest@kr-812: []
  WeaponPickupRequest@kr-1256:
    - weapon_object: u32
      offset: 4
    - actor: u32
      offset: 8
  # C2S 631 / 633 / 635 / 641: the four overlap-eat requests, each two words (the character id and
  # the item object id) from the item class's vtable slot 34 handlers: kr-1256 sub_6DC3C0 (star),
  # sub_6DC4E0 (event box), sub_6DC600 (lucci), sub_C131F0 (heart); cn-774 sub_89DD80/sub_89DE60/
  # sub_89DF40/sub_D4C690; tw-454 sub_710B80/sub_710C90/sub_710DA0/sub_84DBF0. The heart eat is
  # dead code on cn-774 (its sender has no callers) and live on kr-1256 and tw-454.
  OverlapEatRequest@kr-812: []
  OverlapEatRequest@kr-1256:
    - actor: u32
      offset: 4
    - item_object: u32
      offset: 8
  # C2S 632 / 636 / 638 / 642(kr,tw): the kill-drop create requests, nine u32 words - the position
  # and direction triplets, the item kind (1/2 small and big lucci, star kinds), and two trailing
  # words (cn-774's lucci create carries the constant 5 in the first). kr-1256 sub_6E8580 (star),
  # sub_6E8B40 (lucci), sub_6E9100 (chocolate), sub_6E8F10 (heart); cn-774 sub_89DF40's family;
  # tw-454 sub_71BA70/sub_71BE10/sub_71C3A0/sub_71C1C0.
  KillDropCreateRequest@kr-812: []
  KillDropCreateRequest@kr-1256:
    - pos_x: u32
    - pos_y: u32
    - pos_z: u32
    - dir_x: u32
    - dir_y: u32
    - dir_z: u32
    - kind: u32
    - unknown_28: u32
    - unknown_32: u32
  # C2S 634. kr-1256 sub_6E8770 and tw-454 sub_71BA70 send it (the event-box spawn helper
  # kr-1256 sub_485BE0); cn-774's sender sub_8A88B0 is dead code - the build never emits it.
  EventBoxCreateRequest@kr-812: []
  EventBoxCreateRequest@kr-1256:
    - pos_x: u32
    - pos_y: u32
    - pos_z: u32
    - dir_x: u32
    - dir_y: u32
    - dir_z: u32
    - unknown_28: u32
    - unknown_32: u32
    - unknown_36: u32
  # C2S 640. Three builds, three field layouts over eight u32 words: kr-1256 sub_6E8960 writes the
  # spawn position, three zero words, the spawner id and the spawner state; cn-774 sub_AF65B0 writes
  # the spawner id, the character index, the position x, three zero words, the check-out word and the
  # player's slot index (and stamps relay 32892 for the same event); tw-454 sub_71BC50 writes the
  # position and direction triplets and two trailing words.
  SpawnerFireRequest@kr-812: []
  SpawnerFireRequest@kr-1256:
    - pos_x: u32
    - pos_y: u32
    - pos_z: u32
    - unknown_16: u32
    - unknown_20: u32
    - unknown_24: u32
    - spawner: u32
    - spawner_state: u32
  SpawnerFireRequest@cn-774:
    - spawner: u32
    - character_index: u32
    - pos_x: u32
    - unknown_16: u32
    - unknown_20: u32
    - unknown_24: u32
    - checkout: u32
    - slot_index: u32
  SpawnerFireRequest@tw-454:
    - pos_x: u32
    - pos_y: u32
    - pos_z: u32
    - dir_x: u32
    - dir_y: u32
    - dir_z: u32
    - unknown_28: u32
    - unknown_32: u32
  # The S2C creation and eaten notices. kr-1256 numbers the run 634/641-652/656-657 (the in-round
