    - item_object: u32
  # kr-1256 643 / cn-774 and tw-454 616: the event box create. kr-1256 sub_C117E0 constructs
  # GoEventBoxItem; cn-774 sub_D4ABB0 (type 1) and the horde-award variant (type 3).
  EventBoxCreateNotice@kr-812: []
