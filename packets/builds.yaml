    # The launcher login body ends with one more wstring (kr-1256 sub_10C6A00: prefixed session, HWID,
    # empty platform string, adapter list, two words, old-platform string). The reply is the modern table
    # form: a server session identity, the Dao character type, channel 99 (a nonzero channel arms the
    # room-list poll, kr-1256 sub_8530C0) and a zero server time. The menu is the table-driven kind-1
    # gspGotoRoom install (kr-1256 sub_10D4520, handler sub_9AC490), and the burst is the modern sequence
    # with the empty gate table and option sync.
    login:
      request_trailer: true
      request_extra_wstr: true
      reply: modern
      main_menu: table
      channel_id: 99
      # The expiry notice is the last publication: the bag above already lacks the removed rows and the
      # client shows one notice per id once the menu exists (kr-1256 sub_93C6E0).
      burst: [login_reply, user_stat, user_money_stat, user_pcroom_stat, center_list, update_party, option_sync, inventory, main_menu, equipment_view, first_move_channel, expired_items]

    base: kr-812
    # Its rooms and rounds are served by the modern family's own room binding, which reads these tables;
    # the legacy room writer does not take this build or the builds based on it.
    # The result goes ahead of the bag: kr-1256 sub_9B34D0 applies the slot itself through sub_806CE0.
    equipment:
      result_after_inventory: false
      # gspInventoryViewUpdateView is the player's profile record (kr-1256 sub_9AF2F0 -> sub_81CCE0), the same record
      # the room install carries as RoomProfileEntry.
      view: RoomProfileEntry
      # The view handler rewrites the profile record the preset packets fill (kr-1256 sub_9C3880 -> sub_81B820), so
      # the preset reply and list come first.
      local_view: [preset_reply, preset_update, view]
      # Preset records the worn-derived list writes, one per page; the shipped bar carries three, which leaves
      # pages 3-4 without records and kr-1256 sub_5FB4F0 disables them. The persisted bar the inventoryview row's
      # persist_preset_pages switch (default off) publishes is not bound to this count: it carries all five
      # materialized pages, the client-proven page table (kr-1256 sub_808F10 slot<=4, sub_5FB4F0's five-entry walk).
      preset_pages: 3
    family: modern
    # The modern bag family. kr-1256 sub_FA5520 unwraps a u32 compressed length and one zlib stream
    # before the 802/803/808 readers run (kr-1256 sub_9AE4A0, kr-1256 sub_9AEB10, dispatch case 808);
    # the 810 cash inventory is never enveloped (kr-1256 sub_10D8150 reads the count itself). The slot
    # record is InventorySlot@kr-1256 in packets/inventory.yaml.
    inventory:
      envelope: zlib
      # `mirror` publishes the modern slot fields in stored order; ordinary timed values require exact-build admission.
      # `ranked` (the legacy baseline) sorts ascending by item id, drops empty rows on a restatement
      # and needs the connection's inventory time origin for the remaining-day counts.
      rows: mirror
      # kr-1256 sub_8072A0 enumerates ordinary and Article rows separately; ordinary equipment Articles are admitted here.
      # Descendants retain Item rows for ordinary ownership until their own resolver and presentation are admitted.
      ordinary_article_builds: [kr-1256]
      # kr-1256 sub_804160, cn-774 sub_9A44B0 and tw-454 sub_C09140 subtract elapsed days from the ordinary timer.
      # Their full installers kr-1256 sub_804220, cn-774 sub_9A4550 and tw-454 sub_C02AF0 reset its origin.
      ordinary_expiry_builds: [kr-1256, cn-774, tw-454]
      # The packets a whole-bag restatement sends, in order: bag = gspInventoryUpdateAllInventorySlot
      # over the character bag, equipped = gspInventoryUpdateInventorySlots over the equipped bag,
      # articles = gspUpdateAllArticleSlot (complete owned Articles), cash = gspCashInvenUpdateAllInventorySlot (empty).
      replaced: [bag, equipped, articles, cash]
      # After a purchase: the character bag, then the same bag as the slots packet's first container.
      purchase: [bag, slots]
      # A changed-slot publication.
      changed: [changed]
    # kr-1256 sub_547950 consumes the custom vector retained at GameSetting +328.
    room_custom_rule_fields:
      target: unknown_328
      key: unknown_0
      values: unknown_4
    capabilities:
      room_custom_rules: true
      # Native title request and reply consumers are audited only for the two Korean baselines.
      title_operations: true
      # kr-1256 sub_EDFB50 and kr-1256 sub_EC9610 write the dedicated pet requests.
      pet_level_up: true
      pet_ability_change: true
      round_ping: true
      # kr-1256 sub_6E3A60 -> kr-1256 sub_7055D0: actor and bool32 form, with local charge/expiry.
      rhea_character_skill: true
      # kr-1256 sub_806530 resolves the first worn function-10001 inventory/article key.
      pet_equipment: true
      script_zombies: true # Own mode-8 Lua registration, qualified515, full504 and owned33287 are audited.
      ghost_zombies: true # kr-1256 sub_AD1600 loads mode28; kr-1256 sub_AC5110 handles its king cleanup.
      map_portals: true
      # kr-1256 sub_9601E0 and sub_95FAE0: cookie/probe and movement; no listener enablement.
      bomb_mission: true
      captain_mode: true
      bomb_round_series: true
      # Extreme Racing (round mode 24): S2C 711/712/714 are applied by kr-1256 sub_CE5600 through the strategy slot the
      # game dispatcher kr-1256 sub_9E1EB0 defaults to; the goal touch is C2S 711 (kr-1256 sub_B0D760 kind 5) and the
      # checkpoint touch the 32934 feed route. Layouts in packets/extreme-racing.yaml; not native-client acceptance.
      extreme_racing: true
      # kr-1256 sub_CE6F80 initializes native racing objects once the stage has loaded.
      extreme_racing_initialization: true
      # kr-1256 sub_67B6E0 consumes S2C 718 and kr-1256 sub_6E1E90 writes the relay shot 32902; opt-in, no scheduler.
      extreme_racing_cannon: true
      # kr-1256 sub_6DD900 reads the equipment frame S2C 1001 and kr-1256 sub_4996C0 applies it; the strategy installed for
      # mode 26 is kr-1256 GameWeaponMasterStrategy (kr-1256 sub_9E1710). Not native-client acceptance.
      weapon_master: true
      # kr-1256 sub_6D97D0 dispatches the ordered BnB placement, explosion and pickup operations.
      bnb: true
      # kr-1256 sub_CD7EE0 consumes the Area32 exchanges in packets/final-zone.yaml; deployment remains opt-in.
      final_zone: true
      # kr-1256 sub_6D97D0 and kr-1256 sub_6FBA90 consume the two native OneKill stages.
      native_one_kill: true
      # kr-1256 sub_4A1EB0, sub_9DAE50, sub_AD2060 and sub_6E0DA0 establish the script conversion exchange.
      zombie_escape: true
      udp_peer_setup: false # Peer setup is enabled only after its own control-path audit.
      udp_relay_movement: true
      # Party invitation packets are bound for this build (packets/party.yaml).
      # Native invitation and member-appearance acceptance remain outstanding.
      party: true
      # Clan bodies are stated for this build in packets/clan.yaml: readers kr-1256 sub_99C1D0 (passport),
      # kr-1256 sub_99CFA0 (mark info), kr-1256 sub_9B2690 (guild info) and kr-1256 sub_10C5590 (attendance
      # state, a modern-only packet). The empty client requests are the writers that stamp C2S 25, 2040 and
      # 2041 without a body. One open question is recorded in that file: the passport body may need a leading
      # word (16 bytes as sent today, 20 if the client reads it).
      clan: true
      # kr-1256 sender sub_9319E0 (C2S 118), reader sub_99A430, handler sub_9BCE60 (S2C 133); the reply layout is
      # FighterInfoReply@kr-1256 in packets/fighter-info.yaml.
      fighter_info: true
      life_items: false # The modern family's item kinds are not audited.
      # kr-1256 sub_6DA5D0 / kr-1256 sub_6ED050 and kr-1256 sub_6D55D0 prove the map, creation and slots.
      map_supplies: true
      horde_lottery: false
      # kr-1256 sub_6DC720 reports the unit; kr-1256 sub_9E1EB0 case 925 applies three point words.
      pve_points: true
      rescue_missions: false
      pve_rank_updates: false
      # kr-1256 sub_6D55D0 case640 -> kr-1256 sub_491940 applies an effect without clearing a held slot.
      direct_supply_effects: true
      # The cross-build object-economy audit verified every sender and dispatcher case: the drop
      # create (C2S 636), the pickup (635) and the notices (kr-1256 S2C 645/646) write the same
      # LucciDropRequest/LucciCreate/LucciPicked bodies the legacy structures declare, and the star
      # family (631/632, S2C 641/642) shares them. kr-1256 sub_6E8B40/sub_6DC600/sub_6DC3C0 and the
      # constructors kr-1256 sub_C16880/sub_C0A050 are the anchors; packets/object-economy.yaml.
      lucci_drops: true
      star_items: true
      horde_award_items: false
      direct_item_effect_echo: false
      relay_validation_report: false
      native_scene_seed_tables: false
      # kr-1256 sub_6F3200 reads victim cancellation at kr-1256 0x6F4A64..0x6F4B75 when context+3924 is set.
      # kr-1256 sub_483540 installs the 32 words as 1000 bits; attack criticals remain local.
      native_cancellation_seed_tables: true
      # kr-1256 sub_483620 reads the actor's table at +10628 for a player once kr-1256 sub_6CB270 sets the context
      # byte 3924 (kr-1256 0x6CC813). The scene accept sends zeros (S2C 5, read by kr-1256 sub_6CD810), so the round
      # start replaces them with every occupant's own roll.
      native_defence_seed_tables: true
      native_relay_hp_reports: false
      round_results: false
      direct_kill_reports: false
      character_reference_score_reports: false
      # kr-1256 sub_9D2FF0 case 114 gspServerChatNoticeMsg -> sub_9BE620 (reader sub_99C8A0) shows the text in the chat
      # log; layout ServerNotice@kr-1256 in packets/server-notice.yaml.
      server_notice: true
      # kr-1256 sub_9D2FF0 case 836 and sub_9C3880 (837) read the tabled reply and list (packets/weapon-presets.yaml).
      weapon_presets: true
      # The typed request family (serializer kr-1256 sub_114E2E0 through kr-1256 sub_E651C0;
      # packets/room-matching.yaml) and the stage-gate notification (kr-1256 sub_84F6C0 through the
      # MainMenuStage and LobbyStage handlers) are audited. The modern binding serves the start and
      # its keepalive with a configured default mode and refuses the party and listing types until
      # their flows are mounted.
      quick_matching: true
      # The modern revival family: kr-1256 sub_511450 writes the one-u32 revival request (the item
      # 100443 count checked through kr-1256 sub_808040), kr-1256 sub_6E3940/kr-1256 sub_6E3730 the respawn requests
      # and sub_7D0BB0 the extend; the grant returns on S2C 632 (kr-1256 sub_6F5E50). cn-774 and
      # tw-454 run the same family (packets/instant-revival.yaml): cn-774 sub_5AAAC0 with item 91,
      # tw-454 sub_7F5950, the same respawn shapes, and the grant on their S2C 605.
      instant_revival: true
      # kr-1256 sub_9D2FF0 case 12 sets the creation flag (S2C 12 gspNotifyCreateUserInfo, no body);
      # kr-1256 sub_5CCC60 builds C2S 31, kr-1256 sub_9A4E90 the S2C 13 name reply and the C2S 32 body, and
      # kr-1256 sub_9A46A0 S2C 14 plus the empty C2S 33 login-after - packets/character-creation.yaml.
      character_creation: true
      cash_check_request: false
      # kr-1256 sub_9B34D0 (S2C 811) and sub_9B3E00 (S2C 812) apply the slot and show the result text.
      equip_result_reply: true
      # S2C 807 gspCheckExpiredTimeResult: dispatch case 807 (kr-1256 sub_9D2FF0) runs kr-1256 sub_998FB0
      # into the reader kr-1256 sub_999C00 (u32 count, then that many 4-byte ids) and the consumer
      # kr-1256 sub_93C6E0, so the row can send it. Layout is ExpiredItems in packets/inventory.yaml.
      expired_item_notice: true
      # The gift box: the request senders are kr-1256 sub_E49DC0 (both list pages), kr-1256 sub_650770 (purchase),
      # kr-1256 sub_E4BB30 (thank-you), kr-1256 sub_E45350 / kr-1256 sub_E4A180 and the dialog stamps kr-1256 0xE2C2EF / kr-1256 0xE2C630 (single-gift
      # actions), kr-1256 sub_9369E0 (close); the list replies are read by kr-1256 sub_9B8240 (three words plus the
      # 88-byte record walk) and kr-1256 sub_9B8400 (two words plus the vector) - packets/present.yaml. The
      # modern family sends no new-gift query, so the icon rides the S2C push. The profile's shop row serves
      # the flows with the shared purchase terms.
      present_box: true
    # The native DynamicConfig generation. The per-slot content lives in the file named here
    # (beside the schemas in packets/dynamic-config.yaml; the .yml suffix keeps the schema reader
    # from mistaking content rows for a layout) and is marshaled through those schemas at serve
    # time, framed as the S2C 1500 mask plus one zlib blob per set bit. Bits 7, 10, 11 and 15
    # stay off: the slot 7 and 11 schemas are only partially split and slots 10 and 15 register
    # at runtime without a static decoder. Slot 14's form path and character choices still come
    # from the lobby block so the stage and the wire stay one decision.
    dynamic_config:
      content_file: dynamic-config-content.yml
      # kr-1256 sub_53CDF0 reads both words; descendants require their own consumer audit.
      pet_configuration_builds: [kr-1256]

