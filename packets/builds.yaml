      # id-400 sub_9068A0 calls sub_8CB4D0, which stamps C2S 825 on an empty packet. The S105
      # handler id-400 sub_7A38E0 refreshes the open shop's cash dialog through sub_8E2E40, as
      # kr-812 sub_81A820 does through sub_96FB40.
      cash_check_request: true
      # id-400 sub_49DF40 -> sub_48D2F0 uses victim/scorer words in the wide report.
      direct_kill_reports: true
      # id-400 sub_49DF40/id-400 sub_4A0390 emit ordinary kinds 1/2 with victim/scorer words.
      # cn-406 sub_43AEA0/cn-406 sub_43CF70 -> sub_42ADA0 prove the inherited interpretation.
      character_reference_score_reports: true
      # id-400 sub_786070 installs summed points and ranks in the native live rows.
      pve_rank_updates: true
      # id-400 sub_4A3C40 -> sub_48B020 queues a local copy when the native relay gate is clear.
      direct_item_effect_echo: false
      # id-400 sub_4992A0 builds only kinds 1 and 2 of S2C 720 and returns for 3/4/5; the
      # build has no GoHordeAward*LucciItem class and no C2S horde-award request.
      horde_award_items: false
    play:
      wire:
        # id-400 sub_65EC10 -> sub_48B020 sends and queues a copy while session+10214 is clear;
        # id-400 sub_48B0E0 dispatches that copy through GameContext virtual slot +28.
        spawn_group_applies_locally: true
        # A pirate death sends gcpPveUseRevival at zero HP (id-400 sub_592B00, modes 101 and 16), and the
        # death-timer end (id-400 sub_499640) then sends neither gcpRespawn nor gcpRequestRespawnIdx, so the
        # round brings the player back with gspGameRespawnCharacter (dispatcher id-400 sub_48A090 case 730),
        # as cn-324 does. Where the client times its own respawn, its revival clears the round's wait first.
        server_revives: true
      # The prologue keeps kr-812's horde-tutor mode 103: the stage-5 factory id-400 sub_858ED0 builds
      # the ordinary game stage for it, and the GameStage ctor id-400 sub_5CB050 (0x5CB557) arms the NPC
      # context for modes 9/101/102/103 as kr-812 sub_660D50 does. Mode 15 selects SinglePlayGameStage.
      score:
        npc_team_outcome: false # Pending this build's horde result consumer audit.
        rescue_credit: false # Pending this build's rescue score report audit.
        live_score_packet: false # id-400 sub_78B430 installs the complete ScoreData block.
        # The star touch handlers id-400 sub_6E8A60 / sub_6E82A0 report through gcpGameUpdateScore (id-400 sub_48D2F0).
        star_report: Full
        # id-400 sub_782D30 reads nested ScoreData; id-400 sub_78B4D0 passes it to id-400 sub_78C4E0.
        time_over_end: Scoreboard
      # No gcpUserHostStart class in this build (gspRepAutoStart gate id-400 sub_626970). The tutorial
      # still starts the kr-812 way: the room dispatcher id-400 sub_7833E0 case 0x1FE -> sub_786480 takes
      # gspRoomEnterGame case 0 without an armed automatic start, so the server sends it itself.
      # gspRepAutoStart would run the room's five-second automatic-start countdown first.
      host_start: false
      # id-400 sub_480790/sub_480800 prove the eight-word envelope only.
      # Ordinary score admission uses independently audited character references.
      score_reports: false

