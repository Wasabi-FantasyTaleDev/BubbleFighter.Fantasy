  # restated UserSlot@cn-706 tail (+208 bool, +209 bool, +212 u32, +220 bool, +216 u32, +132, +152, +228,
  # +232); login request writer cn-705 sub_610D30 writes cn-706 sub_611A60's three strings, adapter list
  # and trailing u32; shop enter sender cn-705 sub_656280 and catalog reader cn-705 sub_7A01F0 match cn-706
  # sub_656D60 / sub_7A17F0; cn-705 sub_8FE7F0 sends Packet_gcpReqInventoryUseItem as cn-706 sub_8FFFF0
  # does. The executable carries the GoHordeAward*LucciItem classes and no "endurance" duration type or
  # Life notice text, as cn-706. The opcode table follows cn-706's reviewed rows; the research catalog's
  # labels on 728/733/924 are score-update call sites feeding the shared sender cn-705 sub_4E6BC0, which
