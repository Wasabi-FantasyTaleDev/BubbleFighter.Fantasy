# The client builds the packet tables are written for, and what each is based on.
#
# kr-812 is the baseline: it states every value. Every other build names a `base` and states only the
# values that differ from it; a build that states nothing more is exactly its base. The same bases
# decide which rows of the structure files (room.yaml, ...) a build follows: a row's `except`, `only`,
# `also` or build-named replacement applies to the named build and to every build based on it.
#
# A build here is named after the profile that serves it (profiles/<build>/). The `base` is about
# packet layouts only and may differ from the profile's own `parent:`.
#
#   needs_idle_party   whether the main menu's plaza gate needs the solo idle gspUpdateParty before
#                      gcpReqGotoLobby can leave. Every legacy build's does unless shown otherwise.
#   play               how the build's tutorial and play rooms differ in packets that are still written
#                      in code. Each value is described where the baseline states it.
#
# Every function address names its client build.
version: 1
builds:

  # KR 2015. The baseline of every build whose packet classes keep their names.
  kr-812:
    # kr-812 sub_804850 replaces row +64/+44/+48/+56; retain the legacy combat projection.
    # kr-812 sub_5521F0 consumes stars at +112; kr-812 sub_7527C0 consumes collected Lucci at +128.
    live_score_kinds: { score: 29, knockdowns: 0, kills: 24, deaths: 10, stars: 35, collected_lucci: 13 }
    # kr-1256 sub_961990, cn-774 sub_B5ADF0 and tw-454 sub_A7A930 send one native tick on the relay.
    # cn-738 sub_A3B960 and cn-742 sub_97E7C0 match; membership does not enable either plugin row.
    relay_latency_builds: [kr-1256, cn-738, cn-742, cn-774, tw-454]
    # kr-812 sub_9EA920 sends synthesis; kr-812 sub_830A20 consumes the result after inventory publication.
    legacy_laboratory_builds: [kr-812]
    # kr-812 sub_462D30 initializes queue mode 1; kr-812 sub_8E1470 restores it on stage changes.
    # kr-812 sub_6E1350 -> kr-812 sub_463080 queues a local copy; kr-812 sub_6DE5B0 expands only on the master.
    # The tutorial's special-local gate bypasses this queue (kr-812 sub_7FF340), so it keeps its reply.
    # cn-717 sub_474460 -> cn-717 sub_472FE0 and id-1809 sub_448A10 -> id-1809 sub_447910 send the same way: their
    # constructors set default mode 1 (cn-717 sub_474130, id-1809 sub_4486D0), which cn-717 sub_4755D0 and
    # id-1809 sub_4499F0 copy into the current mode, and only stages 5 and 6 set the gate (cn-717 sub_882D40,
    # id-1809 sub_7A9BD0). cn-717 sub_744160 also expands only on the master.
    npc_local_spawn_group_builds: [kr-812, cn-717, id-1809]
    # kr-1256 sub_87CB30 restores local+transport mode before each scene; kr-1256 sub_7AB190 queues these frames.
    # kr-1256 sub_95B0B0 selects relay/game transport; the master's local copy already applies the concrete spawn.
    # cn-774 sub_A1AB60 and tw-454 sub_B4E4D0 restore queue mode 1 before scene creation.
    # cn-774 sub_953C90 and tw-454 sub_6323B0 queue a local copy then select their match transport.
    npc_peer_transport_builds: [kr-1256, cn-774, tw-454]
    # kr-812 sub_430640 supplies byte seats; the shared decoder also handles audited word-seat envelopes.
    captain_score_fields:
      victim_seat: unknown_16
      killer_seat: reporter_slot
    # kr-812 sub_7527C0 renders row +128; kr-812 sub_804850 installs absolute live stat 13 there.
    # Explicit membership prevents unaudited descendants from acquiring the counter meaning.
    collected_lucci_builds: [kr-812]
    collected_lucci_field: unknown_128
    # kr-812 sub_701AB0 reads the selected-stage row; kr-812 sub_5200E0 reports bubble goals.
    # kr-812 sub_51F430 reports rescues; kr-812 sub_6E05D0 reports compact NPC finishing blows.
    # The explicit list excludes descendants until their own tutorial consumers have been audited.
    tutorial_score_builds: [kr-812]
    tutorial_score_help_field: unknown_56
    # How the client turns a worn set into its local ordinary-defence roll (DefenceSeedCatalog), which the seed
    # tables approximate using the same integer endpoints. kr-812 sub_9961C0 sums damagedDecRatioMin/Max (effects 18/19 of
    # kr-812 sub_993C50) into the attribute block, sums the RC/KR/BB counts and assigns their thresholds; buffGroup
    # does not select these cases. kr-812 sub_986F60 applies the character, then every distinct worn item in
    # ascending order. The legacy descendants register the same effect ids (cn-324 sub_8114E0, cn-406 sub_87BFA0,
    # cn-404 sub_9406B0, cn-408 sub_946EA0, id-400 sub_909360, id-1809 sub_92F920, cn-717 sub_A3F2A0) and test the
    # same owners and counts (cn-406 sub_86F0B0, cn-404 sub_932D90, cn-408 sub_938B90, id-400 sub_8FB940,
    # id-1809 sub_922350, cn-717 sub_A31BC0); cn-324 states its own owners. Device creation overrides endpoint precision below.
    defence_seed:
      # The registered set families with defence effects: RC 67-70, KR 94-96, BB 98-101 (kr-812 sub_993C50).
      # AMdamagedDecRatioMin/Max (78/79) are summed into the block but never read, so AM adds nothing.
      families: [rc, kr, bb]
      # kr-812 sub_557230 truncates (double)min * 100.0 with _ftol; every IDirect3D9::CreateDevice call in
      # kr-812 sub_ABBFE0 receives the preserve flag from kr-812 sub_8EBC30 and retains x87 precision at device
      # creation. The endpoint multiplication uses the stored float extended to double.
      precision: double
      # kr-812 sub_9A5800 resets the RC threshold to 5 and every other sum and threshold to zero.
      rc_threshold_default: 5
      # kr-812 sub_986B80 adds the KR minimum when 100237 or 190044 is worn, and the BB pair when 100240 or 100712
      # is worn, once each family's count reaches its threshold.
      kr_owner_items: [100237, 190044]
      bb_owner_items: [100240, 100712]
      # kr-812 sub_99C480 applies none of these characters' own rows.
      skipped_items: [300006, 300007]
    # kr-812 sub_7FE410 -> sub_418110 applies the flags before entry; sub_7FF340 reads the index and attacker.
    # kr-812 sub_4FB400 reads ScoreData's fourth team array when its native result flag is set.
    round_series_fields:
      rounds_to_win: 2
      settings_flags: unknown_172
      settings_index: unknown_252
      entry_index: unknown_36
      entry_attacker: unknown_40
      entry_state: unknown_44
      team_wins: unknown_228
    # kr-812 sub_8F6A20 checks seat +140.
    plaza_recruitment_field: unknown_140
    plaza_recruitment_active_field: unknown_148
    plaza_recruitment_text_field: ""
    # Images/Icons/LevelMark.smf contains 200 native rank frames.
    display_level_max: 200
    # The peer feed (gpp*, from 0x8000) arrives on the game or match relay connection (demux kr-812 sub_80D4C0) and
    # what no typed round_feed route claims is passed on unread; every legacy build inherits this.
    round_feed_passthrough: true
    # kr-812 sub_511380 / kr-812 sub_51E920; cn-324 sub_469A30 / cn-324 sub_4757B0;
    # cn-406 sub_42CF00 / cn-406 sub_439B40; cn-279 sub_81D680 / cn-279 sub_81B310;
    # id-400 sub_48F400 / id-400 sub_49CAD0. Unlisted descendants retain pass-through.
    # cn-404 sub_4BD7D0 / cn-404 sub_4CAC30; cn-408 sub_4BD110 / cn-408 sub_4CA810;
    # cn-706 sub_4C9270 / cn-706 sub_4D7590; cn-717 sub_545F30 / cn-717 sub_553B10;
    # id-1809 sub_4E4DD0 / id-1809 sub_4F1D60 each resolve the final actor and raise event 102.
    round_feed:
      Dead: { builds: [kr-812, cn-324, cn-406, cn-279, id-400, cn-404, cn-408, cn-706, cn-717, id-1809], opcode: gppDead, structure: Dead, actors: [actor], life_event: death_cleaned, life_actor: actor }
    # How a player comes back (C2S gcpRespawn, S2C gspRespawn): body spawn_index (RoundSpawnAcceptance /
    # RoundSpawnConfirmation) or echo (RoundResetRequest / RoundResetReply); audience room or requester; completion
    # grant or match_confirmation; admission owner or cleaned_death. kr-812 sub_51E2C0 resolves the named actor's
    # Character on whichever client reads gspRespawn and revives it when the flag is set. It also emits
    # gppRelayedRespawn when kr-812 sub_58B8E0 holds; this server keeps its existing room-wide grant and completes
    # the respawn without waiting for that peer notification. Every legacy build inherits this admission policy.
    respawn:
      body: spawn_index
      audience: room
      completion: grant
      admission: owner
    # Room chat colour: kr-812 sub_8023E0 colours a channel-1 line itself (-24159) and otherwise takes the
    # line's suffix word, so the line carries its channel and leaves the suffix at its default.
    room_chat_colour: channel
    # Room list paging: the reply answers the requested page with as many rows as the request's second word asks
    # for, and says whether another page follows (kr-812 reader sub_680780).
    room_list_paging: true
    # With no matching endpoint, the startup group stays zero and sub-key zero is reserved
    # for the original socket: kr-812 sub_8DE5C0 / sub_8E6A40 / sub_8E7110;
    # cn-324 sub_786B10 / sub_78CE60 / sub_78D580; cn-279 sub_6D6D00 / sub_6D8C20 / sub_6D8800.
    # This describes fresh-process directory selection, not a mid-session directory update.
    gateway_center_group: 0
    gateway_reserved_center: 0
    # kr-812 sub_6A0E10 selects the three maps and their accompanying strings;
    # kr-812 sub_5BD770 sends the accompanying string before the selected map.
    # cn-406 sub_595C70, cn-408 sub_652440, cn-706 sub_632A80,
    # id-400 sub_60A550 and id-1809 sub_652530 copy the same grouped pairs
    # from SessionSetting+88. cn-717 sub_6FE570 uses the corresponding
    # fields after the omitted earlier members; the inherited field names stay stable.
    room_round_setting_fields:
      request_strings: [unknown_8, unknown_36]
      target_strings: [unknown_340, unknown_256, unknown_368, unknown_284, unknown_396, unknown_312]
    # Request scalar names at the native offsets; aliases do not assign field meaning.
    # Readers kr-812 sub_5C8ED0 and cn-324 sub_586150 carry these values into GameSetting.
    room_setting_change_fields:
      third_string: unknown_60
      first_flag: unknown_116
      second_flag: unknown_117
    capabilities:
      room_custom_rules: false
      # Native title request and reply consumers are audited only for the two Korean baselines.
      title_operations: true
      # kr-812 sub_832EC0 and cn-717 sub_8BB460 consume native growth/regression notices.
      pet_evolution: true
      pet_level_up: false
      pet_ability_change: false
      tutorial_practice_progress: false
      round_ping: false
      # The Rhea character form exchange is present only in the audited modern clients.
      rhea_character_skill: false
      # The first worn function-10001 item is the active pet: kr-812 sub_9782C0.
      # The same selection is read independently by cn-406 sub_85ED90, cn-404 sub_922450,
      # cn-408 sub_928080, cn-706 sub_900310, cn-717 sub_A21F90, id-400 sub_8EAF60 and id-1809 sub_9140A0.
      pet_equipment: true
      # kr-812 sub_833A60 authorizes native region motion; unaudited descendants override this.
      map_portals: true
      # Later peer senders retain their established local effects; early clients override this policy.
      round_feed_echo_sender: false
      # kr-812 sub_8117F0/kr-812 sub_8108C0: four-byte cookie and native movement; no listener enablement.
      udp_peer_optimized_movement: false # Enabled only for audited direct-peer compressed movement.
      udp_peer_setup: false # Peer setup is enabled only after its own control-path audit.
      udp_peer_discovery_in_room: false # Set when discovery is pumped only by the waiting-room scene.
      udp_relay_movement: true
      # kr-812 sub_984930 rejects category 6 before confirming an expired-item discard.
      # The same guard is in kr-1256 sub_8136F0, cn-774 sub_9B4BC0 and tw-454 sub_C12C40.
      inventory_throw_excludes_category6: true
      # Parties: kr-812 senders sub_929F40 (invite), sub_6D88F0 (accept), sub_839E50 (answer), sub_5EDDF0 (leave),
      # sub_92A170 (kick), sub_92A270 (leader); S2C handlers sub_81CDF0, sub_81DEA0, sub_926900, sub_926B90,
      # sub_9270C0, sub_926D90, sub_927290, sub_9285D0, sub_929180, sub_929370, sub_928C50. Layouts in
      # packets/party.yaml. A build without one of the opcode rows turns this off.
      party: true
      # The player menu's "view info": gcpReqFighterInfo in, gspRepFighterInfo out (packets/fighter-info.yaml,
      # packets/fighter-info.yaml). kr-812 sender sub_6C2EB0, reply reader sub_83DD00, handler sub_82C960
      # (S2C 124 in kr-812 sub_837170). A build without the class turns this off.
      fighter_info: true
      # Clan game-connection frames are read in this build: kr-812 sub_844AB0 (passport), kr-812 sub_844FB0
      # (mark info) and kr-812 sub_8407F0 (guild info). Its bodies differ from the modern table (the passport
      # carries a leading word before the name and the mark info two counted tables), and no clan row runs on
      # the legacy builds, so the capability stays off until a legacy profile states that shape; the legacy
      # shapes are written beside the modern ones in packets/clan.yaml.
      clan: false
      # Map supply layouts and build-specific readers are in packets/map-supplies.yaml.
      weapon_objects: false
      map_supplies: true
      # Enables the award lottery and its event 176/177 consumers.
      horde_lottery: true
      # kr-812 sub_7FED80 updates live rows; sub_806790 sorts the HUD locally.
      pve_points: true
      # Mission consumers and resource groups are in packets/pve-rescue-missions.yaml.
      rescue_missions: true
      # kr-812 sub_7FEE30 retains result presentation data but does not install live point rows.
      pve_rank_updates: false
      direct_supply_effects: true
      direct_supply_effect_uses_item_used: false
      # NPC-kill Lucci: kr-812 sub_A1C640 sends C2S 736 / 2021, sub_50E1F0 sends the C2S 735 pickup;
      # S2C 720 (sub_51AD80) creates and S2C 721 (sub_516570) removes the item. Layouts in
      # packets/lucci-drops.yaml, rules in packets/lucci-drops.yaml.
      lucci_drops: true
      # Star modes 5 and 6: kr-812 sub_514830 sends C2S 732 and sub_50E0D0 the C2S 731 claim; S2C 716 (sub_51AB40)
      # creates and S2C 717 (sub_5153D0) removes the star, all with the Lucci packets' serializers; the client
      # reports its own count in gcpGameUpdateScoreOptimze kinds 6/15/7/16 (sub_75CE60, sub_75C680, sub_520A20).
      # Rules in packets/builds.yaml.
      star_items: true
      # kr-812 sub_51AD80 builds GoHordeAward1/5/10LucciItem for S2C 720 kinds 3/4/5. A build whose
      # 720 handler ignores or mishandles those kinds says false and never receives them.
      horde_award_items: true
      # kr-812 sub_525670 sends through sub_463080, which also queues a local copy while the stage gate is clear;
      # cn-324 sub_47BCA0 -> sub_465EA0 does the same (gate +7454, cleared for ordinary rounds by cn-324
      # sub_6EED20). An echo makes the sender apply the item twice, and the second copy's objects advance the
      # master's object numbering on the host only, so every member's NPC ids drift from the host's.
      direct_item_effect_echo: false
      # kr-812 sub_810C20 sends the nested validation report after inbound relay 1.
      # This native support flag does not mount a listener or enable relay admission.
      relay_validation_report: true
      # Own seed-table readers, writers and relay dispatch cases are proven in
      # the six post-CN2011 legacy clients; this does not mount a relay route.
      native_scene_seed_tables: true
      # cn-324 sub_4A9A00 consumes the victim's cancellation bits independently of its attack tables.
      native_cancellation_seed_tables: true
      # A player's ordinary-defence roll reads its 1000-byte seed table once the relay context byte is set
      # (kr-812 sub_557230 against dword_E82684+4728, set in kr-812 sub_5041A0), so the server issues every
      # occupant's table with that occupant's own local roll (defence_seed above).
      native_defence_seed_tables: true
      # cn-324 sub_460042 sets the server-damage byte at construction, so the HP reports of packets/relay-hp.yaml
      # arrive all round; every build that runs the seed authority has its own rows for them.
      native_relay_hp_reports: true
      # kr-812 sub_804620 / sub_804B10 / sub_5AD030 install score and reward stages.
      round_results: true
      # kr-812 sub_51F780 -> sub_520A20 reports direct kills using both character references.
      direct_kill_reports: true
      # Baseline ordinary score admission uses the separately audited narrow reports.
      character_reference_score_reports: false
      # kr-812 sub_845500, dispatcher kr-812 sub_837170 case 107.
      server_notice: true
      # kr-812 sub_837170 case 0x326 -> sub_821620 -> sub_6D5890: a counted list of expired item ids, shown as
      # notices only (the client removes nothing). Layout in packets/inventory.yaml ExpiredItems.
      expired_item_notice: true
      # Bomb mission (round mode 19): kr-812 sub_52A590 sends C2S 2012 gcpBombState and kr-812 sub_52AAC0 C2S 2011
      # gcpBombMissionOver; S2C 973 gspBombState is applied by kr-812 sub_4245B0 (state cases 0..6) and
      # S2C 974 gspObserver by kr-812 sub_52A640; the dying-mob drop frame gppMobDropBombOnDead rides the
      # round feed's damager family. Layouts in packets/mode-control.yaml; this records native support, not
      # that the round is playable end to end.
      bomb_mission: true
      # Captain mode (round mode 20): S2C 982 gspCreateCaptain names a seat (kr-812 sub_7FDBA0 -> event 309,
      # kr-812 sub_4304C0), C2S 2018 gcpDropCaptain reports the local player's death with its own seat
      # (kr-812 sub_42BCE0 -> kr-812 sub_439B10), and gcpGameUpdateScore kind 27 reports a Captain kill
      # (kr-812 sub_430640). Layouts in packets/mode-control.yaml and packets/score-reports.yaml.
      captain_mode: true
      bomb_round_series: true
      # Extreme Racing (round mode 24): kr-812 has no ExtremeRacingGameStage or race strategy, so no build inherits
      # the race frames of packets/extreme-racing.yaml from this baseline.
      extreme_racing: false
      extreme_racing_initialization: false
      extreme_racing_cannon: false
      # WeaponMaster (round mode 26) assigns weapons with packets/weapon-master.yaml EquipmentApply; kr-812 has no
      # GameWeaponMasterStrategy.
      weapon_master: false
      bnb: false
      final_zone: false
      native_one_kill: false
      zombie_escape: false
      script_zombies: false
      ghost_zombies: false
      # The gift box. kr-812 sub_837170 cases 815..828 are the Present replies (RTTI Packet_gspRepPresent*), sent by the
      # client's DlgSendPresent (kr-812 sub_96F350 -> sub_95C150 stamps C2S 816), DlgPresentList (kr-812 sub_960BE0 stamps
      # C2S 813 / 814) and the accept path (kr-812 sub_960FC0). Layouts in packets/present.yaml, rules in
      # packets/present.yaml. cn-324 and cn-279 number the family one higher; every build but the cn-735
      # family has the same classes (the task-bar count words differ and are annotated in the table).
      present_box: true
      # Life-counted items. kr-812 sub_993080 (called by the ShopItem loader sub_9A04D0) maps durationType
      # "endurance" to item kind 3 when feature switch 1210 is on, and sub_A62430 case 0, the default region,
      # turns 1210 on. A kind 3 bag slot carries its life in the slot count (+8): kr-812 sub_6D6480 announces
      # "[ Life xN ] remaining" from it for slots above zero, and kr-812 sub_978350 allows buying the item again
      # only when that count is 0 or less. kr-812 sub_6D5890 has a "Life used up" notice for kind 3. cn-717
      # follows (cn-717 sub_A3E550 parser, sub_A22020 buying check, sub_739E10 notice). The daily rule itself
      # is the server's: the client has no per-login decrement. Rules in packets/inventory-use.yaml.
      life_items: true
      room_inventory_selection: false
      weapon_presets: true
      instant_revival: true
      # kr-812 sub_5B3640 and sub_687640 supply the ordinary matching selectors and result.
      quick_matching: true
      # kr-812 sub_837170 case 12 sets byte_E827DB; kr-812 sub_681FE0 selects CreateUserStage.
      # The same flag drives the post-creation tutorial offer in kr-812 sub_685590.
      character_creation: true
      # kr-812 sub_839EC0 sends the empty gcpReqCheckCash (C2S 825); the S105 reply enables the
      # waiting cash purchase dialog through kr-812 sub_81A820 -> sub_96FB40 -> sub_96F710.
      cash_check_request: true
      # kr-812's 802 repaints the bag cells (kr-812 sub_8211F0 -> sub_951810) and its recorded
      # session carries no S2C 808/809 wear/removal result.
      equip_result_reply: false
    # Whether the wear and removal result (where equip_result_reply is on) follows the restated bag and view:
    # cn-324 sub_70B280 rebuilds the room inventory from the bag it already holds when the result arrives.
    equipment:
      result_after_inventory: true
      # The equipped view body (gspInventoryViewUpdateView): kr-812 sub_80A4F0 reads EquippedItemList.
      view: EquippedItemList
      # A local view publication: the view, then the preset bar (kr-812 sub_987BA0 stores the bar after the view).
      local_view: [view, preset_update]
    needs_idle_party: true
    # The gcpReqLogin request and gspRepLogin reply layouts the legacy messages row reads and writes:
    #   request_trailer     true: two u32 follow the adapter list (kr-812 sub_682370); false stops there
    #   request_token       true: one more u32 follows the adapter list (read and ignored)
    #   request_extra_wstr  true: one more wstr ends the request
    #   login_response      true: the reply is LoginResponse then LoginNational instead of the legacy reply
    login:
      request_trailer: true
      request_token: false
      request_extra_wstr: false
      login_response: false
      # How the reply is written and the order of the publications a successful login sends. A build
      # that differs states its own values; the burst below is the order every kr-812-based row sent
      # before the sequence became data.
      reply: legacy
      main_menu: sender
      burst: [login_reply, user_stat, inventory, equipment_view, main_menu, expired_items]
    # The item shop's C2S 801 request and the S2C gspRepEnterShop catalog layout the shop row writes.
    #   enter_request  empty (no body), token (u64), token_main (u64, then the u32 main tab)
    #   catalog        the reply after its result word, then the card vector, an i64 and the category tree:
    #     token          true: a has-data bool32 and the request's cache token follow the result
    #     stock_type     u16 or u32: the width of each card stock's type field
    #     tree           ordered (the workbook's card-linked mains in displayOrder), landing (the open
    #                    main 1000 added when it has no card) or landing_defaults (also each main's
    #                    default subcategory rows); ordered_defaults retains those rows in display order
    #     page_type      sheet (each subcategory's workbook page mode) or main (2: cards of the selected
    #                    main, for clients whose sheet mode ignores the card vector)
    #     trailer        none, ids (an empty counted u32 vector) or ids_main (that vector, then the
    #                    echoed main category)
    # kr-812's request writer kr-812 sub_6DA560 sends the token and the main tab; the reply echoes the main,
    # which kr-812 sub_820CA0 hands to the dialog, and tab widgets are made in tree order (kr-812 sub_96DB90).
    shop:
      enter_request: token_main
      catalog:
        token: true
        stock_type: u16
        tree: ordered
        page_type: sheet
        trailer: ids_main
      # The result word gspRepShopBuy carries for each refusal the server can name. kr-812 sub_827550 treats 1
      # as success and selects a native refusal dialog for each known code; an unknown code shows a generic failure.
      # The matching switches are cn-717 sub_727200, cn-324 sub_70C720, cn-406 sub_72ACE0,
      # cn-404 sub_7DD830, cn-408 sub_7E0DF0, cn-705 sub_7B7880, cn-706 sub_7B9070,
      # id-400 sub_7AFD20 and id-1809 sub_7D4B00.
      refusal_codes:
        # Not enough Lucci, not enough cash, already owned, purchase limit, and unavailable for repurchase.
        lucci_short: -13
        cash_short: 38
        already_owned: 11
        limit_reached: 17
        no_more_allowed: 22
    # What the lobby seeds and offers (lists replace the base's whole list):
    #   creation_character_types  the native creation stage's characters; the created character is item
    #                             300000 + type
    #   starter_item_ids          the new bag, in bag order; every id must exist in the build's ShopItem table
    #   starter_worn_ids          the worn subset of the starter bag
    # kr-812's creation stage offers Dao (1) and Dizni (2); its ShopItem table carries these starter ids.
    lobby:
      creation_character_types: [1, 2]
      starter_item_ids: [300001, 201001, 201003, 201004, 202001, 202003, 202004, 203001, 203003, 203004, 204001, 204003, 204004, 205001, 207001]
      starter_worn_ids: [300001, 202001, 201001, 205001, 207001]
    play:
      tutorial:
        # The prologue is the tutorial room's only wave map: in ServerShared/MapMeta.xml it alone has stageNum 0
        # and no AIScriptFileName (its pirates come from NpcMode/rel_prologue_01*.lua); every sin_mission_* row
        # is a numbered stage with its own goals. kr-812 sub_8E1240 builds SinglePlayGameStage only for mode 15,
        # and that stage reads goalPangCount, goalHelpCount, goalPointArrive and the rest from the MapMeta row of
        # the room's map key (kr-812 sub_6FF040); mode 103 builds the wave game stage, which a mission map
        # cannot run. The same holds for every legacy build's own MapMeta.
        wave_map_key: rel_prologue_01
        # gspGotoRoom already sets the room master (kr-812 sub_68EAD0 -> sub_689F80, the same store as the 502 handler
        # kr-812 sub_7FD460), and a gspRoomSetMasterSlotIdx that lands after the switch to the room stage shows the
        # room-master notice (kr-812 sub_7FD460 -> sub_8E2A80), so the tutorial start does not send it.
        master_slot_packet: false
      # What starts a tutorial match: RoomEnterGame (the server sends gspRoomEnterGame itself) or
      # RepAutoStart (the server sends gspRepAutoStart and the client asks to enter).
      match_start: RoomEnterGame
      wire:
        # kr-812 sub_6E1350 -> sub_463080 -> sub_4620A0 has explicit local-only,
        # local-plus-transport, and transport-only branches. The common room path
        # does not establish which branch is selected, so preserve the host reply
        # until a matching native scenario proves a sender exclusion.
        spawn_group_applies_locally: false
        # The server brings a dead player back when the wait ends (gspGameRespawnCharacter), instead
        # of the client asking on its own.
        server_revives: false
        # gspGamePreCountDown is sent before gspGameCountDown.
        pre_count_down_first: false
        # A room whose creator chose no map is shown as the all-random entry: the key it has and the theme it
        # sits under. Empty leaves such a room as the creator's client sent it.
        # Every create path copies the startup map of Config/Lambient.xml (kr-812 sub_480730 and sub_480860
        # through sub_480700), so a create never carries a choice; kr-812 sub_5C1080 passes session+188 to the
        # thumbnail, and the host's start (kr-812 sub_5C3F80) draws a map for Random itself (sub_6A23A0).
        unchosen_map_key: Random
        unchosen_map_theme: All
        # The pirate battle's all-random entry is its first difficulty's marker: a mode-101 create carries
        # Random_Hot_Dif1 in the three map strings and All as the theme. kr-812 sub_C674B0 holds the literal; the host's start
        # resolves it to one of that difficulty's maps (kr-812 sub_415D30 / sub_415F30 from sub_5C3F80).
        unchosen_difficulty_mode: 101
        unchosen_difficulty_map_key: Random_Hot_Dif1
        # The leaver's gspRoomSetSession keeps the main-menu kind but restates the room just left: its title,
        # open seats and GameSetting, with room number and state 0 and the leaver as the only occupant.
        # kr-812 sub_7FD310 -> sub_6808C0 copies it whole into
        # the session object the plaza seats and avatars are then built from (kr-812 sub_6CBFF0).
        restate_left_room: true
        # The plaza entry follows gspGotoLobby by about 120 ms on return from a room. The client switches
        # stages on a later frame (kr-812 sub_8E1240 sets the pending stage, sub_A8B050 builds LobbyStage after the
        # network pump), LobbyStage builds the plaza avatars once while it is constructed (kr-812 sub_672110 ->
        # sub_6C7450 -> sub_6CC6F0), and leaving the room deletes the own avatar (kr-812 sub_7FDE50 -> sub_6CBF40).
        plaza_entry_settle_ms: 150
      # The room master starts the match with gcpUserHostStart.
      host_start: true
      # kr-812 sub_7FF340 / sub_806550 select stage 5 for isSinglePlayTutorial;
      # kr-812 sub_8E1240 / sub_660D50 require mode 103 for the prologue NPC context.
      # Its load report must release the one-seat loading gate before native waves run.
      one_seat_waves: true
      # Ordinary NPC waves use the same native exchange independently of tutorial entry.
      # id-400 sub_986B20 / sub_985620 and id-1809 sub_9A5720 / sub_9A4220 prove the host/peer gate.
      npc_waves: true
      # Only inbound kill-credit codecs are gated here. Native result output is independently
      # selected by capabilities.round_results so unaudited reports do not suppress rewards.
      score_reports: true
      # How the score packets are shaped. The seat rows are the ScoreRow table of score.yaml.
      score:
        # One gcpGameUpdateScore of eight u32 carries both the knock-down and the finishing blow, instead
        # of the 16-byte gcpGameUpdateScore and a separate gcpGameUpdateScoreOptimze.
        wide_report: false
        # The build has gspUpdateScoreData; without it the whole scoreboard is sent after every report.
        live_score_packet: true
        # ScoreData field order, defaults and fixed counts live in score.yaml.
        # gspGameEndGame carries the outcome in its first word instead of its second.
        outcome_first: false
        npc_team_outcome: true # kr-812 sub_5ACB20 compares local UserSlot+124 with the end word.
        # Star modes: the client reports its own count in gcpGameUpdateScoreOptimze (kr-812 sub_52D9E0) with
        # kind 6 for a small star taken or started with (sub_75CE60, sub_661AF0), 15 for a big one (sub_75C680),
        # 7 and 16 for each small or big star dropped (sub_520A20, sub_5632F0).
        star_report: Optimized
        star_small_gained: 6
        star_big_gained: 15
        star_small_lost: 7
        star_big_lost: 16
        # Captain mode: the members who see a Captain fall report kind 27 with both characters and seats
        # (kr-812 sub_430640, reached through event 312 from kr-812 sub_55D8E0); packets/score-reports.yaml.
        captain_kill: 27
        # What gspGameTimeOverEnd carries; its handler opens the score stage of the result scene.
        # TeamTotals: two bytes, the totals of teams 1 and 2 (reader kr-812 sub_80A530), sent 3 s after
        # gspGameEndGame when the time limit ended the round.
        # Scoreboard: the whole ScoreData block, sent at every end.
        time_over_end: TeamTotals

