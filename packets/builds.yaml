        horde_stage_outcome: true # cn-324 sub_438500: empty S2C 906/907 sets HordeModeMgr+5328; sub_43A4C0 selects the result banner.
        time_over_end: Scoreboard     # handler cn-324 sub_6F2280 is the only caller of the scene's start cn-324 sub_63B230

  # China 2011 (0.1.5.005). Most room packets of this build are not named yet; it runs cn-324's values.
  cn-279:
    # cn-279's request writer cn-279 sub_481D60 sends no body (inherited); its catalog is its own.
    # Its reader cn-279 0x450090 reads cn-324's segments with 28-byte stocks (cn-279 0x44CC70: a u32 type),
    # needs only the open main (cn-279 sub_66B830), and its page-1 mode cn-279 sub_66AB50 skips the cards.
    shop:
      catalog:
        stock_type: u32
        tree: landing
        page_type: main
    capabilities:
      # cn-279 sub_44C1A0 reads a one-word request, and its reply reader sub_44EFC0 ends in a counted vector of
      # three-word records (sub_453420) where every later legacy build has two strings: not read to the end.
      fighter_info: false
      rescue_missions: false
      pve_points: false # No reviewed native score-unit report or live cooperative point consumer.
      pve_rank_updates: false
      # cn-279 reads fourteen map vectors (sub_403EA0), a 36-byte creation envelope (sub_403820) and a 28-byte drop
      # request (sub_404180), takes the seat and kind in two-word grant and use packets (sub_820120, sub_81BB50) and
      # has no switch packet and no team box; packets/map-supplies.yaml names each difference.
      map_supplies: true
      horde_lottery: false # The early native selection/close cycle is not reviewed yet.
      direct_supply_effects: false # No gspPveItemUsed class in this build's dispatcher.
      direct_item_effect_echo: false
      native_scene_seed_tables: false # CN2011 has no own seed-table vtables or relay cases.
      relay_validation_report: false # cn-279 sub_701270 sends game-side success on relay 1, without a validation report.
      round_results: true # cn-279 sub_7069B0 / sub_753C80 install nested scores and reward stage 3.
      # cn-279 sub_827A30/sub_8268D0 -> sub_818DE0 emit ordinary kinds 1/2 with two character references.
      character_reference_score_reports: true
      # No reviewed consumable revival packet is mounted for this early client.
      instant_revival: false
    base: cn-324
    play:
      wire:
        spawn_group_applies_locally: false # Pending the cn-279 native local dispatch audit.
      score_reports: false            # not read for this build yet
      score:
        npc_team_outcome: false # Pending this build's horde result consumer audit.
        rescue_credit: false # Pending this build's rescue score report audit.
        outcome_first: false          # cn-279 sub_705DF0 reads Packet_gspGameEndGame's second word
        # cn-279 sub_88ED00 reports a big star taken with kind 14 and its drop path a big star lost with 15.
        star_big_gained: 14
        star_big_lost: 15
      tutorial:
        old_mode: 1 # cn-279 sub_41E220 initializes GameSetting+8 to 1 for the old tutorial.
        master_slot_packet: true # kept as on cn-324: its own gspGotoRoom master store is not audited.
        # The select flow's second entry (Shift-click, cn-279 sub_6F8B20) sends an empty map key;
        # the server names the old-tutorial map itself (its #spawn_npc01..03 markers feed
        # NPCTutorial, and the stage strings rel_Tutorial_01/02 + Stage1/Stage2 ride in the exe).
        old_map_key: rel_Tutorial_01
        # select_kind stays 5 (the practice-mode select scene, live-verified and stable). Kind 8
        # (TutorialRoomStage, cn-279 sub_6DA4E0 case 8) exits the client at stage entry with both
        # an empty and a rel_Tutorial_01 room body; its own GotoRoom reader needs pinning before
        # another attempt. The stage's UI (Ui/TutorialRoomStage.ui) exists in Ui0000.pkn.

  # China 2014 (0.2.51.002). Uses id-400's layout base with audited differences below.
  cn-706:
    base: id-400
    # id-400's request plus one trailing u32 (writer cn-706 sub_611A60, reader cn-706 sub_611AD0); the reply
    # reader cn-706 sub_7A0FA0 is id-400's field for field.
    login:
      request_token: true
    # cn-706's reader cn-706 sub_7A17F0, card cn-706 sub_481A40, stock cn-706 sub_481810, category
    # cn-706 sub_79DEE0 / sub_64C780 / sub_79FCF0 and tab filter cn-706 sub_8FA020 match id-1809's
    # id-1809 sub_7BEFF0, sub_497860, sub_497630, sub_7BBC60 / sub_66BF90 / sub_66BE50 and sub_90DD50.
    # Request writer cn-706 sub_656D60 sends the token.
    shop:
      catalog:
        trailer: ids
    # The starter bag this build was brought up with (kr-812's); its ShopItem table is not audited
    # against id-400's smaller set.
    lobby:
      starter_item_ids: [300001, 201001, 201003, 201004, 202001, 202003, 202004, 203001, 203003, 203004, 204001, 204003, 204004, 205001, 207001]
      starter_worn_ids: [300001, 202001, 201001, 205001, 207001]
    capabilities:
      # cn-706 sub_90C430 rejects category 6 through sub_4B1770 before confirmation.
      inventory_throw_excludes_category6: true
      direct_kill_reports: false # Research build; direct-kill producers remain unaudited.
      character_reference_score_reports: false # Research build; ordinary event producers remain unaudited.
      rescue_missions: false
      pve_points: false # Research build; its native live-point consumer is not reviewed here.
      pve_rank_updates: false
      map_supplies: false # Preserve the research build's disabled supply surface.
      horde_lottery: false
      direct_supply_effects: false
      native_scene_seed_tables: false # Research build; its seed exchange is not proven by this audit.
      # cn-706 sub_4D3D80 builds kinds 1..5 of S2C 720 as kr-812 sub_51AD80 does and sub_4CD8A0 sends
      # the horde-award request (C2S 2020), so the id-400 setting does not apply.
      horde_award_items: true
      round_results: false # Preserve the research build's disabled result surface.
      # Native creation entry is not included in the current legacy creation audit.
      character_creation: false
    play:
      npc_waves: false # Preserve the research build's existing disabled NPC exchange.
      one_seat_waves: false # Its prologue stage consumers are not audited; keeps the mode-15 entry.
      match_start: RepAutoStart # Its room-enter consumer is not audited; keeps the client-driven start.
      wire:
        # cn-706 sub_674110 uses another gated queue path (sub_434C70), not ID2014's copy.
        # Keep the prior echo policy until that research build's queue consumer is audited.
        spawn_group_applies_locally: false
        # The client times its own respawn: cn-706 sub_5BDC90 (GameContext vtable entry) sends gcpRespawn
        # through cn-706 sub_4C99F0 when the death wait ends, as kr-812 sub_43DD80 does.
        server_revives: false
      score:
        # cn-706 sub_788900 reads two u8, unlike its ID2014 layout base.
        # cn-706 sub_6ED650 / sub_6ECE70 report stars in gcpGameUpdateScoreOptimze (stamp helper sub_4E7590).
        star_report: Optimized
        time_over_end: TeamTotals
