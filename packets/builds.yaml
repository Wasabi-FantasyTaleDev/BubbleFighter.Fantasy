  # dispatcher cn-705 sub_4C2CD0 against cn-706 sub_4C32D0, and every smaller switch), with one difference:
  # cn-706's play-only relay case 32925 (Packet_gppRelayedRespawn, cn-706 sub_4D70B0) has no case here.
