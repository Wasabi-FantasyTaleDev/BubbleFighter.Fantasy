# Inbound score envelopes, independent of admission of any event kind.
# kr-812 sub_530960/sub_5309D0 and cn-717 sub_567BE0/sub_567C50 write/read
# the mixed-width report; id-1809 sub_4D5900/sub_4D5970 has the same fields.
# Unnamed auxiliary fields remain unknown because different kinds reuse the envelope.
version: 1
structs:
  RoundScoreReport:
    - kind: u8
      offset: 4
    - unknown_8: u32
      offset: 8
    - unknown_12: u32
      offset: 12
    - unknown_16: u8
      offset: 16
    - reporter_slot: u8
      offset: 17
      # Kind 3 uses this byte for a side code (kr-812 sub_528550), not attribution.
      # The direct-kill adapter resolves the scorer from the character word at offset 12.
      # cn-717 sub_4354F0 fills kind 27, victim/killer scene keys and their seat bytes;
      # cn-717 sub_567BE0 packs the same sixteen-byte envelope.
      # Kind 27, the Captain kill (kr-812 sub_430640 at 0x430687..0x430728): +8 the fallen Captain's
      # Character+404 word, +12 the killer's, +16 the Captain's seat and +17 the killer's seat
      # (both kr-812 sub_53BAF0), +18 a value decoded from the killer's +0x2EE8 block divided by 1000
      # (purpose unknown), +20 zero and +22 the kind again.
    - unknown_18: u8
      offset: 18
    - unknown_20: u16
      offset: 20
    - unknown_22: u16
      offset: 22

  # cn-324 sub_45CB30/sub_45CBA0, sender cn-324 sub_467E00:
  # victim/reporter seats and combo are interpreted only for the admitted score kinds.
  RoundScoreReport@cn-324:
    - kind: u32
      offset: 4
    - unknown_8: u32
      offset: 8
    - unknown_12: u32
      offset: 12
    - victim_slot: u32
      offset: 16
    - reporter_slot: u32
      offset: 20
    - unknown_24: u32
      offset: 24
    - combo: u32
      offset: 28
    - unknown_32: u32
      offset: 32

  # id-400 sub_480790/sub_480800 and cn-406 sub_41EB80/sub_41EBF0
  # prove eight words. id-400 sub_49DF40/sub_4A0390 -> sub_48D2F0 and
  # cn-406 sub_43AEA0/sub_43CF70 -> sub_42ADA0 admit kinds 1/2/3 through
  # exact victim/scorer references at offsets 8/12. Side words stay unknown;
  # the shared logic checks scorer ownership independently of those words.
  # cn-404 sub_4AEA80 / cn-404 sub_4AEAF0 independently prove the same eight words.
  RoundScoreReport@id-400:
    - kind: u32
      offset: 4
    - unknown_8: u32
      offset: 8
    - unknown_12: u32
      offset: 12
    - unknown_16: u32
      offset: 16
    - unknown_20: u32
      offset: 20
    - unknown_24: u32
      offset: 24
    - unknown_28: u32
      offset: 28
    - unknown_32: u32
      offset: 32

  # cn-279 sub_403B10/sub_403B60 carries five words, not the CN2012 eight.
  # cn-279 sub_827A30/sub_8268D0 -> sub_818DE0 independently admit ordinary
  # character kinds 1/2 through offsets 8/12. The NPC knockdown consumer
  # cn-279 sub_773950 calls sub_818DE0 with kind 2, -1 at offset 16 and the
  # computed reporter seat at offset 20; name that fifth word for its proven
  # NPC score path rather than treating it as an unknown player reference.
  RoundScoreReport@cn-279:
    - kind: u32
      offset: 4
    - unknown_8: u32
      offset: 8
    - unknown_12: u32
      offset: 12
    - unknown_16: u32
      offset: 16
    - npc_scorer_slot: u32
      offset: 20

  # cn-706 sub_4B9630/sub_4B96A0 and cn-705 sub_4B9400/sub_4B9470 prove the
  # mixed-width envelope. Their score routers cn-706 sub_4C6920 and cn-705 sub_4C6340
  # send kind 1 here and kind 2 through the six-byte optimized report.
  RoundScoreReport@cn-706:
    - kind: u8
      offset: 4
    - unknown_8: u32
      offset: 8
    - unknown_12: u32
      offset: 12
    - unknown_16: u8
      offset: 16
    - reporter_slot: u8
      offset: 17
    - unknown_18: u8
      offset: 18
    - unknown_20: u16
      offset: 20
    - unknown_22: u16
      offset: 22

  # kr-812 sub_530900/sub_530930, cn-717 sub_567B80/sub_567BB0,
  # id-1809 sub_4D59E0/sub_4D5A10. Mounted only when the build exposes this opcode.
  # cn-706 sub_4B9710/sub_4B9740 and cn-705 sub_4B94E0/sub_4B9510 prove the same three fields.
  RoundOptimizedScoreReport:
    - kind: u8
      offset: 4
    - unknown_8: u32
      offset: 8
    - reporter_slot: u8
      offset: 12
