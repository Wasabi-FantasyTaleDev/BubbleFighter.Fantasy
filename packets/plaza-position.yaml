# Plaza movement codecs; unknown flags retain their native object offsets.
version: 1
structs:
  # Own C2S readers/writers: kr-812 sub_9340A0/sub_934030, cn-717 sub_9D6F70/sub_9D6F00,
  # cn-324 sub_7C9EB0/sub_7C9E40, cn-279 sub_481310/sub_4812A0,
  # id-400 sub_8A29B0/sub_8A2A20, id-1809 sub_8C7280/sub_8C7210,
  # cn-706 sub_8B30E0/sub_8B3150, cn-406 sub_816960/sub_8168F0.
  # kr-1256 sub_913640 / cn-774 sub_B0D330 select 511 with a session (including the plaza), otherwise 301.
  # tw-454 sub_BA8CE0 selects sub_BAB810 (511) or sub_BAB9A0 (301); both write the same 22-byte body.
  PlazaPositionUpload:
    - unknown_4: u32
      offset: 4
    - x: f32
      offset: 8
    - y: f32
      offset: 12
    - z: f32
      offset: 16
    - unknown_20: u8
      offset: 20
    - unknown_21: u8
      offset: 21
    - unknown_24: f32
      offset: 24
  # Own S2C readers/writers: kr-812 sub_92AC50/sub_92ABD0, cn-717 sub_9CD050/sub_9CCFD0,
  # cn-324 sub_7C6E10/sub_6EB790, cn-279 sub_480720/sub_4806A0,
  # id-400 sub_782A50/sub_7829D0, id-1809 sub_7A5ED0/sub_8C25B0,
  # cn-706 sub_8AE4A0/sub_8AE420, cn-406 sub_8126F0/sub_812670.
  # kr-812 sub_806C40/sub_6CBC60 apply XYZ; sub_92F1A0 queues the sequence.
  # kr-1256 sub_9D2FF0 at 0x9D4434..0x9D4495 and sub_9D9930 case 0x202 read the same 26-byte form.
  # Its sequence is the uploaded word, not a server-generated replacement (kr-1256 sub_91FB80).
  # cn-774 sub_B01A60 / tw-454 sub_B9D330 read the same 26-byte body and suppress their own identity.
  PlazaPositionBroadcast:
    - user_number: u32
      offset: 4
    - sequence: u32
      offset: 8
    - x: f32
      offset: 12
    - y: f32
      offset: 16
    - z: f32
      offset: 20
    - unknown_24: u8
      offset: 24
    - unknown_25: u8
      offset: 25
    - unknown_28: f32
      offset: 28
