# Room structures of the legacy client builds: the structures gspGotoRoom, gspRoomSetSlot,
# gspRoomSetSession, gcpReqCreateSession and the room list carry.
#
# HOW TO READ THIS FILE (the full format is described in packets/README.md)
#
#   - name: type          # what the field is
#     offset: 44          # where the client's reader stores it in the object (for reading the client code)
#     default: 8          # written when the server has no value of its own (0 or "" when absent)
#     vacant: 1           # what an empty seat carries instead
#     menu: 8             # what the one-seat room of the main menu carries, where that differs
#
#   Each structure is a list of fields in the order they travel on the wire. A structure is written
#   once, as the baseline build (kr-812) has it. Every other build has the same fields unless a row
#   says otherwise:
#
#     except: [id-400]          the listed builds (and the builds based on them) do not have this field
#     only: [id-1809]           only the listed builds (and the builds based on them) have this field
#     also: [id-1809]           a build has the field again although the build it is based on does not
#     id-400:                   the listed build has these fields here instead of the row's own
#       - unknown_180: u32
#         default: 1000
#
#   A build that differs in many places restates the whole structure as `Name@build`; the builds
#   based on it then follow that table. Which build is based on which is in builds.yaml.
#
#   name      what the server puts in the field. A name the server knows (nickname, room_id, ...) is
#             filled from the room; any other name is written with the default. A field whose purpose
#             is not known is called unknown_<offset> (unknown_n<position> where the reader could not
#             be lined up). Names use lower-case letters, digits and underscores only: no spaces.
#   type      u8 u16 u32 bool(4 bytes) f32 f64 wstr(u32 character count + UTF-16LE)
#             list<T> (u32 count + that many T), empty_list (a list the server always sends empty),
#             or the name of another structure of this folder.
#   menu      a number, another field's name, or `empty` for a list.
#   offset    in a restated table or under a build's name, the offset is that build's own.
#
# Meanings come from the client code; every function address below names its client build.
version: 1
structs:
  # kr-812 sub_80C160 and cn-324 sub_5B5D00 consume one bool32; true arms the native room timer.
  gspRepAutoStart:
    - enabled: bool
      offset: 4
      default: 1

  # SessionSetting: one room (or the main-menu session) as the room list, the room and the create dialog
  # describe it. Nested in gspGotoRoom, gspRoomSetSession and gcpReqCreateSession.
  # Readers: kr-812 sub_4191A0 (writer kr-812 sub_4190A0), id-400 sub_5DB3C0 (writer id-400 sub_5DB2D0),
  # id-1809 sub_4173B0 (writer id-1809 sub_4172B0), cn-717 sub_41AD80, cn-735 sub_4254D0, cn-324 sub_57D9F0,
  # cn-279 0x41E700, cn-706 sub_43A410.
  # Who uses what (cn-717, the build whose consumers were all read): the lobby row builder
  # cn-717 sub_6D3770 shows +4 as the state, +12 as the title, (+40 - +42) as the player count, +44 as the
  # maximum and +46 as the lock; the join builder cn-717 sub_6D1830 sends +8 as the room to join and asks
  # for a password only when +46 is set; the gspGotoRoom handler (kr-812 sub_820060, cn-717 sub_6E9A40)
  # switches on +76.
  SessionSetting:
    # 2 while the receiver is seated in a play room, 0 otherwise; the lobby row shows it as the room state
    - session_state: u32
      offset: 4
      also: [cn-279]
      except: [cn-735]
      cn-324:
        - session_state: u32
          offset: 4
          menu: 1
    - room_id: u16                      # room number; the join request sends it back
      offset: 8
    - unknown_4: u32
      offset: 4
      only: [cn-735]
    - title: wstr                       # room title
      offset: 12
    - occupants: u16                    # seated players
      offset: 40
    # subtracted from occupants for the list's player count (cn-717 sub_6D3770); the server sends 0
    - unknown_42: u16
      offset: 42
      except: [cn-324]
    - open_seats: u16                   # seats that are not closed; the list shows it as the maximum
      offset: 44
      except: [id-400]
    - has_password: bool                # joining asks for a password when set
      offset: 46
    # The lobby row builder copies this string into the row beside the title (cn-717 sub_6D3770 reads
    # +12, +48 and the map name at +96 into the row's three strings). The room list fills it with the
    # room master's nickname; every other use of the structure sends it empty. That it is the master's name rests on the
    # row's column.
    - master_nickname: wstr
      offset: 48
    - kind: u32                         # 1 main menu / plaza, 2 play room, 5 tutorial select
      offset: 76
    - game_setting: GameSetting         # the room's mode, map and options
      offset: 80
    - unknown_608: u32                  # reset value -1 (kr-812 sub_419030); no consumer found
      offset: 608
      default: -1
      menu: 0
      cn-735:
        - unknown_608: u32
          offset: 76
      cn-279:
        - unknown_608: u32              # cn-279 sub_41E5F0 resets +104 to -1; menu preserves that value
          offset: 104
          default: -1
      cn-706:
        - unknown_608: u32
          offset: 584
          default: -1
          menu: 0
    # first half of one 8-byte read (kr-812 sub_A56C30); the constructor leaves both halves -1
    - unknown_616: u32
      offset: 616
      default: -1
      menu: 0
      cn-735:
        - unknown_80: f64
          offset: 80
      cn-706:
        # cn-706 sub_43A410 reads eight raw bytes; sub_43A2A0 resets both words to -1.
        # Preserve the sentinel bits as two words rather than converting them to a floating-point value.
        - unknown_592: u32
          offset: 592
          default: -1
          menu: 0
        - unknown_596: u32
          offset: 596
          default: -1
          menu: 0
    - unknown_620: u32                  # second half of the 8-byte read at +616
      offset: 620
      default: -1
      menu: 0
      except: [cn-735, cn-706]
    - unknown_624: wstr                 # no consumer found; sent empty
      offset: 624
    - unknown_652: u32
      offset: 652
      except: [cn-324]
    - unknown_656: u32
      offset: 656
      except: [cn-324]
    - unknown_660: u32
      offset: 660
      except: [cn-324]
    - unknown_664: u32
      offset: 664
      except: [cn-324]
    - unknown_668: bool                 # no consumer found
      offset: 668
      also: [cn-706]
      except: [id-400, cn-324]

  # GameSetting: the mode, map and options of a room. Nested in SessionSetting at +80; cn-324 and cn-279
  # send a second, standalone copy in gspGotoRoom.
  # Readers: kr-812 sub_4188F0 (writer kr-812 sub_4185C0), id-400 sub_5DAE00 (writer id-400 sub_5DAB70),
  # id-1809 sub_4168C0 (writer id-1809 sub_4165E0), cn-717 sub_41A510, cn-735 sub_424D40 (writer cn-735 sub_424B10),
  # cn-324 sub_57D5E0, cn-279 0x41E380, cn-706 sub_439F50.
  # A play room is sent the block its creator's client wrote, unchanged, so the unknown fields below
  # matter only where the server builds the block itself (main menu, tutorial, an unchosen map).
  GameSetting:
    # Reset defaults: kr-812 sub_4183A0, cn-717 sub_41A130, id-400 sub_5DA9A0,
    # id-1809 sub_4163D0 and cn-706 sub_439A80. Menu overrides preserve the existing login envelope.
    # game mode (room +96). Modes 101/102/103 need current_map (kr-812 sub_6EB170)
    - mode: u32
      offset: 8
      default: 1
    - unknown_12: u32
      offset: 12
    # first map string (room +104): the tutorial request's Directory; the create dialog stores the localized map
    # name here
    - map_directory: wstr
      offset: 16
    # second map string (room +132): the map table's Directory column; gspRoomEnterGame overwrites it at match
    # start
    - current_map: wstr
      offset: 44
    # Historical field spelling retained for byte-compatible role migration: kr-812 sub_40EE80
    # reads Theme here. kr-812 sub_A128A0 supplies the NPC Lua map name from session+132 instead.
    - npc_table_key: wstr
      offset: 72
    # the map key the player chose (room +188); 'Random' when none was chosen; the tutorial's map row name
    - map_name: wstr
      offset: 100
    - unknown_128: u32
      offset: 128
    - unknown_132: u32
      offset: 132
    - unknown_136: u32
      offset: 136
    - unknown_140: u32
      offset: 140
    - unknown_144: u32
      offset: 144
    - unknown_4: bool
      offset: 4
      default: 1
      menu: 0
    - unknown_5: bool
      offset: 5
      default: 1
      menu: 0
    - unknown_148: u32
      offset: 148
    - unknown_152: u32
      offset: 152
    - unknown_156: u32
      offset: 156
    - unknown_160: u32
      offset: 160
    # Lua difficulty: kr-812 sub_A31410, cn-717 sub_AE8A60, id-400 sub_9B0160,
    # id-1809 sub_9CD450 copy GameSetting+164 into their own HordeModeMgr fields.
    - difficulty: u32
      offset: 164
      default: 1
    - unknown_168: u32
      offset: 168
      default: -1
      menu: 0
    - unknown_172: u32
      offset: 172
    - unknown_176: wstr
      offset: 176
      except: [cn-717]
    - unknown_204: empty_list
      offset: 204
      except: [cn-717]
    - unknown_220: empty_list
      offset: 220
      except: [cn-717]
    - unknown_236: empty_list
      offset: 236
      except: [cn-717]
    - unknown_252: u32
      offset: 252
    - unknown_256: wstr
      offset: 256
    - unknown_284: wstr
      offset: 284
    - unknown_312: wstr
      offset: 312
    - unknown_340: wstr
      offset: 340
    - unknown_368: wstr
      offset: 368
    - unknown_396: wstr
      offset: 396
    - unknown_424: u32
      offset: 424
    - unknown_428: empty_list
      offset: 428
      except: [id-400, id-1809]
    - unknown_444: bool
      offset: 444
    - unknown_448: u32
      offset: 448
    - unknown_452: bool
      offset: 452
      except: [id-400]
    - unknown_453: bool
      offset: 453
    - unknown_456: u32
      offset: 456
      except: [id-400]
    - unknown_460: u32
      offset: 460
      except: [id-400]
    - unknown_464: wstr
      offset: 464
      except: [id-400]
    - unknown_492: wstr
      offset: 492
      except: [id-400]
    - unknown_520: bool
      offset: 520
    # cn-404 sub_620470 ends with the same four fields as cn-706 (at +440, +444, +448, +476).
    - unknown_524: u32
      offset: 524
      also: [cn-706, cn-404]
      except: [id-400]
    - unknown_444_cn706: u32
      offset: 444
      only: [cn-706, cn-404]
    - unknown_448_cn706: wstr
      offset: 448
      only: [cn-706, cn-404]
    - unknown_476: wstr
      offset: 476
      only: [cn-706, cn-404]

  # cn-735 (also cn-738 and cn-742, which are based on it): the block starts with three u32 and three
  # bools, then the four map strings, and flattens the nested block cn-735 sub_406590 as bool + empty
  # pair list + bool + empty u32/wstr list (reader cn-735 sub_424D40, writer cn-735 sub_424B10).
  # No field of this build's block has been given a meaning yet, so every name is its wire position.
  GameSetting@cn-735:
    - unknown_n0: u32
    - unknown_n1: u32
    - unknown_n2: u32
    - unknown_n3: bool
    - unknown_n4: bool
    - unknown_n5: bool
    - unknown_n6: u32
    - unknown_n7: u32
    - unknown_n8: u32
    - unknown_n9: u32
    - unknown_n10: u32
    - unknown_n11: wstr
    - unknown_n12: wstr
    - unknown_n13: wstr
    - unknown_n14: wstr
    - unknown_n15: u32
    - unknown_n16: wstr
    - unknown_n17: wstr
    - unknown_n18: wstr
    - unknown_n19: wstr
    - unknown_n20: wstr
    - unknown_n21: wstr
    - unknown_n22: u32
    - unknown_n23: u32
    - unknown_n24: bool
    - unknown_n25: empty_list
    - unknown_n26: bool
    - unknown_n27: empty_list
    - unknown_n28: bool
    - unknown_n29: bool
    - unknown_n30: bool
    - unknown_n31: bool
    - unknown_n32: bool
    - unknown_n33: bool
    - unknown_n34: bool
    - unknown_n35: u8
    - unknown_n36: bool
    - unknown_n37: empty_list
    - unknown_n38: u32
    - unknown_n39: u32
    - unknown_n40: u32
    - unknown_n41: wstr
    - unknown_n42: wstr
    - unknown_n43: u32

  # cn-324 and cn-279 (reader cn-324 sub_57D5E0, cn-279 0x41E380): the same leading fields as kr-812 in
  # the same order (mode, then the four map strings), and nothing after the run of u32.
  GameSetting@cn-324:
    - mode: u32                         # game mode
      offset: 8
      cn-279:
        # cn-279 sub_7A6290 writes its selected-mode argument at packet+48:
        # cn-279 sub_41EA10 nests SessionSetting at +8, whose GameSetting starts at +32.
        - mode: u32
          offset: 8
          default: 1
          menu: 1
    - unknown_12: u32
      offset: 12
    # The four map strings are the ones the map dialog writes for the entry it was given (cn-324 sub_59E1C0): the
    # display name, the map's directory (or the key itself for the all-random entry), the theme tab and the key.
    # The create request fills only the first two, from the startup configuration (cn-324 sub_582C00), and the room
    # screen draws no map while the key is empty (cn-324 sub_59F940), so the server shows an unchosen map as the
    # all-random entry (builds.yaml unchosen_map_key).
    - map_directory: wstr               # first map string: the map's display name
      offset: 16
    - current_map: wstr                 # second map string: the map's directory, which names the thumbnail
      offset: 20
    # third map string: the theme tab the key sits under, an entry of ServerShared/Theme.ini (cn-324 sub_59DE30
    # looks it up in the list cn-324 sub_59B4F0 reads from that file); the map dialog writes the first theme, 'All',
    # for the all-random entry
    - map_theme: wstr
      offset: 24
    - map_name: wstr                    # the map key the player chose; 'Random' for the all-random entry
      offset: 28
      # cn-279 sub_7091E0 requires room+68 (GameSetting+28) != "Random" through
      # cn-279 sub_401730, then cn-279 sub_706750 tests isTutorial on that map key.
    # Defaults below are what the client's own create request carries, so a room the server opens itself (quick
    # match) matches a hand-made one. cn-324 sub_582C00 copies LambientStartupConfig+44 (Lambient.xml KillLimit,
    # read by cn-324 sub_729CF0) into +32 and +40 (TimeLimit) into +36..+48; the reset
    # cn-324 sub_57D470 sets the bools to 1, +68 to 1 and +72 to -1. The CN2012 Lambient.xml ships KillLimit 20
    # and TimeLimit 240000. cn-324 sub_43A3F0 copies the signal argument's +68 into manager+5400,
    # read by Lua GetDifficulty (cn-324 sub_410E50); the callback is present in the executable
    # but omitted from the consolidated export. cn-324 sub_416520 registers it for signal 299.
    # cn-279 keeps its previous zeros until its own create path is read.
    - unknown_32: u32
      offset: 32
      default: 20
      cn-279:
        - unknown_32: u32
          offset: 32
    - unknown_36: u32
      offset: 36
      default: 240000
      cn-279:
        - unknown_36: u32
          offset: 36
    - unknown_40: u32
      offset: 40
      default: 240000
      cn-279:
        - unknown_40: u32
          offset: 40
    - unknown_44: u32
      offset: 44
      default: 240000
      cn-279:
        - unknown_44: u32
          offset: 44
    - unknown_48: u32
      offset: 48
      default: 240000
      cn-279:
        - unknown_48: u32
          offset: 48
    - unknown_4: bool
      offset: 4
      default: 1
    - unknown_5: bool
      offset: 5
      default: 1
    - unknown_52: u32
      offset: 52
      except: [cn-279]
    - unknown_56: u32
      offset: 56
    - unknown_60: u32
      offset: 60
    - unknown_64: u32
      offset: 64
    - unknown_68: u32
      offset: 68
      default: 1
      cn-279:
        - unknown_68: u32
          offset: 68
    - unknown_72: u32
      offset: 72
      default: -1
      cn-279:
        - unknown_72: u32
          offset: 68
          default: 1

  # UserSlot: one seat of a room. Sent as a list in gspGotoRoom and one at a time in gspRoomSetSlot,
  # gspRoomLeaveSlot and gspRepNotifyChangeLevelIcon.
  # kr-812: reader kr-812 sub_4196F0, a 288-byte object built by kr-812 sub_419290 / kr-812 sub_419360. The values the server
  # does not source are those of a room with one seated player, three open and eight closed seats.
  # cn-717: reader cn-717 sub_41B2C0, reset cn-717 sub_41AF40, constructor cn-717 sub_41AE70; no ArenaRating float.
  # cn-735: reader cn-735 sub_425A50.
  UserSlot:
    # a player sits here; the client builds an avatar only for a seat with it set (kr-812 sub_6CBC60)
    - occupied: bool
      offset: 4
      menu: 1
    - closed: bool                      # the room master closed this empty seat (the S2C 512 handler flips it)
      offset: 5
      menu: 1
    # set together with occupied for a seated player; cleared in the record gspRoomLeaveSlot carries
    - seated: bool
      offset: 6
      menu: 1
    # start position: the position table is indexed with (12 - value); 0xFF until the round is set up
    - spawn_index: u8
      offset: 129
      menu: 255
      also: [cn-735]
      cn-717:
        - spawn_index: u8               # 0 on the main menu
          offset: 129
    # the player's number; the client finds its own seat by it (kr-812 sub_7FCDA0)
    - user_number: u32
      offset: 8
    - nickname: wstr                    # the player's nickname
      offset: 12
    # FighterConfig key = character item id - 300000 (kr-812 sub_6CBFF0 hands it to the actor builder
    # kr-812 sub_92B160)
    - character_type: u16
      offset: 40
      cn-717:
        - character_type: u16
          offset: 40
          menu: 10
    - color_index: u16 # kr-812 sub_6C6DE0 and kr-812 sub_9BFC10 use the actor color-index setter; cn-717 sub_729940 matches.
      offset: 42
    # the player's team (the S2C 504 handler writes it, kr-812 sub_7FCF50); 0 on the main menu
    - team: u8
      offset: 124
      cn-717:
        - team: u8
          offset: 124
          menu: character_type
    # a per-player number with no proven reader; the level is sent here (inferred)
    - level: u32
      offset: 44
      vacant: 1
      menu: 8
    - ready: bool                       # ready mark; changing team is refused while it is set
      offset: 125
    - unknown_126: bool
      offset: 126
      menu: 1
    - unknown_127: bool
      offset: 127
      menu: 1
    - unknown_128: bool
      offset: 128
      menu: 1
    - unknown_60: u32
      offset: 60
    - unknown_64: u32
      offset: 64
    - equipped_items: "list<u32>"       # item ids the player wears
      offset: 68
    - unknown_84: u32
      offset: 84
    - unknown_88: u32
      offset: 88
    - unknown_108: u32                  # constructor value -1
      offset: 108
      default: -1
    - unknown_114: bool
      offset: 114
    - unknown_136: u32
      offset: 136
    # 1 for a seated player in a play room, 0 on an empty seat and on the main menu
    - unknown_140: bool
      offset: 140
      default: 1
      vacant: 0
      menu: 0
    - unknown_144: u32                  # constructor value -1
      offset: 144
      default: -1
    - unknown_48: u16                   # five u16 read in a loop from +48; constructor value 0xFFFF
      offset: 48
      default: 65535
    - unknown_50: u16
      offset: 50
      default: 65535
    - unknown_52: u16
      offset: 52
      default: 65535
    - unknown_54: u16
      offset: 54
      default: 65535
    - unknown_56: u16
      offset: 56
      default: 65535
    - unknown_156: u32
      offset: 156
    - unknown_160: u32
      offset: 160
    - unknown_148: bool
      offset: 148
    - unknown_176: u32                  # constructor value -1
      offset: 176
      default: -1
    - unknown_180: wstr                 # a wstr no consumer was found for (id-400 has a u32 here)
      offset: 180
    - unknown_208: bool
      offset: 208
    - unknown_209: bool
      offset: 209
    - unknown_212: u32
      offset: 212
    # 1 or 2 per seated player: a per-player counter, meaning not proven
    - unknown_216: u32
      offset: 216
      default: 1
    - unknown_224: u32                  # the one u32 of the nested object at +220
      offset: 224
    # ArenaRating: the float of the nested object at +228 (kr-812 sub_401830); 500 for a seated player. cn-717 has
    # no such object
    - unknown_232: f32
      offset: 232
      default: 500
      vacant: 0
      except: [cn-717]
    # SocialSystemInfo: eight u32 of the nested object at +236 (kr-812 sub_41A4D0, cn-717 sub_41BEF0)
    - unknown_240: u32
      offset: 240
    - unknown_244: u32
      offset: 244
    - unknown_248: u32
      offset: 248
    - unknown_252: u32
      offset: 252
    - unknown_256: u32
      offset: 256
    - unknown_260: u32
      offset: 260
    - unknown_264: u32
      offset: 264
    - unknown_268: u32
      offset: 268
      cn-735:
        - unknown_n46: bool
    - unknown_132: u32
      offset: 132
    - unknown_152: u32
      offset: 152
    - unknown_276: u32
      offset: 276
    - unknown_280: u32                  # constructor value -1 (recorded with the level icon update)
      offset: 280
      default: -1
      cn-735:
        - unknown_280: u32
          default: -1
          menu: 0
    # The level icon the player chose: the S2C 970 gspRepNotifyChangeLevelIcon handler kr-812 sub_834FE0
    # copies this record over the member through kr-812 sub_691CD0 and takes the local player's icon from
    # +272; the change request sender kr-812 sub_6D0280 stamps that local word (dword_E82674+212) as its
    # third field. kr-812 sub_691CD0 copies the word at +272, so it is on every UserSlot record.
    - level_icon: u32
      offset: 272

  # id-400: reader id-400 sub_5F1FF0, a 192-byte object reset by id-400 sub_5F1D20. Against kr-812 it has one flag
  # fewer after the level, a u32 where kr-812 has the wstr at +180, and none of kr-812's tail
  # (no ArenaRating, no SocialSystemInfo). The actor builder id-400 sub_6918C0 takes the character type
  # from the u16 at +40 and the team from the u8 at +124.
  UserSlot@id-400:
    # a player sits here; the client builds an avatar only for a seat with it set (kr-812 sub_6CBC60)
    - occupied: bool
      offset: 4
      menu: 1
    - closed: bool                      # the room master closed this empty seat (the S2C 512 handler flips it)
      offset: 5
      menu: 1
    # set together with occupied for a seated player; cleared in the record gspRoomLeaveSlot carries
    - seated: bool
      offset: 6
      menu: 1
    # Start position byte consumed by the Indonesian room-stage path. The ID2014 packet reader
    # stores it at +128; the ID2015 movement return path (sub_8CCD40 -> sub_7A7B30) indexes
    # the native position table with 12 minus this byte. Waiting-room records retain 0xFF.
    - spawn_index: u8
      offset: 128
      default: 255
    # the player's number; the client finds its own seat by it (kr-812 sub_7FCDA0)
    - user_number: u32
      offset: 8
    - nickname: wstr                    # the player's nickname
      offset: 12
    # FighterConfig key = character item id - 300000 (kr-812 sub_6CBFF0 hands it to the actor builder
    # kr-812 sub_92B160)
    - character_type: u16
      offset: 40
    - color_index: u16 # id-400 sub_64A1B0 passes seat +42 to the actor color-index setter.
