version: 1
structs:
  # Couple layouts do not register handlers or establish ring ownership, consumption or persistence.
  # Legacy bool fields use four wire bytes even when their object members occupy one byte.
  # kr-812 sub_A56BD0/sub_A56C10/sub_A56D70 establish bool32/u32/counted UTF-16LE.
  # Modern strings use the same wire encoding: kr-1256 sub_1126430 via kr-1256 sub_1119C10, cn-774 sub_1093FE0,
  # tw-454 sub_E91B70. Modern records have no packet-class vtable prefix and 24-byte strings.
  # cn-279 has no matched couple packet class or opcode. Unreviewed descendants are excluded.

  # C2S expiry: kr-812 sub_80C160, cn-324 sub_798810, id-400 sub_63B780,
  # cn-404 sub_8A2A80, cn-406 sub_7151D0, cn-408 sub_9B68E0, cn-706 sub_87EC00,
  # cn-717 sub_8C3780 and id-1809 sub_7BEBE0 all read one bool32, without a string.
  # kr-1256 sub_E849D0, cn-774 sub_4D66B0 and tw-454 sub_C76860 each write a single bool32.
  CoupleInviteExpire:
    - unknown_4: bool
      offset: 4
      except: [cn-279, cn-735]
      kr-1256:
        - unknown_0: bool
          offset: 0

  # C2S answer: kr-812 sub_9FDE70, id-400 sub_977C60, cn-404 sub_9AEB80,
  # cn-406 sub_8E2EF0, cn-408 sub_9B6930, cn-706 sub_97D9B0, cn-717 sub_AB0BD0,
  # id-1809 sub_995530; cn-324 sub_402480 stores the second string at +12.
  # kr-1256 sub_E881A0 writes opcode 932 from the invitation dialog kr-1256 sub_E83FE0.
  # cn-774 sub_4DD000 and tw-454 sub_C7C550 write the same two bool32/name sequence; the second flag is acceptance.
  CoupleInviteAnswerRequest:
    - unknown_4: bool
      offset: 4
      except: [cn-279, cn-735]
      kr-1256:
        - unknown_0: bool
          offset: 0
    - accepted: bool
      offset: 5
      except: [cn-279, cn-735]
      kr-1256:
        - accepted: bool
          offset: 1
    - inviter: wstr
      offset: 8
      except: [cn-279, cn-735]
      kr-1256:
        - inviter: wstr
          offset: 4
    - recipient: wstr
      offset: 36
      except: [cn-279, cn-735]
      cn-324:
        - recipient: wstr
          offset: 12
      kr-1256:
        - recipient: wstr
          offset: 28

  # C2S breakup: kr-812 sub_5C8FD0, cn-324 sub_6FDDF0, id-400 sub_89DD10,
  # cn-404 sub_68E480, cn-406 sub_75A200, cn-408 sub_7B1F10, cn-706 sub_567230,
  # cn-717 sub_740F00 and id-1809 sub_68D480 read one counted name.
  # kr-1256 sub_E86B50, cn-774 sub_4DB6C0 and tw-454 sub_C7B5A0 each send one counted name after Yes (257).
  CoupleBreakUpRequest:
    - partner: wstr
      offset: 4
      except: [cn-279, cn-735]
      kr-1256:
        - partner: wstr
          offset: 0

  # C2S ring change: kr-812 sub_80A910, cn-706 sub_4BBB70 and id-1809 sub_4D60C0
  # read one word. cn-717 sub_8C4260 additionally reads a bool32 into +8.
  # cn-324 and id-400/cn-404/cn-406/cn-408 have no matched ring-change packet class.
  # The modern DlgCoupleItemChoice2 handlers kr-1256 sub_EA0430, cn-774 sub_6B2940 and tw-454 sub_6D0EE0
  # send the selected owned item then a zero word. The similarly shaped Bingo request is unrelated.
  CoupleChangeRingRequest:
    - ring_item: u32
      offset: 4
      except: [cn-324, id-400, cn-735]
      also: [cn-706]
      kr-1256:
        - ring_item: u32
          offset: 0
    - unknown_4: u32
      offset: 4
      only: [kr-1256]
    - unknown_8: bool
      offset: 8
      only: [cn-717]
      except: [cn-735]

  # C2S confirmation: kr-812 sub_9FDF00 reads the complete equipment record at +68;
  # kr-812 sub_9FA680/sub_9FA190 install EquippedItemList there before kr-812 sub_9FDC70 sends it.
  # id-400 sub_977BE0, cn-404 sub_9AEB00, cn-406 sub_8E2E70, cn-408 sub_9B68A0,
  # cn-706 sub_97D910 and cn-717 sub_AB0C50 stop after the fourth field.
  # cn-705 sub_97C3A0 likewise stops after the fourth field; cn-324 sub_402370 uses compact strings.
  # id-1809 sub_996730/sub_996BF0 install EquippedItemList at +68 and copy the native seat before
  # id-1809 sub_99A1B0 writes the complete request. Its equipment suffix must not be discarded.
  # kr-1256 sub_E880A0 (C2S 930) writes the first four fields from its 24-byte-string record and no equipment
  # record; its callers kr-1256 sub_E821B0 and kr-1256 sub_E81990 send it after a yes/no box, the flag being
  # cleared when the answer is not Yes (257). cn-774 sub_4DCEF0 and tw-454 sub_C7C3D0 instead append their own
  # EquippedItemList record at +56 (constructors cn-774 sub_496D10 / tw-454 sub_4A0360).
  CoupleConfirmInviteRequest:
    - confirmed: bool
      offset: 4
      except: [cn-279, cn-735]
      kr-1256:
        - confirmed: bool
          offset: 0
    - target: wstr
      offset: 8
      except: [cn-279, cn-735]
      kr-1256:
        - target: wstr
          offset: 4
    - ring_item: u32
      offset: 36
      except: [cn-279, cn-735]
      cn-324:
        - ring_item: u32
          offset: 12
      kr-1256:
        - ring_item: u32
          offset: 28
    - message: wstr
      offset: 40
      except: [cn-279, cn-735]
      cn-324:
        - message: wstr
          offset: 16
      kr-1256:
        - message: wstr
          offset: 32
    - equipped_items: EquippedItemList
      offset: 68
      except: [cn-324, id-400, cn-717, kr-1256]
    - equipped_items: EquippedObjectEntry
      offset: 56
      only: [cn-774]

  # S2C invitation: kr-812 sub_83C260 reads all six fields; kr-812 sub_83C2C0
  # identifies EquippedItemList at +92 and FighterInfo at +176 through kr-812 sub_40B3F0.
  # Own constructors also install EquippedItemList +92 and FighterInfo +176:
  # cn-717 sub_8C4E70 (read sub_8C4E10), cn-706 sub_7A0A00 (read sub_7A09A0),
  # cn-406 sub_714B10 (read sub_714AB0), cn-404 sub_7C5EC0 (read sub_7C5E60),
  # cn-705 sub_79F4C0 (read sub_79F460), id-1809 sub_7BE130 (read sub_7BE0D0).
  # id-400 sub_798660 and cn-408 sub_7C94E0 retain those complete nested records.
  # Each nested FighterInfo keeps its own build's counters, vectors and final fields in user-stat.yaml.
  CoupleInvite:
    - shown: bool
      offset: 4
      except: [cn-324, kr-1256]
    - inviter: wstr
      offset: 8
      except: [cn-324, kr-1256]
    - recipient: wstr
      offset: 36
      except: [cn-324, kr-1256]
    - message: wstr
      offset: 64
      except: [cn-324, kr-1256]
    - equipped_items: EquippedItemList
      offset: 92
      except: [cn-324, kr-1256]
    - fighter_info: FighterInfo
      offset: 176
      except: [cn-324, kr-1256]

  # cn-324 sub_6FD330 reads bool32, three counted names, then virtual records at +20 and +64.
  # cn-324 sub_6FD390 constructs EquippedItemList at +20 and FighterInfo through sub_6FB9A0 at +64;
  # their own readers sub_45B640/sub_6FBD60 include the byte-vector and all 36 final counter words.
  # tw-410 sub_6FCFB0/sub_6FD010 independently construct the same records; its own sub_45AFC0/sub_6FB910
  # retain the equipment byte-vector and all 36 final fighter words after the compact names.
  CoupleInvite@cn-324:
    - shown: bool
      offset: 4
      except: [cn-279]
    - inviter: wstr
      offset: 8
      except: [cn-279]
    - recipient: wstr
      offset: 12
      except: [cn-279]
    - message: wstr
      offset: 16
      except: [cn-279]
    - equipped_items: EquippedItemList
      offset: 20
      except: [cn-279]
    - fighter_info: FighterInfo
      offset: 64
      except: [cn-279]

  # kr-1256 S2C 936 reader kr-1256 sub_10E17C0 (handler kr-1256 sub_9BEEF0, which opens the proposal box
  # kr-1256 sub_E83FE0 when both name strings are set): bool32, three counted names, the equipment block of
  # RoomProfileEntry without its user number, then the nested record at +144, read by its own deserializer as
  # kr-812 reads FighterInfo at +176.
  CoupleInvite@kr-1256:
    - shown: bool
      offset: 0
    - inviter: wstr
      offset: 4
    - recipient: wstr
      offset: 28
    - message: wstr
      offset: 52
    - equipped_items: CoupleInviteEquipment
      offset: 76
    - fighter_info: FighterInfo
      offset: 144
  # cn-774 sub_BBCE80 reads its EquippedItemList at +76 and FighterInfo at +160 (constructors sub_496D10/sub_466960).
  # tw-454 sub_A99E80 reads the smaller native equipment record at +76 and FighterInfo at +144 (sub_4A0360/sub_45E770).
  CoupleInvite@cn-774:
    - shown: bool
      offset: 0
    - inviter: wstr
      offset: 4
    - recipient: wstr
      offset: 28
    - message: wstr
      offset: 52
    - equipped_items: EquippedObjectEntry
      offset: 76
    - fighter_info: FighterInfo
      offset: 160
      tw-454:
        - fighter_info: FighterInfo
          offset: 144

  # The kr-1256 invitation's equipment block (kr-1256 sub_10E17C0 +76..+143): the character item, the worn item
  # vector and two more word vectors (kr-1256 sub_998FB0), a byte vector (kr-1256 sub_10BE7B0) and the ItemAttr
  # vector (kr-1256 sub_10D9050), in RoomProfileEntry's order.
  CoupleInviteEquipment:
    - character_id: u32
      offset: 0
      only: [kr-1256]
    - equipped_items: "list<u32>"
      offset: 4
      only: [kr-1256]
    - unknown_16: "list<u32>"
      offset: 16
      only: [kr-1256]
    - unknown_28: "list<u32>"
      offset: 28
      only: [kr-1256]
    - unknown_40: "list<u8>"
      offset: 40
      only: [kr-1256]
    - unknown_52: "list<ItemAttr>"
      offset: 52
      only: [kr-1256]
      except: [cn-774]

  # S2C invitation result: kr-812 sub_844570, cn-324 sub_6FD230, id-400 sub_798DF0,
  # cn-404 sub_43E890, cn-406 sub_713EA0, cn-408 sub_7CACD0, cn-706 sub_7A1330,
  # cn-717 sub_8CEE00 and id-1809 sub_7BE230 read word then name.
  # Modern consumers: kr-1256 sub_9BFAA0, cn-774 sub_BBD850, tw-454 sub_A9A7D0.
  CoupleInviteResult:
    - result: u32
      offset: 4
      except: [cn-279, cn-735]
      kr-1256:
        - result: u32
          offset: 0
    - name: wstr
      offset: 8
      except: [cn-279, cn-735]
      kr-1256:
        - name: wstr
          offset: 4

  # S2C answer: kr-812 sub_83C1D0, cn-324 sub_6FD5F0, id-400 sub_798760,
  # cn-404 sub_7C5F90, cn-406 sub_714C10, cn-408 sub_7C95B0, cn-706 sub_7A0AD0,
  # cn-717 sub_8C4CF0 and id-1809 sub_7BE290 read bool32 then two names.
  # Modern: kr-1256 sub_99CBB0 via kr-1256 sub_9C1210, cn-774 sub_BBED80, tw-454 sub_A9BCF0.
  CoupleInviteAnswerReply:
    - accepted: bool
      offset: 4
      except: [cn-279, cn-735]
      kr-1256:
        - accepted: bool
          offset: 0
    - inviter: wstr
      offset: 8
      except: [cn-279, cn-735]
      kr-1256:
        - inviter: wstr
          offset: 4
    - recipient: wstr
      offset: 36
      except: [cn-279, cn-735]
      cn-324:
        - recipient: wstr
          offset: 12
      kr-1256:
        - recipient: wstr
          offset: 28

  # S2C breakup shares the preceding legacy answer readers except cn-717 sub_88F4D0,
  # which reads two names then a status word. kr-1256 sub_9C15C0 reads a word and ONE name.
  # cn-774 sub_BBF1A0 and tw-454 sub_A9C220 instead read two names then a word; status 1
  # selects the wait message in all three modern consumers. CN/TW compare the actor name to the local nickname
  # on status 0 and use the second name as the former partner; other non-refusal statuses clear couple state.
  # kr-812 sub_830340 treats true as success and false as the one-day refusal; its two names are read then unused.
  CoupleBreakUpReply:
    - status: bool
      offset: 4
      except: [cn-279, cn-735]
      cn-717:
        - unknown_4: wstr
          offset: 4
        - unknown_32: wstr
          offset: 32
        - status: u32
          offset: 60
      kr-1256:
        - status: u32
          offset: 0
        - name: wstr
          offset: 4
      cn-774:
        - actor: wstr
          offset: 0
        - partner: wstr
          offset: 24
        - status: u32
          offset: 48
    - unknown_8: wstr
      offset: 8
      except: [cn-279, cn-717, kr-1256]
    - unknown_36: wstr
      offset: 36
      except: [cn-279, cn-717, kr-1256]
      cn-324:
        - unknown_12: wstr
          offset: 12

  # S2C partner notification: kr-812 sub_83C170, cn-324 sub_6FD6E0, id-400 sub_7987C0,
  # cn-404 sub_7C6020, cn-406 sub_714C70, cn-408 sub_7C9640, cn-706 sub_7A0B60,
  # cn-717 sub_8C4C90 and id-1809 sub_7BE2F0 read bool32, word, name.
  # Modern consumers: kr-1256 sub_9C1BD0, cn-774 sub_BBF620, tw-454 sub_A9C7D0.
  CoupleNotifyPartner:
    - partner_online: bool
      offset: 4
      except: [cn-279, cn-735]
      kr-1256:
        - partner_online: bool
          offset: 0
    - partner_user_number: u32
      offset: 8
      except: [cn-279, cn-735]
      kr-1256:
        - partner_user_number: u32
          offset: 4
    - partner_name: wstr
      offset: 12
      except: [cn-279, cn-735]
      kr-1256:
        - partner_name: wstr
          offset: 8

  # S2C ring change: kr-812 sub_6DB1B0, cn-706 sub_733050 and id-1809 sub_4D7F70
  # read two words. cn-717 sub_538CF0 also reads bool32 at +12.
  # Modern consumers kr-1256 sub_9BF1D0, cn-774 sub_BBD210 and tw-454 sub_A9A190
  # all read two words AND a bool32. The third field must not be omitted.
  CoupleChangeRingReply:
    - ring_result: u32
      offset: 4
      except: [cn-324, id-400, cn-735]
      also: [cn-706]
      kr-1256:
        - ring_result: u32
          offset: 0
    - ring_item: u32
      offset: 8
      except: [cn-324, id-400, cn-735]
      also: [cn-706]
      kr-1256:
        - ring_item: u32
          offset: 4
    - unknown_12: bool
      offset: 12
      only: [cn-717]
      except: [cn-735]
      kr-1256:
        - unknown_8: bool
          offset: 8

  # The cn-324 initial invitation request and inviter-status response are separate from confirmation.
  # cn-324 sub_6FD8F0 reads bool32/name; cn-324 sub_410910 reads one word.
  # cn-324 Packet_gcpReqCoupleInviterStatus vtable 0xAC44EC uses nullsub_3 (sub_5C7C90)
  # for both body writer and reader; sub_404E30 sends this empty request before target selection.
  # tw-410 sub_404E90 likewise sends an empty body (own writer/reader sub_6B0840); sub_5A59D0 reads the
  # initial bool32/name and sub_6EB2B0 reads the status word before sub_402DF0 opens confirmation.
  CoupleInviterStatusRequest: []
  CoupleInitialInviteRequest:
    - selected: bool
      offset: 4
      only: [cn-324]
      except: [cn-279]
    - target: wstr
      offset: 8
      only: [cn-324]
      except: [cn-279]
  CoupleInviterStatusReply:
    - status: u32
      offset: 4
      only: [cn-324]
      except: [cn-279]

  # kr-1256 sub_9C33C0 delegates its complete body to kr-1256 sub_10E1CF0,
  # the same tagged record consumed by FighterInfo. Tag 0x3A carries u64/u32/u32/bool32;
  # other tags contain no suffix. cn-774/tw-454 opcode 946 is a different list packet.
  CoupleMyInfo:
    - unknown_0: 'optional<0x3A,FighterInfoTail48>'
      offset: 0
      only: [kr-1256]
      except: [cn-774]

  # Modern list envelopes: kr-1256 sub_99CDD0 via kr-1256 sub_9C3410 (S2C 947),
  # cn-774 sub_BC09B0 and tw-454 sub_A9DAE0 (S2C 946). Each has a counted record list,
  # a counted word list and one REQUIRED final record. Two zero list counts are not a complete body.
  # Record vectors: kr-1256 sub_10E1EC0, cn-774 sub_1055070, tw-454 sub_ECC830.
  # Word vectors: kr-1256 sub_999C00, cn-774 sub_456D30, tw-454 sub_45AA50.
  CoupleList:
    - unknown_0: 'list<CoupleListRecord>'
      offset: 0
      only: [kr-1256]
    - unknown_12: 'list<u32>'
      offset: 12
      only: [kr-1256]
    - unknown_24: CoupleListRecord
      offset: 24
      only: [kr-1256]

  # The same record appears in the list and mandatory suffix: kr-1256 sub_1145A00,
  # cn-774 sub_1054C90 and tw-454 sub_ECC6A0. Fields +12/+13 are bool32 on the wire.
  CoupleListRecord:
    - unknown_0: u32
      offset: 0
      only: [kr-1256]
    - unknown_4: u32
      offset: 4
      only: [kr-1256]
    - unknown_8: u32
      offset: 8
      only: [kr-1256]
    - unknown_12: bool
      offset: 12
      only: [kr-1256]
    - unknown_13: bool
      offset: 13
      only: [kr-1256]
    - unknown_16: u32
      offset: 16
      only: [kr-1256]
    - unknown_24: u64
      offset: 24
      only: [kr-1256]
    - unknown_32: 'list<CoupleListParticipant>'
      offset: 32
      only: [kr-1256]

  # kr-1256 sub_1145DE0/sub_11460C0, cn-774 sub_455E40 and tw-454 sub_455B90:
  # word, name and bool32. The local word at +32 is initialized to -1 but never read from the wire.
  CoupleListParticipant:
    - unknown_0: u32
      offset: 0
      only: [kr-1256]
    - unknown_4: wstr
      offset: 4
      only: [kr-1256]
    - unknown_28: bool
      offset: 28
      only: [kr-1256]
