version: 1
# Bomb Mission (round mode 19) and Captain mode (round mode 20): the bodies the server sends or reads.
#
# The baseline is kr-812 and a plain row is the kr-812 object's shape. Every field is four bytes and the
# reader/writer order below is the wire order. The cn-717 readers were also read: same Packet_ class names,
# its own addresses, and the same widths (gspBombState five words plus a boolean, gcpBombState five,
# gcpBombMissionOver three, gspCaptainEvent one boolean, the other three one word), so a plain row is also
# cn-717's reader shape. Its cn-717 sub_540B30 dispatches 973/974, cn-717 sub_560640/sub_560CB0
# stamp 2012/2011, and cn-717 sub_881080/sub_435330 consume a Captain seat. id-400's rows are
# audited through id-400 sub_48A090/sub_784DE0. Additional native routes are recorded below.
#
# Wire sizes: gspBombState 24, gcpBombState 20, gcpBombMissionOver 12, gspObserver 4, gspCreateCaptain 4,
# gcpDropCaptain 4, gspCaptainEvent 4 bytes. Modern mission reports are 9 bytes; KR1256/CN774
# broadcasts are 20 bytes, while TW454 retains the 24-byte broadcast. Opcode numbers live in profiles/*/opcodes.yaml (kr-812 below).
#
# Direction is read, not guessed: 973, 974, 982 and 994 have dispatch cases and no send-side stamp in
# kr-812; 2011, 2012 and 2018 have exactly one sender each and no dispatch case.
# Native Bomb/Captain dispatcher pairs: cn-404 sub_4B8510/sub_7AFA70,
# cn-408 sub_4B7E50/sub_7B2F40, cn-706 sub_4C32D0/sub_7890E0, id-1809 sub_4DF530/sub_7A6A40.
# Modern Bomb dispatch/observer and Captain appointment consumers:
# kr-1256 sub_6D55D0/sub_703C80/sub_46FA00; cn-774 sub_897E80/sub_8C4140/sub_4EB540;
# tw-454 sub_70B3F0/sub_737F30/sub_56E1E0. Captain appointments and deaths remain one seat word.
structs:

  # S2C gspBombState (kr-812 973): six four-byte words = 24 bytes. The bomb's state and the triple the
  # handler stores in the mode manager.
  # Reader (deserialize) kr-812 sub_52FB40, vtable Packet_gspBombState 0xD1ED04 slot 0xD1ED08; writer
  # kr-812 sub_52FAE0. Dispatcher kr-812 sub_50B8C0 `else if ( v4 == 973 )`,
  # handler kr-812 sub_4245B0. cn-717 reader cn-717 sub_5385C0 (same five reads plus one boolean), id-400 reader
  # id-400 sub_481340.
  # The handler receives the words as (operator, state, pointer to the three floats, boolean); the switch
  # runs on the state word with cases 0..6 (all read in kr-812 sub_4245B0):
  # 0 reset (installer/defuser records cleared to -1, position zeroed), 1 planting (operator stored as
  # installer at manager +5388, position stored), 2 detonation countdown armed (timer_aligned picks the
  # source, see below), 3 exploded (outcome word copied from manager +5424 to +5396, 2000 ms tail),
  # 4 being defused (operator stored as defuser at manager +5392), 5 defuse interrupted (state returns
  # to 2 without restarting the unaligned countdown), 6 defuse complete (outcome word from manager +5428 to +5396,
  # installer cleared, 2000 ms tail). The gcpBombState senders set the same words (kr-812 sub_422850's
  # tick for timer-driven transitions, plant entry kr-812 sub_423AE0 and defuse entry kr-812 sub_423C20).
  gspBombState:
    - operator: u32 # user_number, stored at manager +5388 when planting and +5392 when defusing;
      # kr-812 sub_509160 passes UserSlot+8 through kr-812 sub_43CB10, kr-812 sub_5CCA10 and kr-812
      # sub_54A7E0 to kr-812 sub_584320, which stores it in managed Character+756 (value pointer +764)
      offset: 4
    - state: u32 # the handler's switch key, cases 0..6 tabled in this file's heading comment
      offset: 8
    - position_x: f32 # stored by the handler at mode manager +5400; the plant/defuse/explosion effects
      # place the bomb there (kr-812 sub_4245B0 passes the block to kr-812 sub_ACC7C0)
      offset: 12
    - position_y: f32 # second float, mode manager +5404
      offset: 16
    - position_z: f32 # third float, mode manager +5408
      offset: 20
    - timer_aligned: bool # a four-byte boolean (reader converts a nonzero word); in states 2/3/4/5 it
      # selects the countdown source: set, the receiver aligns its timer from the shared game clock
      # (kr-812 sub_A5FD30(dword_E82684 + 1748) minus 2000); clear, the receiver runs the plain
      # 60000 ms detonation countdown only on entry to state 2; state 5 retains the running timer
      # (kr-812 sub_4245B0 cases 2 and 5)
      offset: 24
      # kr-1256 sub_6D55D0 and cn-774 sub_897E80 read only five words; tw-454 sub_70B3F0 also reads bool32.
      except: [kr-1256]
      also: [tw-454]

  # C2S gcpBombState (kr-812 2012): the acting client's report, five four-byte words = 20 bytes.
  # The wire body is produced by the writer (serialize) kr-812 sub_503840, vtable 0xD1ECF8 slot 0, called
  # from the sender kr-812 sub_52A590, which stamps 2012. The class's
  # deserialize kr-812 sub_52FBA0 reads the same five words but the client never receives this number; it is
  # recorded here as the mirror that confirms the order, not as the direction.
  # The sender's first argument is the native operator reference and its second the new state; the tail is a
  # pointer to the position block. Proven at the plant entry point (kr-812 sub_423AE0: the decoded Character
  # +764 word is stored at manager +5388, game-context state +824 set to 1, then
  # kr-812 sub_52A590(manager + 5400)) and the defuse entry point (kr-812 sub_423C20: same decode stored at +5392,
  # state set to 4, kr-812 sub_52A590(manager + 5400)); the tick kr-812 sub_422850 sends the timer-driven
  # transitions 1->0/2 and 4->5/6 locally. Detonation 2/4->3 is gated by kr-812 sub_807260's
  # master/local-slot comparison (kr-812 sub_7FD460 -> kr-812 sub_689F80 writes master; kr-812 sub_48E210 reads local).
  # cn-717 sender cn-717 sub_560640 stamps 2012 (its writer body was not read); reader cn-717 sub_5390D0.
  # id-400: sender id-400 sub_4A8960 stamps 2011; reader id-400 sub_482500.
  gcpBombState:
    - operator: u32 # the native operator reference; see gspBombState.operator for the decoding evidence
      offset: 4
    - state: u32 # the reported state, one of the 0..6 cases tabled at gspBombState
      offset: 8
    - position_x: f32 # first of three floats from the sender's pointer argument (the manager's +5400 block)
      offset: 12
    - position_y: f32 # second float
      offset: 16
    - position_z: f32 # third float
      offset: 20

  # C2S gcpBombMissionOver (kr-812 2011): the report that ends the round, three four-byte words = 12 bytes.
  # Writer (serialize) kr-812 sub_7AA780, vtable 0xD1ECEC slot 0, called from the sender kr-812 sub_52AAC0,
  # which stamps 2011. The sender fills the object as +4 = its third argument,
  # +8 = its ECX argument, +12 = its EDX argument, so the wire order is stack argument, ECX, EDX. The class's
  # deserialize kr-812 sub_9D95D0 reads the same three words and is not a receive path.
  # kr-812 sub_422850 at 0x422CF6..0x422D09 pushes manager+5396 (winner), loads ECX from +5388
  # (planter), and EDX from +5392 (defuser). kr-812 sub_52A640 at 0x52A802..0x52A808 pushes the
  # opposite team with ECX=EDX=-1 for pre-arm elimination. Thus the FIRST wire word is the winning
  # team, not ECX: the decompiled call omits register arguments. Teams are 1 and 2; observer team is16.
  # cn-717 sender cn-717 sub_560CB0 stamps 2011; reader cn-717 sub_7F4370. id-400 sender id-400 sub_4A8E80
  # stamps 2010; reader id-400 sub_72E4D0.
  gcpBombMissionOver:
    - winning_team: u32 # stack argument: manager+5396 or the eliminated player's opposite team
      offset: 4
      # kr-1256 sub_7042B0, cn-774 sub_8C46A0 and tw-454 sub_738440 each write one byte then two words.
      kr-1256:
        - winning_team: u8
          offset: 4
    - planter: u32 # ECX argument: native operator stored at manager+5388, or -1 before arming
      offset: 8
    - defuser: u32 # EDX argument: native operator stored at manager+5392, or -1 without a defuser
      offset: 12

  # S2C gspObserver (kr-812 974): one four-byte word = 4 bytes. The bomb mission's respawn limit turns a
  # player into an observer; this is the packet that does it.
  # Reader (deserialize) kr-812 sub_80A910, vtable Packet_gspObserver 0xD1ED10 slot 0xD1ED14; writer
  # kr-812 sub_844A30. Dispatcher kr-812 sub_50B8C0: the `v6 = v4 - 974` branch calls handler
  # kr-812 sub_52A640, which constructs the packet and reads the
  # single word; the handler compares it with -1 and otherwise resolves a player object through the manager
  # (+784), so the word is a player reference. In mode 19 with the bomb armed (state >= 2) the handler
  # takes the bomb branch (defender loss through kr-812 sub_4256C0, attacker loss through
  # kr-812 sub_66EB90) and turns the player into an observer through kr-812 sub_52A550; before the bomb is
  # armed the room master instead sends gcpBombMissionOver with the opposite team only if no teammate
  # remains (kr-812 sub_52ACC0); other deaths do not end the round.
  # cn-717 reader cn-717 sub_8C4210, handler cn-717 sub_5606F0;
  # id-400 number 973, reader id-400 sub_93D120.
  # kr-812 sub_80A910 is a folded one-word reader shared with gspCreateCaptain and gcpDropCaptain (and
  # gspUserHostStart); the address alone does not identify a class, the dispatcher case and vtable do.
  gspObserver:
    - actor: u32 # kr-812 sub_506B80 inserts Character+404 as the key in game-manager+784;
      # kr-812 sub_52A640 looks up this scene-object key through kr-812 sub_72C530, not user_number
      offset: 4

  # S2C gspCreateCaptain (kr-812 982): one four-byte word = 4 bytes. The server chooses the captain; the
  # client has no request packet.
  # Reader (deserialize) kr-812 sub_80A910, vtable Packet_gspCreateCaptain 0xD692DC slot 0xD692E0; writer
  # kr-812 sub_844A30. Session dispatcher kr-812 sub_7FBBB0 `case 0x3D6:` (982) calls handler
  # kr-812 sub_7FDBA0, which constructs the packet, copies the word, stores it
  # through kr-812 sub_697690 at mode manager +20 and calls a manager virtual with 309.
  # Event 309 is kr-812 sub_4304C0: it takes the word, requires 0 <= word < the room's seat limit
  # (dword_D02104 by room kind) and word <= 0x20, and reads the character at game context +0x4A4 + 4*word,
  # the per-seat character table. With no character there it does nothing, so the announcement must follow
  # the characters' creation; otherwise it marks the character (+0x3288 = 1) and starts the 2000 ms
  # timer of the character's team (team 1 mode manager +0x191C, any other +0x1934).
  # cn-717: case 0x3D6 in cn-717 sub_87EFE0 -> handler cn-717 sub_881080,
  # reader cn-717 sub_8C4210. id-400: number 981, case 0x3D5 -> handler id-400 sub_784DE0, reader
  # id-400 sub_93D120. cn-717 sub_435330 marks the selected seat after character creation;
  # its drop path cn-717 sub_431430 derives the seat through cn-717 sub_574750.
  gspCreateCaptain:
    - seat: u32 # the Captain's seat index, the kr-812 sub_4304C0 per-seat character table index
      offset: 4

  # C2S gcpDropCaptain (kr-812 2018): one four-byte word = 4 bytes, sent for the local player's death.
  # Writer (serialize) kr-812 sub_844A30, vtable 0xD0BCBC slot 0; the sender kr-812 sub_439B10 stamps 2018.
  # The packet object is prepared by the death event 311, kr-812 sub_42BCE0, which compares the dying
  # character with the local player's (game context +0x67C index into the +0x66C table, then the +0x4A4
  # per-seat table) and sends only on a match. The word is the character's vtable +0x40, kr-812 sub_53BBA0:
  # (Character+404 - 1000000) / 100000, the seat, unless the mode manager answers event 169, which the
  # Captain manager's registration kr-812 sub_42A690 does not register. The send does not test whether the
  # dying character was the Captain: every local death in the room reports.
  # cn-717 sub_431430 reports the local death seat; cn-717 sub_43FB90 stamps 2018,
  # writer cn-717 sub_88E6C0 and reader cn-717 sub_8C4210 handle one word. id-400 class exists (id-400 sub_41E150), reader id-400 sub_93D120.
  gcpDropCaptain:
    - seat: u32 # the dying local player's own seat (kr-812 sub_53BBA0)
      offset: 4

  # S2C gspCaptainEvent (kr-812 994): one four-byte boolean = 4 bytes.
  # Reader (deserialize) kr-812 sub_80C160 (four bytes, converted to a boolean), vtable
  # Packet_gspCaptainEvent 0xD692E8 slot 0xD692EC; writer kr-812 sub_844CE0. Session dispatcher
  # kr-812 sub_7FBBB0 `case 0x3E2:` (994) calls handler kr-812 sub_7FDC20,
  # which calls the deserialize slot directly and then a dynamic-cast path; no
  # vftable label is stored, so the class identity is the vtable at kr-812 0xD692E8 plus that slot.
  # cn-717: case 0x3E2 in cn-717 sub_87EFE0 -> handler cn-717 sub_881100, reader cn-717 sub_8C3780.
  # id-400 has no such class (no vtable, no reference); absent there.
  # The handler stores the boolean at mode manager +0x194C, which the constructor kr-812 sub_428860 clears
  # (0x428B89); while set, kr-812 sub_43B760 skips hotkey slot 3 and kr-812 sub_435E80 skips a HUD refresh.
  # What sets it in a retail round is unknown, so the server never sends it.
  gspCaptainEvent:
    - unknown_4: bool # a four-byte boolean stored at mode manager +0x194C; its retail trigger is unknown
      offset: 4

  # C2S gppMobDropBombOnDead (kr-812 32877 game connection; 32874 relay-mirror): a mob dying in bomb
  # mission drops its bomb; eleven fields = 41 bytes (two u32, one u8, then eight u32).
  # Serializer kr-812 sub_6DB120 (the +12 word is read with the one-byte primitive kr-812 sub_A56BB0,
  # the rest with the four-byte kr-812 sub_A56C10); sender kr-812 sub_514FD0 stamps 32877 on the game
  # connection. The value stored at packet +4 selects a serial-counter bucket at
  # dword_E82684 + 4*((id - 1000000)/100000) + 644 (32 buckets); its entity role is not yet traced.
  # The last word's low 24 bits are replaced with the shared game clock's low 24 bits
  # (kr-812 sub_A5FD10(dword_E82684 + 1748)). Other argument meanings remain unknown.
  gppMobDropBombOnDead:
    - unknown_4: u32 # the sender derives the serial-counter bucket from this reference
      offset: 4
    - unknown_8: u32 # the sender's first argument; purpose not read
      offset: 8
    - unknown_12: u8 # one byte; purpose not read
      offset: 12
    - unknown_16: u32
      offset: 16
    - unknown_20: u32
      offset: 20
    - unknown_24: u32
      offset: 24
    - unknown_28: u32
      offset: 28
    - unknown_32: u32
      offset: 32
    - unknown_36: u32
      offset: 36
    - serial: u32 # the selected bucket's counter, incremented when the frame is sent
      offset: 40
    - unknown_44: u32 # low 24 bits copy the shared game clock; upper-bit semantics are not yet traced
      offset: 44
