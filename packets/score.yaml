  # -------------------------------------------------------------------------------------------------
  # The kr-1256 result scoreboard, S2C 614 (dispatcher kr-1256 sub_9E2FE0 case 0x266): the record is
  # built by kr-1256 sub_10D16A0 through the record's own virtual reader kr-1256 sub_429620 (RTTI
  # .?AVScoreData@@) and applied by kr-1256 sub_9E9A60, which splices it into session+1720. Everything
  # arrives in one body, but two of its repeats are gated by values this format cannot state as a single
  # structure: the three head vectors are sized by the leading u8 count (kr-1256 sub_429620 reads them
  # index-interleaved, one word of each per loop pass), and the row blocks and the two trailing word
  # arrays are gated by the bits of the u64 presence mask (kr-1256 sub_429620 walks bits 0..35 in three
  # separate loops). The record is therefore stated as the reader's own phases, and a writer composes
  # them in this order:
  #
  #   ScoreDataLead, head_count x ScoreHeadEntry, ScoreDataMask, one ScoreRow@kr-1256 then one
  #   ScoreGatedWord of the +18892 array and one of the +19036 array per set mask bit (ascending),
  #   ScoreDataTail.
  #
  # An empty record is 31 bytes; every present row adds 242 bytes plus twice its nickname characters,
  # every head index 12 bytes and every container entry 12 bytes. The kr-812 ScoreData above is a
  # different layout with the same class name; nothing but the name is shared.

  # cn-774 sub_490F80 and tw-454 sub_47E640 independently read this lead, the interleaved head entries,
  # the u64 mask, and two whole mask-gated word arrays. Each reader stops its three mask loops at 36.
  # Their row differences and enclosing packet tails are restated below.
  # The three leading words, read before any head entry (kr-1256 sub_429620).
  ScoreDataLead:
    - head_count: u8
      offset: 4
      only: [kr-1256]          # sizes only the three head vectors; the rows are gated by the mask below
    - winner_slot: u8
      offset: 452
      # Kept only when <=36, else -1 (kr-1256 sub_429620). In team results this is a team,
      # not a seat: cn-774 sub_4917E0 -> cn-774 sub_A91FB0 compares 1/2 with local seat+116;
      # zero selects ResultDraw. A live unspecified winner remains 255 on the wire.
      only: [kr-1256]
    - banner_gate: bool
      offset: 456
      only: [kr-1256]          # the same +456 gate the S2C 613 banner block tests (kr-1256 sub_9E9710)

  # One index of the three head vectors (kr-1256 sub_429620's interleaved loop). The +12 vector carries
  # the team totals: kr-1256 sub_9E9A60 copies +12/+16 to session+644/+648.
  ScoreHeadEntry:
    - team_total: u32
      offset: 12
      only: [kr-1256]
    - unknown_160: u32
      offset: 160
      only: [kr-1256]
    - unknown_308: u32
      offset: 308
      only: [kr-1256]

  # The u64 presence mask between the head vectors and the rows (kr-1256 sub_429620). Bit i set means the
  # body carries row i's block, one +18892 word and one +19036 word; all three loops stop at bit 35.
  ScoreDataMask:
    - presence_mask: u64
      only: [kr-1256]

  # One word of the +18892 array or the +19036 array, per set mask bit (kr-1256 sub_429620 reads the
  # whole +18892 array before the +19036 array). No word has a recovered meaning.
  ScoreGatedWord:
    - unknown_0: u32
      only: [kr-1256]

  # The kr-1256 restatement of one scoreboard row: the block one set mask bit announces (the per-bit
  # block of kr-1256 sub_429620; row constructor kr-1256 sub_428620). The named fields are the three
  # kr-1256 sub_9E5E70 seeds from a seat: +0 from seat+8 (the user number), +4 from the seat's nickname
  # string and +52 from seat+4, the team label byte the S2C 504 handler writes through kr-1256
  # sub_9E4C80. Offsets are the row object's own (row i sits at record+460+512i). Reward fields retain
  # the progress meanings consumed by kr-1256 sub_9E9A60; the other counters remain unknown.
  ScoreRow@kr-1256:
    - unknown_500: u32
      offset: 500              # kr-1256 sub_9E5E70 writes 1 for a seated player
    - user_number: u32
      offset: 0
    - nickname: wstr
      offset: 4
    - team: u8
      offset: 52
    # The twenty-seven stat words in wire order; kr-1256 sub_429620 stores them at +56, +60, +64, +68,
    # +80, +72, +84, +88, +92, +96, +104, +100, +108, +112, +120, +124, +128, +176, +132, +136, +140,
    # +364, +368, +372, +376, +380, +384 - the wire order is not the destination order.
    - level: u32
      offset: 56
