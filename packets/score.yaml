# Score structures of the legacy client builds: what the scoreboard of a round carries for one seat.
#
# The format of this file is described in packets/README.md and at the top of room.yaml.
#
# ScoreData, the block gspGameBroadcastPlayerScoreData carries, is in kr-812 (reader kr-812 sub_417720,
# constructor kr-812 sub_416910, handler kr-812 sub_804620):
#
#   u32 team_count                      (+4; 17 as sent)
#   list<u32>, list<u32>                (+304, +320; both empty as sent)
#   u32 winner_team                     (+296; -1 when built, the leading team when sent)
#   bool                                (+300)
#   team_count x (u32, u32, u32, u32)   (+12, +84, +156, +228, indexed by team from 1; the second is the
#                                        team's total, which kr-812 sub_805F90 compares between teams)
#   16 x ScoreRow                       (+336, 380 bytes each in the client's object)
#   16 x (u32, u32)                     (+6416, +6480; 0 and -1 as sent)
#
# The complete block and its fixed runs are tables below. Every row is always sent:
# a seat nobody sits in is written with the `vacant` values.
#
# A 4524-byte body (before the rewards) and a 4710-byte body (with them) are both consumed to the
# last byte by this layout.
version: 1
structs:
  # Existing scoreboard envelope, pinned by byte-length tests
  # and seven-build preservation fixtures. Row differences remain separate.
  # cn-406 sub_6FF0A0 / sub_6FEA10 prove sixteen teams and eight shorter rows;
  # cn-406 sub_708710 and sub_7087A0 consume the same object for live/result updates.
  ScoreData:
    - team_count: u32
      offset: 4
      default: 17
      cn-324:
        - team_count: u32
          offset: 4
          default: 16
      cn-279:
        - team_count: u32
          offset: 4
          default: 15
      cn-406:
        - team_count: u32
          offset: 4
          default: 16
    - unknown_304: empty_list
      offset: 304
      # cn-717 sub_4195B0 reads the winner immediately after team_count, without vectors.
      except: [cn-324, cn-717]
      also: [cn-735]
      id-400:
        - unknown_288: empty_list
          offset: 288
      cn-406:
        - unknown_272: empty_list
          offset: 272
      cn-706:
        - unknown_304: empty_list
          offset: 304
    - unknown_320: empty_list
      offset: 320
      except: [cn-324, cn-717]
      also: [cn-735]
      id-400:
        - unknown_304: empty_list
          offset: 304
      cn-406:
        - unknown_288: empty_list
          offset: 288
      cn-706:
        - unknown_320: empty_list
          offset: 320
    - winner_team: u32
      offset: 296
      default: -1
      except: [cn-324]
      id-400:
        - winner_team: u32
          offset: 280
          default: -1
      cn-406:
        - winner_team: u32
          offset: 264
          default: -1
      cn-706:
        - winner_team: u32
          offset: 296
          default: -1
    - unknown_300: bool
      offset: 300
      except: [cn-324]
      id-400:
        - unknown_284: bool
          offset: 284
      cn-406:
        - unknown_268: bool
          offset: 268
      cn-706:
        - unknown_300: bool
          offset: 300
    - teams: "ScoreTeam[17]"
      offset: 12
      cn-324:
        - teams: "ScoreTeam[16]"
          offset: 12
      cn-279:
        - teams: "ScoreTeam[15]"
          offset: 12
      cn-406:
        - teams: "ScoreTeam[16]"
          offset: 12
    - rows: "ScoreRow[16]"
      offset: 336
      id-400:
        - rows: "ScoreRow[8]"
          offset: 320
      cn-406:
        - rows: "ScoreRow[8]"
          offset: 304
      cn-706:
        - rows: "ScoreRow[12]"
          offset: 336
      # cn-404 sub_7AD7F0 reads twelve of id-400's rows, 356 bytes apart, from +336.
      cn-404:
        - rows: "ScoreRow[12]"
          offset: 336
      cn-324:
        - rows: "ScoreRow[8]"
          offset: 200
      cn-279:
        - rows: "ScoreRow[8]"
          offset: 188
    - tails: "ScoreTail[16]"
      offset: 6416
      id-400:
        - tails: "ScoreTail[8]"
          offset: 3136
      cn-406:
        - tails: "ScoreTail[8]"
          offset: 2960
      id-1809:
        - tails: "ScoreTail[16]"
          offset: 6096
      cn-706:
        - tails: "ScoreTail[12]"
          offset: 4656
      cn-404:
        - tails: "ScoreTail[12]"
          offset: 4608
      cn-324:
        - tails: "ScoreTail[8]"
          offset: 2440
      cn-279:
