          offset: 6096
      cn-706:
        - tails: "ScoreTail[12]"
          offset: 4656
      cn-404:
        - tails: "ScoreTail[12]"
          offset: 4608
      cn-324:
        - tails: "ScoreTail[8]"
          offset: 2440
      cn-279:
