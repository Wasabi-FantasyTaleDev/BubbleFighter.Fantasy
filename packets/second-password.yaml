# The legacy second-password requests and the notify result.
#
# The format of this file is described in packets/README.md and at the top of room.yaml.
#
# C2S 2001 (compare), 2002 (set) and 2003 (delete) in kr-812 are the classes
# Packet_gcpReqCompareSecondPassword (vtable kr-812 0xD49164), Packet_gcpReqSetSecondPassword
# (vtable kr-812 0xD97C78) and Packet_gcpReqDeleteSecondPassword (vtable kr-812 0xD97C84). All three
# deserialize through kr-812 sub_5C8FD0, and that reader is the shared wstr reader kr-812 sub_A56D70:
# one u32 character count followed by that many UTF-16 code units, written at object +4. There is no
# other field. The class setter is kr-812 sub_B25E90; the compare sender is kr-812 sub_6D8A90, and the
# set/delete stamps are kr-812 sub_A49570 and kr-812 sub_A495E0. This table records only that wire
# type: it does not state or invent a hash, an encoding beyond the counted UTF-16 string, or a storage
# format, and it does not prove whether the string is the plaintext password or a client-side
# transformed or pre-hashed form. Real password values never belong in tables, tests, logs or comments.
# The cn-404 and cn-408 rows say their request bodies match id-400's; the other legacy rows state the
# class. This pass read the kr-812 request body only.
#
# S2C 966 gspNotifySecondPassword in kr-812: dispatcher kr-812 sub_837170 case 966 -> handler
# kr-812 sub_834810. The packet reader is the one-word reader kr-812 sub_80A910 (u32 at object +4). The
# handler switches on that word: cases 1 through 8 drive its dialogs and set the client's local
# second-password state through kr-812 sub_6CFEF0(player, 0/1/2), and the player flags at +1220,
# +1224 and +1228 gate parts of it. The meanings of the individual result values were not proven, so
# the field stays `result` and a later binding must read the consuming UI before choosing values.
#
# S2C 961 gspNotifySecondPassword in kr-1256: dispatch case kr-1256 0x9D565D in kr-1256 sub_9D2FF0,
# label kr-1256 0x15B8774, handler kr-1256 sub_9C6E70. The handler reads one u32 (a four-byte stream
# read) and switches on it, so the modern body is the same one-word result shape as kr-812's. cn-774
# and tw-454 inherit the modern result body. Their own readers are not established here; no modern
# request layout is claimed.
version: 1
structs:
  SecondPasswordRequest:
    - password: wstr
      offset: 4
      except: [kr-1256, cn-774, tw-454]
  SecondPasswordResult:
    - result: u32
      offset: 4

  # kr-1256 sub_9C6E70 reads the result into a local, not a packet object.
  SecondPasswordResult@kr-1256:
    - result: u32
