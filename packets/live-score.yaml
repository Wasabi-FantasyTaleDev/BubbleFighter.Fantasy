# Live score vectors: kr-812 sub_80A8B0/sub_80A560 and sub_80A840/sub_80A750
# are the envelope and element readers/writers. Lists use u32 counts (kr-812 sub_80A870).
# The same widths and object offsets are independently present in cn-717
# sub_88ECB0/sub_88E790, id-1809 sub_7A6440/sub_7A63A0 and cn-706 sub_788AE0/sub_788A40.
# The counters are absolute and sent in this order.
# kr-812 sub_8046C0 constructs Packet_gspUpdateScoreData with a nested
# UpdateScoreData (vtable 0xD69450); the wrapper reader kr-812 sub_80A4F0
# delegates to kr-812 sub_80A8B0. Machine code at 0x80474C-0x8047A7 writes
# the team total and each seat's vector into a ScoreData copy before the HUD refresh.
# kr-812 sub_804850 assigns stat 0/24/10/29 to row offsets 44/48/56/64;
# these are absolute replacements, not additive score events.
# cn-279, cn-324 and id-400 retain their whole-scoreboard update path; this table
# does not enable a packet that their reviewed opcode tables do not expose.
# The kr-1256 restatement below carries the same frame in the modern number space
# (S2C 985, three counted lists instead of two).
version: 1
structs:
  RoundLiveScore:
    - team: u8
      offset: 4
      # Zero leaves team totals untouched while still applying seat vectors (kr-812 sub_8046C0).
    - total: u16
      offset: 6
    - scorer_slot: u8
      offset: 8
      default: 255
    - victim_slot: u8
      offset: 9
      default: 255
    - scorer_stats: "list<RoundLiveScoreStat>"
      offset: 12
    - victim_stats: "list<RoundLiveScoreStat>"
      offset: 28
  # Element readers/writers: cn-717 sub_88EC40/sub_88EB20,
  # id-1809 sub_7A6370/sub_7A6340 and cn-706 sub_788A10/sub_7889E0.
  RoundLiveScoreStat:
    - kind: u8
      offset: 4
    - value: u16
      offset: 6
  # The kr-1256 restatement (S2C 985, gspUpdateScoreData in profiles/kr-1256/opcodes.yaml, name matched
  # to the kr-812 class). Reader kr-1256 sub_9E3420 (985 branch) reads u8 team, u16 total, u8 slot, u8
  # slot, then THREE u32-counted lists of u8 kind + u16 value: the first two through kr-1256
  # sub_10D96F0 (4-byte packed elements), the third through kr-1256 sub_10D9890 (8-byte elements,
  # kind +0 and value +4; the wire element is the same u8 + u16, so the shared element structure
  # serves all three lists). The offsets are the stack record sub_9E3420 fills and the applier
  # kr-1256 sub_9E8B20 consumes: team +0, total +4, slots +6/+7, lists +8/+20/+32.
  # One structure states every body the reader accepts, so there are no separate phase tables:
  # kr-1256 sub_9E8B20 stores the total at its team index (+8 + 4*team), applies the first list to
  # the +6 seat's record and the second to the +7 seat's record when those slots are >= 0, and
  # applies the third list's kind/value pairs (at +156 + 4*kind) only in game modes 5 and 6 - the
  # 17-byte empty body (slots -1, three zero counts) is the same structure with absent seats.
  # cn-774 sub_8E33A0 (985) and tw-454 sub_A63910 (984) independently read the same envelope.
  # Their first two lists use cn-774 sub_1056B60 / tw-454 sub_EC4310, and their third lists use
  # cn-774 sub_10576A0 / tw-454 sub_EC49D0: u8 kind and u16 value despite the different native strides.
  RoundLiveScore@kr-1256:
    - team: u8
      offset: 0
      # cn-774 sub_8E33A0 skips the total write for zero, without skipping the seat vectors.
    - total: u16
      offset: 4
    - scorer_slot: u8
      offset: 6
      default: 255 # -1: kr-1256 sub_9E8B20 leaves the seat's record untouched when the slot is negative
    - victim_slot: u8
      offset: 7
      default: 255 # -1: same negative-slot gate as the first slot
    - scorer_stats: "list<RoundLiveScoreStat>"
      offset: 8
    - victim_stats: "list<RoundLiveScoreStat>"
      offset: 20
    # The third list has no kr-812 counterpart; kr-1256 sub_9E8B20 reads it only in modes 5 and 6,
    # so its purpose beyond those modes is not traced.
    - unknown_32: "list<RoundLiveScoreStat>"
      offset: 32
