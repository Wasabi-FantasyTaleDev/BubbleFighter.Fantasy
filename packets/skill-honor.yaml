version: 1
structs:
  # kr-1256 sub_9D18E0 reads a word then invokes kr-1256 sub_11522D0/sub_1152CA0.
  # Each outer entry has a key and its own counted slot records; it is not a flat word vector.
  SkillSlotChanged:
    - unknown_0: u32
      only: [kr-1256]
    - slots: "list<SkillSlotGroup>"
      only: [kr-1256]

  # kr-1256 sub_1152CA0 reads each group key before kr-1256 sub_1153580 reads its list.
  SkillSlotGroup:
    - unknown_0: u32
      only: [kr-1256]
    - entries: "list<SkillSlotEntry>"
      only: [kr-1256]

  # kr-1256 sub_1153580 reads an entry key then kr-1256 sub_1152150 reads five words.
  SkillSlotEntry:
    - unknown_0: u32
      only: [kr-1256]
    - value: SkillSlotValue
      only: [kr-1256]

  # Native UserSkillSlotInfo fields read by kr-1256 sub_1152150; meanings remain unproven.
  SkillSlotValue:
    - unknown_4: u32
      offset: 4
      only: [kr-1256]
    - unknown_8: u32
      offset: 8
      only: [kr-1256]
    - unknown_12: u32
      offset: 12
      only: [kr-1256]
    - unknown_16: u32
      offset: 16
      only: [kr-1256]
    - unknown_20: u32
      offset: 20
      only: [kr-1256]

  # S2C gspNotifyFavoriteWeaponGrade at kr-1256 1548. Dispatcher kr-1256 sub_9D2FF0 stores the class
  # vtable kr-1256 off_15B9288 for its case 1548 and calls kr-1256 sub_9D0E60, which reads a four-byte word,
  # an eight-byte value, then three four-byte words, 24 bytes in all. A nonzero first word prints a fixed
  # "points obtained" chat line and reads nothing else; a zero first word looks up the new grade's
  # UpgradeMessage row (kr-1256 sub_ED2EE0), names the weapon from the item id (kr-1256 sub_825A20) and
  # prints the promotion line when old < new, or a fixed demotion line when old > new. The eight-byte value
  # is read and discarded, so its meaning stays unknown. Names identify wire positions, not native object offsets.
  FavoriteWeaponGrade:
    - flag: bool
      only: [kr-1256]
      except: [cn-774, tw-454]
    - unknown_4: u64
      only: [kr-1256]
      except: [cn-774, tw-454]
    - item_id: u32
      only: [kr-1256]
      except: [cn-774, tw-454]
    - old_grade: u32
      only: [kr-1256]
      except: [cn-774, tw-454]
    - new_grade: u32
      only: [kr-1256]
      except: [cn-774, tw-454]
  # S2C gspHonorUserState at kr-1256 754 is not tabled. Handler kr-1256 sub_9D2660 reads three
  # four-byte words and then a counted list through kr-1256 sub_113B180; each element starts with a
  # two-byte value and continues in kr-1256 sub_113AF90 with a nested counted block and a
  # u16/u16/u32 group. That element record is not read yet, so the structure gets no fields here
  # until that pass; a partial body would pin bytes the client does not actually read.
