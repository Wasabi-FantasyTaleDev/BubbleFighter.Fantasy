version: 1
structs:
  # kr-812 sub_420EE0 writes and kr-812 sub_420F60 reads; kr-812 sub_5B3640 copies the menu mode to +4.
  # id-400 sub_567460, id-1809 sub_57E2D0 and cn-706 sub_563F00 supply the annotated differences.
  RoomMatchRequest:
    # id-400 sub_5CAB70 and id-1809 sub_57E720 copy menu+200/+256 into the same mode word.
    - mode_id: u32
      offset: 4
    - unknown_8: u32
      offset: 8
    - unknown_12: u32
      offset: 12
    - unknown_16: wstr
      offset: 16
    # kr-812 sub_68E450 / sub_68E640 / sub_68E9A0 set this for dedicated PvE entries.
    - dedicated_queue: bool
      offset: 44
    # kr-812 sub_5B3750 sets the second byte independently for the repeat-entry path.
    - retry_queue: bool
      offset: 45
    - unknown_48: u32
      offset: 48
    - unknown_52: wstr
      offset: 52
      id-400:
        - unknown_52: u32
          offset: 52
      id-1809:
        - unknown_52: u32
          offset: 52
    - unknown_80: u32
      offset: 80
      id-400:
        # id-400 sub_567460 calls the two-byte reader id-400 sub_9DD110.
        - unknown_56: u16
          offset: 56
      id-1809:
        # id-1809 sub_57E2D0 reads a full word here.
        - unknown_56: u32
          offset: 56
    - unknown_84: u32
      offset: 84
      except: [id-400, id-1809]
  # cn-717 sub_425230 omits the first string and shifts the remaining fields.
  RoomMatchRequest@cn-717:
    # cn-717 sub_5F5450 copies menu+268; cn-717 sub_6B8A10 switches on the same mode.
    - mode_id: u32
      offset: 4
    - unknown_8: u32
      offset: 8
    - unknown_12: u32
      offset: 12
    # cn-717 sub_6E9390 / sub_6E9590 / sub_6E9900 use dedicated modes 101/16/13.
    - dedicated_queue: bool
      offset: 16
    - retry_queue: bool
      offset: 17
    - unknown_20: u32
      offset: 20
    - unknown_24: wstr
      offset: 24
    - unknown_52: u32
      offset: 52
    - unknown_56: u32
      offset: 56
  # cn-406 sub_56A960 reads only three words, one string and two flags; the id-400 tail is absent.
  RoomMatchRequest@cn-406:
    # cn-406 sub_56EEC0 copies menu+192; dedicated entries cn-406 sub_582D10 / sub_582F10 / sub_583250 set 101/16/13.
    - mode_id: u32
      offset: 4
    - unknown_8: u32
      offset: 8
    - unknown_12: u32
      offset: 12
    - unknown_16: wstr
      offset: 16
    - dedicated_queue: bool
      offset: 44
    - retry_queue: bool
      offset: 45
  # cn-324 sub_45EA40; cn-324 sub_580820 sets mode, cn-324 sub_58CF60 sets the final flag.
  RoomMatchRequest@cn-324:
    - mode_id: u32
      offset: 4
    - unknown_8: u32
      offset: 8
    - dedicated_queue: bool
      offset: 12
  # cn-279 sub_7B2A40 selects the mode at menu+132; cn-279 sub_7A7300 copies it here.
  # cn-279 sub_47E650 reads two words; the second holds the menu's filter selection.
  RoomMatchRequest@cn-279:
    - mode_id: u32
      offset: 4
    - unknown_8: u32
      offset: 8
  # kr-1256 sends the quick-match request through one request-object serializer, kr-1256 sub_114E2E0
  # (vftable kr-1256 0x163BDD8 slot 0, RTTI RequestUserMysteryStore): a u8 type, then a u32, then a
  # type-specific tail. kr-1256 sub_E651C0 stamps C2S 128 on the packet and the serializer writes the
  # body before kr-1256 sub_961940 sends it. The base body below is the complete type 1 wire, the
  # party-dialog match start (kr-1256 sub_E5F070): the u32 stays zero and no mode word rides this type.
  RoomMatchRequest@kr-1256:
    - type: u8
      offset: 4
    # Every type writes it; the sites fill it from their context object or leave it zero. Whether it
    # names a party or a board listing is inferred from usage, not proven, so the meaning stays unknown.
    - unknown_8: u32
      offset: 8
  # Type 2 is the five-second re-request the stage tick sends while queued (kr-1256 sub_930130 through
  # kr-1256 sub_E64FC0, at most ten attempts): the u16 is the matching-window duration in seconds,
  # validated by the sender against the threshold table kr-1256 0x1642450 = {90, 120, 300, 1800}.
  RoomMatchKeepAlive@kr-812: []
  RoomMatchKeepAlive@kr-1256:
    - type: u8
      offset: 4
    - unknown_8: u32
      offset: 8
    - duration: u16
      offset: 12
  # Type 3 is the confirmed party join (kr-1256 sub_E33FD0): the u16 is the party member limit the
  # send branch compared against the current member count.
  RoomMatchPartyJoin@kr-812: []
  RoomMatchPartyJoin@kr-1256:
    - type: u8
      offset: 4
    - unknown_8: u32
      offset: 8
    - member_limit: u16
      offset: 14
  # Type 4 enters one board listing (kr-1256 sub_E6CE80): the u32 is the selected row's identity word
  # and the u16 its mode word, both copied from the row entry, whose walk is not decoded yet.
  RoomMatchListingEnter@kr-812: []
  RoomMatchListingEnter@kr-1256:
    - type: u8
      offset: 4
    - unknown_8: u32
      offset: 8
    - unknown_16: u32
      offset: 16
    - unknown_20: u16
      offset: 20
  # kr-812 sub_8B9660 reads; kr-812 sub_687640 opens waiting for result 0 and refuses for 1.
  # cn-717 sub_6D6290, id-400 sub_5EF130, id-1809 sub_62E6B0 and cn-406 sub_573350 agree.
  # kr-1256 sub_84F6C0 reads the same three fields for the MainMenuStage handler kr-1256 sub_8925A0
  # (case 128) and the LobbyStage handler kr-1256 sub_853CF0 through kr-1256 sub_853E90 (case 0x80);
  # kr-1256 sub_8926C0 opens DlgWaiting (kr-1256 sub_65B5A0) on result 0, as kr-812's gate does.
  RoomMatchNotification:
    - result: u32
      offset: 4
    - unknown_8: u32
      offset: 8
    - unknown_12: wstr
      offset: 12
      # id-400 sub_782DD0 reads only two words; cn-706 adds the string back.
      except: [id-400]
      also: [cn-706]
  # cn-324 sub_410910 reads one word; cn-324 sub_582880 uses zero for searching, one for refusal.
  # cn-279 sub_44C1A0 reads one word; cn-279 sub_7A6420 opens waiting for zero and refuses for one.
  RoomMatchNotification@cn-324:
    - result: u32
      offset: 4
  # C2S 53 on cn-774 and tw-454: the lobby-state request. cn-774 sub_64DCD0 stamps 53 and writes
  # one u32 state id (80 enters matching, 60 leaves it, and the DlgChannelPop tagged buttons carry
  # 30 and 20); tw-454 sub_4DCE50 writes the same body. The matching start pairs with the shared
  # gspNotifyMatch notification. kr-812 has no such request; kr-1256 stamps 53 for a different
  # purpose, so this structure is declared for the cn-774 lineage only.
  LobbyStateRequest@kr-812: []
  LobbyStateRequest@cn-774:
    - state_id: u32
      offset: 4
