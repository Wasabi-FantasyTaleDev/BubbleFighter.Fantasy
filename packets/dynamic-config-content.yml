# The DynamicConfig content kr-1256 is served: one entry per registry bit, each
# naming its schema in packets/dynamic-config.yaml and carrying the content rows that schema
# marshals. The values are stated decoded, field by field, so
# marshaling them reproduces those bodies byte for byte. Operators edit these rows to change
# what the server serves; a bit whose schema or content is missing is simply not served (the
# client applies the set bits in ascending order and abandons the frame at the first bad one).
# This file deliberately uses the .yml suffix: the packets directory's schema reader reads
# *.yaml layout files only, and these rows are content, not a layout.
