    - unknown_15: bool
      offset: 15
      only: [kr-1256]

  # 38284: kr-1256 reader kr-1256 sub_6D8832 (i32 actor, bool32 render flag, not a release command). No
  # kr-812 row for 38284.
  Unknown38284:
    - actor: u32
      offset: 0
      only: [kr-1256]
    - unknown_4: bool
      offset: 4
      only: [kr-1256]

  # ---------------------------------------------------------------------------------------------------
  # The client's own reports the in-game flow parses and never relays: the kr-1256 frames whose bodies the
  # payload helpers of src/BubbleFighter.Fantasy.InGame.Wire/Wire read. kr-812 has no frame at these numbers
  # (its C2S 25 is the clan passport, see PostSwapReport below), so every row is only: [kr-1256] and each
  # structure's baseline table is empty; gcpRoomReqLeaveGame is the one exception, empty in both builds. The
  # relay motion frames 20003 / 20004 stay the stop stated at the top of this file.
  #
  # Small scalar shapes that deliberately get no structure here: the empty C2S 17 (kr-1256 sub_9E7570, sent
  # after S2C 608), the empty C2S 577 (kr-1256 sub_9E1EB0 case 0x245 writes only the opcode) and the empty
  # C2S 625 (kr-1256 sub_6E5740) have no name in profiles/kr-1256/opcodes.yaml (the 625 row is Unknown625),
  # and a structure is stated only where a row names the packet. The one-word C2S 517 is room-modern.yaml
  # RoomPingRequest, the one-word C2S 607 is round-start.yaml RoundObjectAddRequest and the one-word C2S 571
  # flag is relay-connection.yaml RelayConnectionReport, so none of them is restated.
  # ---------------------------------------------------------------------------------------------------

  # C2S 518, the answer to S2C 517 gspReqPingUser: builder kr-1256 sub_9DF920 (reached from the room dispatcher
  # kr-1256 sub_9D9930) writes constant 0, then the u32 token it read from the S2C 517 frame, then the globals
  # dword_18E8F00 and *(dword_18E6844+72). The client's own reader of the server's S2C 518 is
  # kr-1256 sub_978F20, which takes a seat word and a trailing word it stores verbatim - that is the
  # three-word body packets/room-modern.yaml gspRepPingUser states, together with the raw helper's historical
  # direction mismatch this file does not contradict. kr-812 has no C2S 518 row.
  PingSample:
    - unknown_0: u32              # kr-1256 sub_9DF920 writes constant 0
      offset: 0
      only: [kr-1256]
    - token: u32                  # the u32 kr-1256 sub_9DF920 read from the S2C 517 frame
      offset: 4
      only: [kr-1256]
    - unknown_8: u32              # kr-1256 sub_9DF920 writes dword_18E8F00; purpose not traced
      offset: 8
      only: [kr-1256]
    - unknown_12: u32             # kr-1256 sub_9DF920 writes *(dword_18E6844+72); purpose not traced
      offset: 12
      only: [kr-1256]

  # C2S 25 of the game dialect, the weapon-preset post-swap report: builder kr-1256 sub_6DA420 (reached from
  # the S2C 836 apply path of the dispatcher kr-1256 sub_9D2FF0) writes the model's +448 dword, then its second
  # argument as one byte, and sends on the match connection (dword_18E7DAC). The byte is the preset slot the
  # status-zero S2C 836 apply landed on. The clan form at the same number is a different packet: the clan-server
  # dispatcher's kr-1256 sub_525170 stamps an empty C2S 25 (packets/clan.yaml ClanPassportRequest, the kr-812
  # gcpReqClanPassport of kr-812 sub_498E70), and this five-byte body never carries a clan meaning.
  PostSwapReport:
    - actor: u32                  # kr-1256 sub_6DA420 writes the model's +448 dword
      offset: 0
      only: [kr-1256]
    - slot: u8                    # kr-1256 sub_6DA420's second argument, the S2C 836 apply's preset slot
      offset: 4
      only: [kr-1256]

  # C2S 624, the death report: the wrapper kr-1256 sub_6E5840 builds the local record {argument dword, 0} and
  # the builder kr-1256 sub_708B60 writes it as two words, the second zero-extended from the record's byte. The
  # death path kr-1256 sub_B38850 passes 1, right after the empty C2S 625 (kr-1256 sub_6E5740); the timer paths
  # pass 0. Neither word's meaning is traced. This is not respawn.yaml RoundDeathReport: that is the kr-812
  # C2S 713 actor+delay shape, a different packet read by kr-812 sub_50E7B0.
  DeathReport:
    - unknown_0: u32              # kr-1256 sub_708B60 writes the wrapper's source dword; live senders write 1 or 0
      offset: 0
      only: [kr-1256]
    - unknown_4: u32              # kr-1256 sub_708B60 writes the source byte zero-extended; the wrapper always passes 0
      offset: 4
      only: [kr-1256]

  # C2S 608, the fixed gameplay-action family: builder kr-1256 sub_6DDBA0 (35 callers) writes this 16-byte body
  # for the type bytes 1, 2, 3, 4, 5, 6, 7, 23, 42, 44, 45, 46, 47, 71, 72, 73, 74, 75, 103, 106, 107, 108 and
  # 110 - the switch's first family; other type bytes are not this layout, so the table states the fixed family
  # and no other. The alternate-action sibling below is built by a callee of this builder.
  GameplayAction:
    - type: u8                    # the switch value kr-1256 sub_6DDBA0 writes first
      offset: 0
      only: [kr-1256]
    - unknown_1: u32
      offset: 1
      only: [kr-1256]
    - unknown_5: u32
      offset: 5
      only: [kr-1256]
    - unknown_9: u8
      offset: 9
      only: [kr-1256]
    - unknown_10: u8
      offset: 10
      only: [kr-1256]
    - unknown_11: u8
      offset: 11
      only: [kr-1256]
    - unknown_12: u16
      offset: 12
      only: [kr-1256]
    - unknown_14: u16
      offset: 14
      only: [kr-1256]

  # C2S 2029, the alternate action: builder kr-1256 sub_708660 (called from the 608 builder kr-1256 sub_6DDBA0
  # and from kr-1256 sub_CF1780) writes one byte, one word and one byte from its source record - 6 bytes; the
  # record keeps the word at +4 and the byte at +8, but the wire packs them without padding. No field's purpose
  # is traced.
  AlternateAction:
    - unknown_0: u8
      offset: 0
      only: [kr-1256]
    - unknown_1: u32
      offset: 1
      only: [kr-1256]
    - unknown_5: u8
      offset: 5
      only: [kr-1256]

  # C2S 578: builder kr-1256 sub_6DC970, called once from the stage loop kr-1256 sub_75B3E0 after its one-second
  # wait, writes 3000 when the room flag at +173 is set, else 5000 for the modes 7, 11, 17 and 21, else 0; then
  # its own argument; then two zero words. profiles/kr-1256/opcodes.yaml names the row
  # gcpGameReportMapLoadingComplete after kr-812's C2S 701 role; no word's purpose is traced here.
  RelayEndpointRequest:
    - unknown_0: u32              # kr-1256 sub_6DC970 writes 3000, 5000 or 0 from the room flag and the mode
      offset: 0
      only: [kr-1256]
    - unknown_4: u32              # kr-1256 sub_6DC970's argument
      offset: 4
      only: [kr-1256]
    - unknown_8: u32              # kr-1256 sub_6DC970 writes constant 0
      offset: 8
      only: [kr-1256]
    - unknown_12: u32             # kr-1256 sub_6DC970 writes constant 0
      offset: 12
      only: [kr-1256]

  # C2S 103, the result statistics: builder kr-1256 sub_113F230 (caller kr-1256 sub_9E80F0, the game-over flow)
  # writes thirty consecutive words from its source record and nothing else. No word's purpose is traced, so
  # they stay one run; the S2C 103 gspRepJoinSession at the same number is a different numeric space.
  GameResultStats:
    - unknown_0: "u32[30]"
      offset: 0
      only: [kr-1256]

  # C2S 506 gcpRoomReqLeaveGame: the kr-812 sender kr-812 sub_6711B0 and the kr-1256 sender kr-1256 sub_75F3F0
  # stamp the opcode and write no field, so the body is empty in both builds and the structure has no build
  # annotations.
  gcpRoomReqLeaveGame: []
