<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bubble Fighter Fantasy</title>
  <link rel="icon" href="./favicon.ico" sizes="any">
  <link rel="icon" href="./favicon.png" type="image/png" sizes="64x64">
  <script>
    // Set theme before first paint so the page never flashes the wrong one. The app takes over
    // once it mounts; this only mirrors its stored preference.
    (function () {
      try {
        var t = localStorage.getItem('noah_theme') ||
          (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { /* storage blocked: keep light */ }
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
