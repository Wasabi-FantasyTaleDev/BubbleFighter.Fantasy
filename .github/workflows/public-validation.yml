name: Public validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.repository == 'Wasabi-FantasyTaleDev/BubbleFighter.Fantasy'
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CI: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      RUSTUP_TOOLCHAIN: '1.90.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.x'
          cache: false
      - name: Prepare Rust and WebAssembly toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustup target add wasm32-wasip1 --toolchain 1.90.0
          exit $LASTEXITCODE
      - name: Validate the gate runner
        shell: pwsh
        run: |
          python -m unittest discover -s tools/ci -p 'test_*.py'
          exit $LASTEXITCODE
      - name: Run publicly reproducible gates
        shell: pwsh
        run: |
          python tools/ci/serial-gates.py --public --results-directory artifacts/validation/ci-${{ github.run_id }}-${{ github.run_attempt }}
          exit $LASTEXITCODE
      - name: Preserve validation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-gates-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/validation/ci-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 7
      - name: Install documentation dependencies
        working-directory: docs-site
        shell: pwsh
        run: |
          npm ci
          exit $LASTEXITCODE
      - name: Test documentation publication boundaries
        working-directory: docs-site
        shell: pwsh
        run: |
          npm test
          exit $LASTEXITCODE
      - name: Build the documentation site
        working-directory: docs-site
        shell: pwsh
        env:
          DOCS_BASE: '/'
        run: |
          npm run build
          exit $LASTEXITCODE
